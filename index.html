<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lista Pro v0.4.2</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    
    <style>
        :root { --bg: #0b0b0b; --card-bg: #1a1a1a; --item-bg: #262626; --text: #f0f0f0; --primary: #a87ff3; --success: #32a852; --danger: #eb4034; --grey: #333; --border: #444; --yellow: #ffff00; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: -apple-system, sans-serif; user-select: none; }
        body { background: var(--bg); color: var(--text); margin: 0; padding: 10px; display: flex; justify-content: center; min-height: 100vh; }
        
        .app-card { background: var(--card-bg); width: 100%; max-width: 400px; border-radius: 20px; padding: 15px; align-self: flex-start; }
        .col-label { font-size: 10px; text-align: center; color: #aaa; margin: 10px auto 8px; text-transform: uppercase; letter-spacing: 1px; background: var(--grey); padding: 4px 12px; border-radius: 20px; display: table; }
        
        .list-container { display: flex; flex-direction: column; gap: 8px; min-height: 30px; }
        .item-wrapper { position: relative; border-radius: 10px; overflow: hidden; background: #421a18; }
        
        .item { 
            background: var(--item-bg); padding: 10px 12px; border-radius: 10px; 
            display: flex; align-items: center; gap: 10px; position: relative; 
            z-index: 5; transition: transform 0.1s; border: 1px solid transparent; 
            touch-action: pan-y;
        }

        .drag-handle { color: #555; font-size: 22px; padding-right: 5px; cursor: grab; }
        .status-done { background: #1b3d26 !important; border-color: var(--success) !important; }
        .status-x { background: #421a18 !important; border-color: var(--danger) !important; }
        
        .btn-sm { width: 34px; height: 34px; border-radius: 8px; display: flex; align-items: center; justify-content: center; cursor: pointer; background: rgba(255,255,255,0.1); color: white; border: none; }
        .has-data { background: var(--yellow) !important; color: #000 !important; }

        /* Modalok */
        .custom-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 2000; justify-content: center; align-items: center; padding: 20px; }
        .modal-content { background: var(--card-bg); width: 100%; max-width: 340px; border-radius: 20px; padding: 35px 20px 20px; position: relative; border: 1px solid var(--border); user-select: auto; }
        .close-x { position: absolute; top: 5px; right: 15px; font-size: 30px; color: var(--danger); cursor: pointer; }
        
        input, textarea { width: 100%; padding: 12px; margin-bottom: 10px; border-radius: 10px; border: 1px solid var(--border); background: #000; color: #fff; outline: none; font-size: 16px; user-select: auto; }
        .action-btn { width: 100%; padding: 15px; border-radius: 10px; border: none; background: var(--primary); color: white; font-weight: bold; }
        
        .img-preview-box { width: 100%; max-height: 150px; object-fit: cover; border-radius: 10px; margin-bottom: 10px; border: 1px solid var(--border); }
    </style>
</head>
<body class="dark">

<div class="app-card">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
        <div style="font-size:10px; color:#444;">v0.4.2</div>
        <button onclick="clearAllItems()" style="background:none; border:none; font-size:18px; opacity:0.3;">🗑️</button>
    </div>
    
    <h2 style="text-align:center; font-size:19px; margin-bottom:20px; letter-spacing:1px;">BEVÁSÁRLÓ LISTA</h2>

    <div style="display:flex; gap:10px; margin-bottom:20px;">
        <button id="micBtn" style="flex:1; padding:15px; border-radius:12px; border:none; background:var(--primary); color:white; font-weight:bold;">🎤 HANG</button>
        <button onclick="openModal('inputModal')" style="flex:1; padding:15px; border-radius:12px; border:none; background:var(--grey); color:white; font-weight:bold;">⌨️ ÍRÁS</button>
    </div>

    <div class="col-label">Aktív tételek</div>
    <div id="activeItems" class="list-container" style="margin-bottom:15px;"></div>

    <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
        <div style="border: 1px solid var(--border); border-radius:15px; padding:5px;">
            <div class="col-label">Megvan</div>
            <div id="doneItems" class="list-container"></div>
        </div>
        <div style="border: 1px solid var(--border); border-radius:15px; padding:5px;">
            <div class="col-label">Nincs</div>
            <div id="missingItems" class="list-container"></div>
        </div>
    </div>
</div>

<div id="inputModal" class="custom-modal">
    <div class="modal-content">
        <div class="close-x" onclick="closeModal('inputModal')">×</div>
        <input type="text" id="manualInput" placeholder="Termék neve...">
        <textarea id="manualNote" placeholder="Megjegyzés..." rows="2"></textarea>
        
        <label style="display:block; text-align:center; padding:12px; background:#333; border-radius:10px; margin-bottom:10px; cursor:pointer; font-size:14px;">
            📷 Fotó hozzáadása
            <input type="file" id="newPhotoFile" accept="image/*" style="display:none" onchange="previewPhoto(this)">
        </label>
        <img id="newPhotoPreview" class="img-preview-box" style="display:none;">
        
        <button class="action-btn" onclick="addItem()">HOZZÁADÁS</button>
    </div>
</div>

<div id="infoModal" class="custom-modal">
    <div class="modal-content">
        <div class="close-x" onclick="closeModal('infoModal')">×</div>
        <h3 id="infoTitle" style="text-align:center; margin-top:0;"></h3>
        <div id="infoNoteDisplay" style="background:rgba(255,255,255,0.05); padding:15px; border-radius:10px; margin-bottom:10px; font-size:14px; text-align:center;"></div>
        <img id="infoPhotoImg" class="img-preview-box" style="display:none; max-height:250px; cursor:pointer;" onclick="window.open(this.src)">
        <button class="action-btn" style="background:var(--grey); margin-top:10px;" onclick="closeModal('infoModal')">BEZÁRÁS</button>
    </div>
</div>

<script>
    const firebaseConfig = { 
        apiKey: "AIzaSyC0fhL9VVErpN9LX6eJ8Tv5nuxF5Ea-qjE", 
        databaseURL: "https://kozoslista-e0717-default-rtdb.europe-west1.firebasedatabase.app", 
        projectId: "kozoslista-e0717"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const listRef = db.ref('shoppingList');
    let tempPhotoData = "";

    function openModal(id) { document.getElementById(id).style.display = 'flex'; }
    function closeModal(id) { document.getElementById(id).style.display = 'none'; }

    // Sorrendezés ≡ jellel
    new Sortable(document.getElementById('activeItems'), {
        handle: '.drag-handle',
        animation: 150,
        onEnd: function() {
            const items = document.querySelectorAll('#activeItems .item-wrapper');
            items.forEach((el, index) => listRef.child(el.getAttribute('data-id')).update({ order: Date.now() + index }));
        }
    });

    function previewPhoto(input) {
        if(input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = e => {
                tempPhotoData = e.target.result;
                const p = document.getElementById('newPhotoPreview');
                p.src = tempPhotoData; p.style.display = 'block';
            };
            reader.readAsDataURL(input.files[0]);
        }
    }

    function openInfo(id) {
        listRef.child(id).once('value', snap => {
            const it = snap.val();
            document.getElementById('infoTitle').innerText = it.text;
            document.getElementById('infoNoteDisplay').innerText = it.note || "Nincs megjegyzés";
            const img = document.getElementById('infoPhotoImg');
            if(it.photo) { img.src = it.photo; img.style.display = 'block'; } 
            else { img.style.display = 'none'; }
            openModal('infoModal');
        });
    }

    function render(items) {
        const c = { active: 'activeItems', done: 'doneItems', x: 'missingItems' };
        Object.values(c).forEach(id => document.getElementById(id).innerHTML = '');

        items.sort((a,b) => a.order - b.order).forEach(it => {
            const wrap = document.createElement('div');
            wrap.className = 'item-wrapper';
            wrap.setAttribute('data-id', it.id);
            wrap.innerHTML = `<div style="position:absolute;right:15px;top:50%;transform:translateY(-50%);color:white;font-size:10px;font-weight:bold;">TÖRLÉS</div>`;

            const div = document.createElement('div');
            div.className = `item ${it.status === 'done' ? 'status-done' : (it.status === 'x' ? 'status-x' : '')}`;
            const hasExtra = it.note || it.photo;

            div.innerHTML = `
                <div class="drag-handle">≡</div>
                <span style="flex:1;">${it.text}</span>
                <div style="display:flex; gap:5px;">
                    <button class="btn-sm ${hasExtra?'has-data':''}" onclick="openInfo('${it.id}')">ℹ️</button>
                    ${it.status === 'active' ? 
                        `<button class="btn-sm" style="background:var(--success)" onclick="listRef.child('${it.id}').update({status:'done'})">✔</button>
                         <button class="btn-sm" style="background:var(--danger)" onclick="listRef.child('${it.id}').update({status:'x'})">✖</button>` : 
                        `<button class="btn-sm" onclick="listRef.child('${it.id}').update({status:'active'})">↩</button>`
                    }
                </div>`;

            let startX = 0;
            div.addEventListener('touchstart', e => startX = e.touches[0].clientX, {passive: true});
            div.addEventListener('touchmove', e => {
                let diff = startX - e.touches[0].clientX;
                if (diff > 0 && diff < 100) div.style.transform = `translateX(-${diff}px)`;
            }, {passive: true});
            div.addEventListener('touchend', e => {
                if (startX - e.changedTouches[0].clientX > 80) { if(confirm("Törlöd?")) listRef.child(it.id).remove(); else div.style.transform = `translateX(0)`; } 
                else { div.style.transform = `translateX(0)`; }
            });

            wrap.appendChild(div);
            document.getElementById(c[it.status] || 'activeItems').appendChild(wrap);
        });
    }

    function addItem() {
        const val = document.getElementById('manualInput').value.trim();
        const note = document.getElementById('manualNote').value.trim();
        if (val) {
            listRef.push({ text: val, note: note, photo: tempPhotoData, status: 'active', order: Date.now() });
            document.getElementById('manualInput').value = '';
            document.getElementById('manualNote').value = '';
            document.getElementById('newPhotoPreview').style.display = 'none';
            tempPhotoData = "";
            closeModal('inputModal');
        }
    }

    listRef.on('value', snap => {
        const d = snap.val();
        render(d ? Object.keys(d).map(k => ({id: k, ...d[k]})) : []);
    });

    function clearAllItems() { if(confirm("Mindent törölsz?")) listRef.remove(); }
</script>
</body>
</html>
