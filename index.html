<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lista Pro v0.2.1</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-storage-compat.js"></script>
    <style>
        :root { --bg: #0b0b0b; --card-bg: #1a1a1a; --item-bg: #262626; --text: #f0f0f0; --primary: #a87ff3; --success: #32a852; --danger: #eb4034; --grey: #333; --yellow: #ffff00; }
        body.light { --bg: #e5e5ea; --card-bg: #ffffff; --item-bg: #f2f2f7; --text: #000000; --primary: #5856d6; --grey: #d1d1d6; }
        
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: sans-serif; }
        body { background: var(--bg); color: var(--text); margin: 0; padding: 10px; display: flex; justify-content: center; min-height: 100vh; transition: 0.3s; }
        
        .app-card { background: var(--card-bg); width: 100%; max-width: 400px; border-radius: 20px; padding: 15px; align-self: flex-start; box-shadow: 0 10px 30px rgba(0,0,0,0.3); position: relative; }
        
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .clear-all-btn { background: none; border: none; font-size: 18px; cursor: pointer; opacity: 0.5; }

        .list-container { display: flex; flex-direction: column; gap: 8px; min-height: 50px; border-radius: 10px; padding: 5px; }
        /* Oszlop színek */
        #doneItems { background: rgba(50, 168, 82, 0.05); }
        #missingItems { background: rgba(235, 64, 52, 0.05); }
        
        .col-label { font-size: 10px; text-align: center; color: #666; margin-bottom: 5px; text-transform: uppercase; }

        .item-wrapper { position: relative; border-radius: 10px; overflow: hidden; }
        .item { background: var(--item-bg); padding: 10px 12px; border-radius: 10px; display: flex; align-items: center; gap: 10px; position: relative; z-index: 2; transition: 0.2s; }
        
        .btn-sm { border: none; width: 34px; height: 34px; border-radius: 8px; display: flex; align-items: center; justify-content: center; cursor: pointer; background: rgba(255,255,255,0.1); color: white; }
        .has-note-btn { background: var(--yellow) !important; color: #000 !important; }

        /* MODAL JAVÍTÁS */
        .custom-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 2000; justify-content: center; align-items: center; padding: 20px; }
        .modal-content { background: var(--card-bg); width: 100%; max-width: 340px; border-radius: 20px; padding: 30px 20px 20px; position: relative; border: 1px solid #333; }
        
        /* Tisztán csak az X, piros háttér nélkül, pontos pozícióval */
        .close-x { position: absolute; top: 12px; right: 15px; background: none; color: var(--text); font-size: 24px; cursor: pointer; line-height: 1; opacity: 0.7; }

        input, textarea { width: 100%; padding: 12px; margin-bottom: 10px; border-radius: 10px; border: 1px solid #444; background: #000; color: #fff; outline: none; }
        
        .note-box { background: rgba(255,255,0,0.02); border: 1px solid rgba(255,255,0,0.3); padding: 15px; border-radius: 12px; display: flex; flex-direction: column; }
        .note-text { color: var(--text); font-size: 15px; line-height: 1.5; word-wrap: break-word; text-align: center; margin-bottom: 15px; }
        .note-actions { display: flex; justify-content: center; gap: 50px; padding-top: 10px; border-top: 1px solid rgba(255,255,0,0.1); }
        .note-action-btn { background: none; border: none; font-size: 26px; cursor: pointer; }

        .img-area { width: 100%; border-radius: 12px; margin-bottom: 15px; border: 1px solid #333; cursor: pointer; min-height: 120px; display: flex; align-items: center; justify-content: center; background: #000; overflow: hidden; }
        .img-area img { width: 100%; height: auto; }
        
        .delete-reveal { position: absolute; right: 0; top: 0; bottom: 0; width: 70px; background: var(--danger); display: flex; align-items: center; justify-content: center; color: white; font-size: 11px; z-index: 1; font-weight: bold; }
    </style>
</head>
<body class="dark">

<div class="app-card">
    <div class="top-bar">
        <div style="font-size:10px; color:#444;">v0.2.1</div>
        <div style="display:flex; gap:15px; align-items:center;">
            <button onclick="clearAllItems()" class="clear-all-btn">🗑️</button>
            <div onclick="document.body.classList.toggle('light')" style="cursor:pointer;">🌓</div>
        </div>
    </div>
    
    <h2 style="text-align:center; font-size:19px; margin-bottom:20px; letter-spacing:1px;">BEVÁSÁRLÓ LISTA</h2>
    
    <div style="display:flex; gap:10px; margin-bottom:20px;">
        <button id="micBtn" style="flex:1; padding:15px; border-radius:12px; border:none; background:var(--primary); color:white; font-weight:bold;">🎤 HANG</button>
        <button onclick="openModal('inputModal')" style="flex:1; padding:15px; border-radius:12px; border:none; background:var(--grey); color:white; font-weight:bold;">⌨️ ÍRÁS</button>
    </div>

    <div class="col-label">Aktív tételek</div>
    <div id="activeItems" class="list-container"></div>
    
    <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px; margin-top:20px;">
        <div>
            <div class="col-label" style="color:var(--success)">Megvan</div>
            <div id="doneItems" class="list-container"></div>
        </div>
        <div>
            <div class="col-label" style="color:var(--danger)">Nincs</div>
            <div id="missingItems" class="list-container"></div>
        </div>
    </div>
</div>

<div id="inputModal" class="custom-modal">
    <div class="modal-content">
        <div class="close-x" onclick="closeModal('inputModal')">✕</div>
        <input type="text" id="manualInput" placeholder="Termék neve...">
        <textarea id="manualNote" placeholder="Megjegyzés..." rows="2"></textarea>
        <div id="fileBtn" onclick="document.getElementById('fileIn').click()" style="border:1px dashed #444; padding:15px; text-align:center; border-radius:10px; color:#888; cursor:pointer;">📷 Kép hozzáadása</div>
        <input type="file" id="fileIn" hidden accept="image/*">
        <button onclick="addItem()" style="width:100%; padding:15px; border-radius:10px; border:none; background:var(--primary); color:white; font-weight:bold; margin-top:15px;">HOZZÁADÁS</button>
    </div>
</div>

<div id="detailsModal" class="custom-modal">
    <div class="modal-content">
        <div class="close-x" onclick="closeModal('detailsModal')">✕</div>
        <h3 id="detTitle" style="margin-top:0; text-align:center; font-size:17px;"></h3>
        <div id="detImgArea" class="img-area"></div>
        <div id="detNoteView"></div>
        <div id="detEditView" style="display:none;">
            <textarea id="editNoteInput" rows="5"></textarea>
            <button onclick="saveNote()" style="width:100%; padding:15px; background:var(--primary); color:white; border:none; border-radius:10px; font-weight:bold;">MENTÉS</button>
        </div>
        <input type="file" id="fileInExtra" hidden accept="image/*">
    </div>
</div>

<script>
    const firebaseConfig = { 
        apiKey: "AIzaSyC0fhL9VVErpN9LX6eJ8Tv5nuxF5Ea-qjE", 
        databaseURL: "https://kozoslista-e0717-default-rtdb.europe-west1.firebasedatabase.app", 
        projectId: "kozoslista-e0717",
        storageBucket: "kozoslista-e0717.firebasestorage.app"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const storage = firebase.storage();
    const listRef = db.ref('shoppingList');

    let currentId = null, tempUrl = "";

    function openModal(id) { document.getElementById(id).style.display = 'flex'; }
    function closeModal(id) { 
        document.getElementById(id).style.display = 'none';
        document.getElementById('detNoteView').style.display = 'block';
        document.getElementById('detEditView').style.display = 'none';
        tempUrl = ""; 
        document.getElementById('fileBtn').innerText = "📷 Kép hozzáadása";
    }

    async function handleFile(file, isExtra) {
        if(!file) return;
        const ref = storage.ref('img/' + Date.now() + "_" + file.name);
        const task = ref.put(file);
        task.on('state_changed', null, null, async () => {
            const url = await ref.getDownloadURL();
            if(isExtra && currentId) {
                await listRef.child(currentId).update({ img: url });
                refreshDetails(currentId);
            } else {
                tempUrl = url;
                document.getElementById('fileBtn').innerText = "✅ Kép OK";
            }
        });
    }

    document.getElementById('fileIn').onchange = e => handleFile(e.target.files[0], false);
    document.getElementById('fileInExtra').onchange = e => handleFile(e.target.files[0], true);

    function addItem() {
        const t = document.getElementById('manualInput').value.trim();
        const n = document.getElementById('manualNote').value.trim();
        if(t) { 
            listRef.push({ text: t, note: n, img: tempUrl, status: 'active', order: Date.now() }); 
            closeModal('inputModal');
            document.getElementById('manualInput').value=""; document.getElementById('manualNote').value="";
        }
    }

    function clearAllItems() {
        if(confirm("Törlöd a teljes listát?")) listRef.remove();
    }

    async function refreshDetails(id) {
        const s = await listRef.child(id).get();
        const d = s.val();
        openDetails(id, d.text, d.note, d.img);
    }

    function openDetails(id, text, note, img) {
        currentId = id;
        document.getElementById('detTitle').innerText = text;
        const imgArea = document.getElementById('detImgArea');
        imgArea.innerHTML = img ? `<img src="${img}" onclick="window.open('${img}')">` : `<div onclick="document.getElementById('fileInExtra').click()" style="color:#555">📷 Kép hozzáadása</div>`;
        
        const noteView = document.getElementById('detNoteView');
        if(note && note.trim() !== "") {
            noteView.innerHTML = `<div class="note-box">
                <div class="note-text">${note}</div>
                <div class="note-actions">
                    <button class="note-action-btn" onclick="switchToEdit(\`${note.replace(/`/g, '\\`')}\`)">✏️</button>
                    <button class="note-action-btn" onclick="deleteNote()">🗑️</button>
                </div>
            </div>`;
        } else {
            noteView.innerHTML = `<div style="border:1px dashed #444; padding:20px; text-align:center; border-radius:12px; color:#666; cursor:pointer;" onclick="switchToEdit('')">➕ Megjegyzés hozzáadása</div>`;
        }
        openModal('detailsModal');
    }

    function switchToEdit(val) {
        document.getElementById('detNoteView').style.display = 'none';
        document.getElementById('detEditView').style.display = 'block';
        document.getElementById('editNoteInput').value = val;
    }

    function saveNote() {
        listRef.child(currentId).update({ note: document.getElementById('editNoteInput').value.trim() });
        closeModal('detailsModal');
    }

    function deleteNote() {
        if(confirm("Törlöd?")) { listRef.child(currentId).update({ note: "" }); closeModal('detailsModal'); }
    }

    listRef.on('value', snap => {
        const data = snap.val();
        render(data ? Object.keys(data).map(k => ({id:k, ...data[k]})) : []);
    });

    function render(items) {
        const conts = { active: document.getElementById('activeItems'), done: document.getElementById('doneItems'), x: document.getElementById('missingItems') };
        Object.values(conts).forEach(c => c.innerHTML = '');
        items.sort((a,b) => a.order - b.order).forEach(it => {
            const wrap = document.createElement('div');
            wrap.className = 'item-wrapper';
            wrap.innerHTML = `<div class="delete-reveal" onclick="db.ref('shoppingList/${it.id}').remove()">TÖRLÉS</div>`;
            const div = document.createElement('div');
            div.className = 'item';
            const hasC = (it.note && it.note.trim() !== "") || it.img;
            div.innerHTML = `<span style="flex:1">${it.text}</span>
                <div style="display:flex; gap:5px;">
                    <button class="btn-sm ${hasC?'has-note-btn':''}" onclick="openDetails('${it.id}','${it.text.replace(/'/g, "\\'")}','${(it.note||"").replace(/'/g, "\\'")}','${it.img||''}')">ℹ️</button>
                    ${it.status==='active'? `<button class="btn-sm" style="background:var(--success)" onclick="db.ref('shoppingList/${it.id}').update({status:'done'})">✔</button>
                    <button class="btn-sm" style="background:var(--danger)" onclick="db.ref('shoppingList/${it.id}').update({status:'x'})">✖</button>` : 
                    `<button class="btn-sm" onclick="db.ref('shoppingList/${it.id}').update({status:'active'})">↩</button>`}
                </div>`;
            initSwipe(div);
            wrap.appendChild(div);
            const target = it.status==='done'?'done':(it.status==='x'?'x':'active');
            if(conts[target]) conts[target].appendChild(wrap);
        });
    }

    function initSwipe(el) {
        let sX = 0;
        el.addEventListener('touchstart', e => sX = e.touches[0].clientX);
        el.addEventListener('touchmove', e => { 
            let dX = sX - e.touches[0].clientX; 
            if(dX > 20 && dX < 90) el.style.transform = `translateX(-${dX}px)`; 
        });
        el.addEventListener('touchend', e => el.style.transform = (sX - e.changedTouches[0].clientX > 50) ? 'translateX(-75px)' : 'translateX(0)');
    }
</script>
</body>
</html>
