<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bevásárló lista</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        :root { --bg: #000000; --card-bg: #121212; --item-bg: #1e1e1e; --text: #e0e0e0; --primary: #bb86fc; --success: #2e7d32; --danger: #c62828; --grey: #252525; }
        body.light { --bg: #d1d1d6; --card-bg: #f0f0f7; --item-bg: #ffffff; --text: #1c1c1e; --primary: #5856d6; --success: #34c759; --danger: #ff3b30; --grey: #e5e5ea; }
        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; touch-action: manipulation; user-select: none !important; -webkit-user-select: none !important; }
        input { user-select: text !important; -webkit-user-select: text !important; }
        body { background: var(--bg); color: var(--text); font-family: sans-serif; margin: 0; padding: 5px; display: flex; justify-content: center; min-height: 100vh; }
        .app-card { background: var(--card-bg); width: 100%; max-width: 380px; border-radius: 15px; padding: 12px; box-shadow: 0 8px 25px rgba(0,0,0,0.5); position: relative; align-self: flex-start; }
        .version { position: absolute; top: 6px; left: 12px; font-size: 8px; color: #444; }
        .header { text-align: center; margin-bottom: 8px; border-bottom: 1px solid #333; padding-bottom: 5px; padding-top: 8px; }
        .theme-btn { position: absolute; top: 8px; right: 12px; font-size: 18px; border: none; background: none; cursor: pointer; color: var(--text); padding: 5px; }
        #notifBtn { font-size: 9px; background: #222; color: #777; border: none; padding: 4px 10px; border-radius: 20px; margin-bottom: 6px; cursor: pointer; }
        #notifBtn.active { background: var(--success); color: white; }
        .btn-row { display: flex; gap: 5px; margin-bottom: 8px; }
        .main-btn { flex: 1; padding: 10px; border-radius: 8px; border: none; font-weight: bold; font-size: 11px; color: white; text-transform: uppercase; cursor: pointer; }
        .list-container { display: flex; flex-direction: column; gap: 2px; min-height: 10px; }
        .bottom-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 8px; }
        .column-label { text-align: center; font-size: 10px; font-weight: bold; margin-bottom: 4px; padding: 4px; border-radius: 5px; background: var(--grey); }
        .item { background: var(--item-bg); padding: 3px 8px; border-radius: 5px; display: flex; align-items: center; justify-content: space-between; gap: 5px; min-height: 34px; }
        .item.dragging { opacity: 0.5; background: #444; }
        .item.checked { background: var(--success) !important; color: white; }
        .item.cancelled { background: var(--danger) !important; color: white; }
        .item-text { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; pointer-events: none; }
        .actions { display: flex; gap: 3px; flex-shrink: 0; }
        .btn-sm { border: none; width: 26px; height: 26px; border-radius: 4px; display: flex; align-items: center; justify-content: center; color: white; cursor: pointer; background: rgba(255,255,255,0.12); font-size: 12px; }
        #inputModal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.92); justify-content: center; align-items: flex-start; padding-top: 15vh; z-index: 1000; }
        .modal-content { background: var(--item-bg); padding: 15px; border-radius: 12px; width: 85%; max-width: 280px; border: 1px solid #333; }
        .modal-content input { width: 100%; padding: 12px; margin-bottom: 12px; border-radius: 8px; border: 1px solid #444; background: var(--bg); color: var(--text); font-size: 16px; outline: none; -webkit-user-select: text; }
        .clear-all { background: none; color: var(--danger); border: 1px solid var(--danger); margin-top: 20px; width: 100%; padding: 8px; font-size: 9px; border-radius: 6px; font-weight: bold; opacity: 0.4; }
    </style>
</head>
<body class="dark">
<div class="app-card">
    <div class="version">v2.1</div>
    <button class="theme-btn" id="themeIcon" onclick="toggleTheme()">☀️</button>
    <div class="header">
        <h2 style="margin:0; font-size: 16px; letter-spacing: 1px;">BEVÁSÁRLÓ LISTA</h2>
        <button id="notifBtn" onclick="toggleNotifications()">🔔 Értesítések: KI</button>
    </div>
    <div class="btn-row">
        <button id="micBtn" class="main-btn" style="background: var(--primary);">🎤 HANG</button>
        <button id="writeBtn" class="main-btn" style="background: var(--grey); color: var(--text);">⌨️ ÍRÁS</button>
    </div>
    <div id="activeItems" class="list-container"></div>
    <div class="bottom-grid">
        <div><div class="column-label">TALÁLTAM</div><div id="doneItems" class="list-container"></div></div>
        <div><div class="column-label">NINCS</div><div id="missingItems" class="list-container"></div></div>
    </div>
    <button class="clear-all" onclick="clearAll()">LISTA TÖRLÉSE</button>
</div>
<div id="inputModal">
    <div class="modal-content">
        <input type="text" id="manualInput" placeholder="Termék neve..." autocomplete="off">
        <div class="btn-row" style="margin-bottom:0">
            <button class="main-btn" style="background:#444;" onclick="closeModal()">MÉGSE</button>
            <button class="main-btn" style="background:var(--primary);" id="confirmBtn">OK</button>
        </div>
    </div>
</div>

<script>
    const firebaseConfig = { apiKey: "AIzaSyC0fhL9VVErpN9LX6eJ8Tv5nuxF5Ea-qjE", databaseURL: "https://kozoslista-e0717-default-rtdb.europe-west1.firebasedatabase.app", projectId: "kozoslista-e0717" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const listRef = db.ref('shoppingList');
    let shoppingList = [];
    let isFirstLoad = true;
    let notifsEnabled = localStorage.getItem('notifsEnabled') === 'true';

    // FÓKUSZ JAVÍTÁS
    const writeBtn = document.getElementById('writeBtn');
    const inputField = document.getElementById('manualInput');
    const modal = document.getElementById('inputModal');

    const openInput = (e) => {
        e.preventDefault();
        modal.style.display = 'flex';
        // Azonnali fókusz kényszerítése több módszerrel
        inputField.focus();
        setTimeout(() => inputField.focus(), 10);
        setTimeout(() => inputField.focus(), 100);
    };

    writeBtn.addEventListener('touchstart', openInput);
    writeBtn.addEventListener('click', openInput);

    function closeModal() { modal.style.display = 'none'; inputField.value = ''; }
    function handleManualAdd() { const val = inputField.value.trim(); if(val) { addItem(val); closeModal(); } }
    document.getElementById('confirmBtn').onclick = handleManualAdd;
    inputField.onkeypress = (e) => { if(e.key === 'Enter') handleManualAdd(); };

    // Értesítések
    function updateNotifButton() {
        const btn = document.getElementById('notifBtn');
        if (notifsEnabled && Notification.permission === "granted") { btn.innerText = "✅ Értesítések: BE"; btn.classList.add('active'); }
        else { btn.innerText = "🔔 Értesítések: KI"; btn.classList.remove('active'); }
    }
    function toggleNotifications() {
        if (!notifsEnabled) { Notification.requestPermission().then(p => { if(p==="granted") { notifsEnabled=true; localStorage.setItem('notifsEnabled','true'); } updateNotifButton(); }); }
        else { notifsEnabled=false; localStorage.setItem('notifsEnabled','false'); updateNotifButton(); }
    }

    listRef.on('value', (snapshot) => {
        const data = snapshot.val();
        const newList = data ? Object.keys(data).map(key => ({ id: key, ...data[key] })) : [];
        if (!isFirstLoad && newList.length > shoppingList.length) {
            const newest = newList[newList.length - 1];
            if (newest.status === 'active' && notifsEnabled && Notification.permission === "granted") {
                new Notification("Bevásárló Lista", { body: "Új termék: " + newest.text });
            }
        }
        shoppingList = newList; isFirstLoad = false; renderAll();
    });

    function renderAll() {
        const containers = { active: document.getElementById('activeItems'), done: document.getElementById('doneItems'), x: document.getElementById('missingItems') };
        Object.values(containers).forEach(c => c.innerHTML = '');
        shoppingList.sort((a, b) => (a.order || 0) - (b.order || 0)).forEach(item => {
            const div = document.createElement('div');
            div.className = `item ${item.status === 'done' ? 'checked' : (item.status === 'x' ? 'cancelled' : '')}`;
            div.dataset.id = item.id;
            div.innerHTML = `<span class="item-text">${item.text}</span><div class="actions">
                ${item.status === 'active' ? `<button class="btn-sm" style="background:#4caf50" onclick="updateStatus('${item.id}','done')">✔</button><button class="btn-sm" style="background:#f44336" onclick="updateStatus('${item.id}','x')">✖</button>` : `<button class="btn-sm" style="background:#555" onclick="updateStatus('${item.id}','active')">↩</button>`}
                <button class="btn-sm" style="background:#444" onclick="deleteItem('${item.id}')">🗑</button></div>`;
            if(item.status === 'active') { div.addEventListener('touchstart', startDrag, {passive: true}); div.addEventListener('touchmove', moveDrag, {passive: false}); div.addEventListener('touchend', endDrag); }
            containers[item.status === 'active' ? 'active' : (item.status === 'done' ? 'done' : 'x')].appendChild(div);
        });
    }

    function addItem(t) { listRef.push({ text: t, status: 'active', order: Date.now(), time: Date.now() }); }
    function updateStatus(id, s) { listRef.child(id).update({ status: s, time: Date.now() }); }
    function deleteItem(id) { if(confirm("Törlöd?")) listRef.child(id).remove(); }
    function toggleTheme() { document.body.classList.toggle('light'); const isLight = document.body.classList.contains('light'); document.getElementById('themeIcon').innerText = isLight ? '🌙' : '☀️'; }
    function clearAll() { if(confirm("Mindent törölsz?")) listRef.remove(); }
    
    // DRAG
    let dragTimer;
    function startDrag(e) { if(e.target.tagName === 'BUTTON') return; const el = e.currentTarget; dragTimer = setTimeout(() => { el.classList.add('dragging'); if("vibrate" in navigator) navigator.vibrate(40); }, 350); }
    function moveDrag(e) { const el = document.querySelector('.dragging'); if(!el) return; e.preventDefault(); const container = document.getElementById('activeItems'); const touch = e.touches[0]; const afterElement = [...container.querySelectorAll('.item:not(.dragging)')].reduce((closest, child) => { const box = child.getBoundingClientRect(); const offset = touch.clientY - box.top - box.height / 2; if (offset < 0 && offset > closest.offset) return { offset: offset, element: child }; else return closest; }, { offset: Number.NEGATIVE_INFINITY }).element; if (afterElement == null) container.appendChild(el); else container.insertBefore(el, afterElement); }
    function endDrag() { clearTimeout(dragTimer); const el = document.querySelector('.dragging'); if(!el) return; el.classList.remove('dragging'); const updates = {}; document.querySelectorAll('#activeItems .item').forEach((item, index) => { updates[`${item.dataset.id}/order`] = index; }); listRef.update(updates); }

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SpeechRecognition) {
        recognition = new SpeechRecognition(); recognition.lang = 'hu-HU';
        recognition.onresult = (e) => { addItem(e.results[0][0].transcript); stopMic(); };
        recognition.onerror = stopMic; recognition.onend = stopMic;
    }
    function stopMic() { document.getElementById('micBtn').innerText = "🎤 HANG"; document.getElementById('micBtn').style.background = "var(--primary)"; }
    document.getElementById('micBtn').onclick = () => { try { recognition.start(); document.getElementById('micBtn').innerText = "🛑 FIGYELEK..."; document.getElementById('micBtn').style.background = "#ff3b30"; } catch(e) { recognition.stop(); stopMic(); } };

    updateNotifButton();
</script>
</body>
</html>
