<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Közös Bolt Pro</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        :root {
            --bg: #121212; --card: #1e1e1e; --text: #e0e0e0;
            --primary: #bb86fc; --success: #2e7d32; --danger: #c62828; --grey: #333;
        }
        body.light {
            --bg: #f0f0f7; --card: #ffffff; --text: #1c1c1e;
            --primary: #5856d6; --success: #34c759; --danger: #ff3b30; --grey: #e5e5ea;
        }
        * { 
            -webkit-tap-highlight-color: transparent; 
            user-select: none !important; 
            -webkit-user-select: none !important; 
            box-sizing: border-box; 
        }
        body { background: var(--bg); color: var(--text); font-family: sans-serif; margin: 0; padding: 8px; transition: 0.2s; overflow-x: hidden; }
        .header { display: flex; justify-content: space-between; align-items: center; padding: 5px; }
        .theme-btn { font-size: 20px; cursor: pointer; border: none; background: none; color: var(--text); }
        .btn-row { display: flex; gap: 5px; margin-bottom: 10px; }
        .main-btn { flex: 1; padding: 12px; border-radius: 8px; border: none; font-weight: bold; font-size: 12px; color: white; text-transform: uppercase; cursor: pointer; }
        
        /* MODAL */
        #inputModal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); justify-content: center; align-items: flex-start; padding-top: 10vh; z-index: 1000;
        }
        .modal-content { 
            background: var(--card); padding: 15px; border-radius: 12px; width: 90%; max-width: 320px; border: 1px solid #444;
        }
        .modal-content input {
            width: 100%; padding: 12px; margin-bottom: 10px; border-radius: 6px; border: 1px solid #555;
            background: var(--bg); color: var(--text); font-size: 18px; outline: none; 
            user-select: text !important; -webkit-user-select: text !important;
        }

        /* LISTÁK */
        .list-container { display: flex; flex-direction: column; gap: 6px; min-height: 50px; }
        
        /* ALSÓ LISTA KÉT OSZLOPBAN */
        #doneItems {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
        }

        .item { 
            background: var(--card); padding: 10px; border-radius: 8px; 
            display: flex; align-items: center; gap: 8px; touch-action: none; 
            border: 1px solid transparent; transition: transform 0.1s;
        }
        
        /* Rendezés közben */
        .item.dragging { 
            opacity: 0.8; 
            background: #333; 
            border: 1px dashed var(--primary);
            transform: scale(1.02);
            z-index: 100;
        }
        
        .item.checked { background: var(--success) !important; color: white; border: none; }
        .item.cancelled { background: var(--danger) !important; color: white; border: none; }
        
        /* Szöveg kezelése */
        .item-text { flex-grow: 1; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        #doneItems .item-text { font-size: 13px; }

        .actions { display: flex; gap: 4px; }
        .btn-sm { border: none; width: 32px; height: 32px; border-radius: 6px; font-size: 14px; display: flex; align-items: center; justify-content: center; color: white; cursor: pointer; }
        .btn-check { background: #4caf50; }
        .btn-x { background: #f44336; } 
        .btn-grey { background: var(--grey); color: var(--text); opacity: 0.8; }
        
        .summary-title { margin-top: 20px; border-top: 1px solid #444; padding-top: 10px; font-size: 11px; color: #888; text-transform: uppercase; letter-spacing: 1px; }
        .clear-all { background: none; color: var(--danger); border: 1px solid var(--danger); margin-top: 20px; width: 100%; padding: 12px; font-size: 12px; border-radius: 8px; font-weight: bold; }
        #loading { text-align: center; font-size: 12px; color: #888; margin-top: 20px; }
    </style>
</head>
<body class="dark">

    <div class="header">
        <h4 style="margin:0">KÖZÖS BOLT PRO</h4>
        <button class="theme-btn" onclick="toggleTheme()" id="tBtn">🌙</button>
    </div>

    <div class="btn-row">
        <button id="micBtn" class="main-btn" style="background: var(--primary);">🎤 HANG</button>
        <button class="main-btn" style="background: var(--grey); color: var(--text);" ontouchstart="quickOpen(event)">⌨️ ÍRÁS</button>
    </div>

    <div id="loading">Csatlakozás...</div>
    <div id="activeItems" class="list-container"></div>
    
    <div class="summary-title">KÉSZ / NINCS (2 OSZLOP)</div>
    <div id="doneItems" class="list-container"></div>
    
    <button class="clear-all" onclick="clearAll()">LISTA TELJES ÜRÍTÉSE</button>

    <div id="inputModal" onclick="if(event.target == this) closeModal()">
        <div class="modal-content">
            <input type="text" id="manualInput" placeholder="Termék..." autocomplete="off">
            <div class="btn-row" style="margin-bottom:0">
                <button class="main-btn" style="background:#666;" onclick="closeModal()">MÉGSE</button>
                <button class="main-btn" style="background:var(--primary);" onclick="handleManualAdd()">OK</button>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyC0fhL9VVErpN9LX6eJ8Tv5nuxF5Ea-qjE",
            databaseURL: "https://kozoslista-e0717-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "kozoslista-e0717"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const listRef = db.ref('shoppingList');

        let shoppingList = [];
        let isRecording = false;
        let recognition;
        let dragTimer;

        listRef.on('value', (snapshot) => {
            const data = snapshot.val();
            document.getElementById('loading').style.display = 'none';
            shoppingList = data ? Object.keys(data).map(key => ({ id: key, ...data[key] })) : [];
            renderAll();
        });

        function toggleTheme() {
            document.body.classList.toggle('light');
            document.getElementById('tBtn').innerText = document.body.classList.contains('light') ? '☀️' : '🌙';
        }

        function quickOpen(e) {
            if(e) e.preventDefault();
            document.getElementById('inputModal').style.display = 'flex';
            const input = document.getElementById('manualInput');
            setTimeout(() => { input.focus(); }, 150);
        }

        function closeModal() {
            document.getElementById('inputModal').style.display = 'none';
            document.getElementById('manualInput').value = '';
        }

        function handleManualAdd() {
            const val = document.getElementById('manualInput').value.trim();
            if(val) { addItem(val); closeModal(); }
        }

        document.getElementById('manualInput').onkeypress = (e) => { if (e.key === "Enter") handleManualAdd(); };

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.lang = 'hu-HU';
            recognition.onresult = (e) => { addItem(e.results[0][0].transcript); stopRecording(); };
        }

        document.getElementById('micBtn').onclick = () => {
            if (!isRecording) {
                isRecording = true; recognition.start();
                document.getElementById('micBtn').innerText = "🛑 STOP";
                document.getElementById('micBtn').style.background = "#ff3b30";
            } else { stopRecording(); }
        };

        function stopRecording() {
            isRecording = false; if(recognition) recognition.stop();
            document.getElementById('micBtn').innerText = "🎤 HANG";
            document.getElementById('micBtn').style.background = "var(--primary)";
        }

        function addItem(text) {
            listRef.push({ text: text, status: 'active', order: 999, time: Date.now() });
        }

        function updateStatus(id, newStatus) { listRef.child(id).update({ status: newStatus }); }
        function deleteItem(id) { listRef.child(id).remove(); }

        function renderAll() {
            const act = document.getElementById('activeItems');
            const don = document.getElementById('doneItems');
            act.innerHTML = ''; don.innerHTML = '';

            const activeItems = shoppingList.filter(i => i.status === 'active').sort((a, b) => a.order - b.order);
            const doneItems = shoppingList.filter(i => i.status !== 'active').sort((a,b) => b.time - a.time);

            activeItems.forEach(item => act.appendChild(createItemEl(item, true)));
            doneItems.forEach(item => don.appendChild(createItemEl(item, false)));
        }

        function createItemEl(item, isActive) {
            const div = document.createElement('div');
            div.className = `item ${item.status !== 'active' ? (item.status === 'done' ? 'checked' : 'cancelled') : ''}`;
            div.dataset.id = item.id;
            
            div.innerHTML = `
                <span class="item-text">${item.text}</span>
                <div class="actions">
                    ${item.status === 'active' ? `
                        <button class="btn-sm btn-check" onclick="updateStatus('${item.id}', 'done')">✔</button>
                        <button class="btn-sm btn-x" onclick="updateStatus('${item.id}', 'x')">✖</button>
                    ` : `
                        <button class="btn-sm btn-grey" onclick="updateStatus('${item.id}', 'active')">↩</button>
                        <button class="btn-sm btn-grey" onclick="deleteItem('${item.id}')">🗑</button>
                    `}
                </div>
            `;

            if(isActive) {
                // HOSSZÚ NYOMÁS ÉS REZGÉS LOGIKA
                div.ontouchstart = (e) => {
                    if(e.target.tagName === 'BUTTON') return;
                    dragTimer = setTimeout(() => {
                        if (window.navigator.vibrate) window.navigator.vibrate(40); // Rövid rezgés
                        div.classList.add('dragging');
                    }, 500); // 0.5 másodperc után válik húzhatóvá
                };

                div.ontouchend = () => {
                    clearTimeout(dragTimer);
                    if(div.classList.contains('dragging')) {
                        div.classList.remove('dragging');
                        const updates = {};
                        document.querySelectorAll('#activeItems .item').forEach((el, index) => {
                            updates[`${el.dataset.id}/order`] = index;
                        });
                        listRef.update(updates);
                    }
                };

                div.ontouchmove = (e) => {
                    if(!div.classList.contains('dragging')) {
                        clearTimeout(dragTimer);
                        return;
                    }
                    e.preventDefault();
                    const container = document.getElementById('activeItems');
                    const afterElement = getDragAfterElement(container, e.touches[0].clientY);
                    if (afterElement == null) container.appendChild(div);
                    else container.insertBefore(div, afterElement);
                };
            }
            return div;
        }

        function getDragAfterElement(container, y) {
            const draggables = [...container.querySelectorAll('.item:not(.dragging)')];
            return draggables.reduce((closest, child) => {
                const box = child.getBoundingClientRect();
                const offset = y - box.top - box.height / 2;
                if (offset < 0 && offset > closest.offset) return { offset: offset, element: child };
                else return closest;
            }, { offset: Number.NEGATIVE_INFINITY }).element;
        }

        function clearAll() { if(confirm("Törlöd a teljes listát?")) listRef.remove(); }
    </script>
</body>
</html>
