<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Bevásárló lista</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#a87ff3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lista">
<link rel="apple-touch-icon" href="IMG_4302.png">
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<style>
:root{--bg:#f4f7f6;--card-bg:#fff;--text:#2d3436;--primary:#55efc4;--primary-dark:#00b894;--accent:#a87ff3;--danger:#ff7675;--grey:#dfe6e9}
.dark{--bg:#1e272e;--card-bg:#2f3640;--text:#f5f6fa;--primary:#00d2d3;--grey:#353b48}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif;user-select:none;-webkit-user-select:none}
input,textarea{user-select:text;-webkit-user-select:text}
body{background:var(--bg);color:var(--text);margin:0;padding:15px;padding-top:max(15px,env(safe-area-inset-top));transition:.3s}
.app-container{max-width:500px;margin:0 auto;padding-bottom:90px}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.room-chip{background:var(--primary-dark);color:#fff;padding:6px 15px;border-radius:20px;font-weight:800;font-size:12px;border:none;cursor:pointer}
.ibtn{background:none;border:none;font-size:20px;cursor:pointer}
.grid-container{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:12px;margin-bottom:20px}
.tile{background:var(--card-bg);border-radius:18px;padding:15px 8px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;position:relative;box-shadow:0 4px 15px rgba(0,0,0,.05);min-height:110px;cursor:pointer}
.tile:active{transform:scale(.96)}
.tile-icon{font-size:34px;margin-bottom:6px}
.tile-text{font-size:13px;font-weight:600;word-break:break-word;line-height:1.2}
.tile-note{font-size:10px;opacity:.6;margin-top:4px;word-break:break-word}
.tile-actions{position:absolute;inset:0;background:var(--card-bg);border-radius:18px;display:none;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center;padding:6px}
.tile.open-menu .tile-actions{display:flex}
.action-circle{width:36px;height:36px;border-radius:50%;border:none;color:#fff;font-size:15px;cursor:pointer}
.empty{grid-column:1/-1;text-align:center;opacity:.5;padding:30px 0;font-size:14px}
.status-section{background:var(--card-bg);border-radius:20px;padding:15px;margin-top:15px}
.section-title{font-size:11px;text-transform:uppercase;letter-spacing:1px;opacity:.6;margin-bottom:10px;font-weight:bold;display:flex;justify-content:space-between}
.section-title button{background:none;border:none;color:var(--danger);font-size:11px;font-weight:bold;cursor:pointer;text-transform:uppercase}
.mini-list{display:flex;flex-wrap:wrap;gap:8px}
.mini-tag{background:var(--grey);padding:5px 12px;border-radius:15px;font-size:12px;font-weight:600;display:flex;align-items:center;gap:5px}
.mini-tag .undo{cursor:pointer;opacity:.6}
.fab{position:fixed;bottom:max(25px,env(safe-area-inset-bottom));right:25px;width:60px;height:60px;background:var(--primary-dark);color:#fff;border-radius:50%;font-size:30px;border:none;box-shadow:0 10px 25px rgba(0,0,0,.2);cursor:pointer;z-index:100}
.custom-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(8px);z-index:1000;justify-content:center;align-items:center;padding:20px}
.modal-content{background:var(--card-bg);width:100%;max-width:380px;border-radius:30px;padding:25px;max-height:90vh;overflow:auto}
input,textarea{width:100%;padding:15px;margin-bottom:12px;border-radius:15px;border:2px solid var(--grey);background:var(--bg);color:var(--text);font-size:16px;outline:none}
.primary-btn{width:100%;padding:15px;border-radius:15px;border:none;background:var(--primary-dark);color:#fff;font-weight:bold;font-size:16px;cursor:pointer}
.cancel{width:100%;background:none;border:none;margin-top:12px;color:#888;cursor:pointer}
.add-row{display:flex;gap:10px;align-items:flex-start}
.preview{width:56px;height:56px;flex:none;border-radius:15px;background:var(--bg);border:2px solid var(--grey);font-size:30px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.picker{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.picker button{font-size:26px;background:var(--bg);border:none;border-radius:10px;padding:6px;cursor:pointer}
</style>
</head>
<body>
<div class="app-container">
  <div class="header">
    <button class="room-chip" onclick="openModal('listModal')">🏠 <span id="roomNum">----</span></button>
    <div><button class="ibtn" onclick="toggleMode()">🌓</button><button class="ibtn" onclick="clearAllItems()">🗑️</button></div>
  </div>
  <div id="userCount" style="font-size:11px;text-align:center;margin-bottom:18px;opacity:.6">...</div>
  <div class="grid-container" id="activeGrid"></div>
  <div class="status-section"><div class="section-title"><span>Pipálva ✓</span><button onclick="clearStatus('done')">Törlés</button></div><div class="mini-list" id="doneList"></div></div>
  <div class="status-section"><div class="section-title"><span>Hiányzik ✖</span><button onclick="clearStatus('x')">Törlés</button></div><div class="mini-list" id="missingList"></div></div>
</div>
<button class="fab" onclick="openAdd()">+</button>

<div id="inputModal" class="custom-modal"><div class="modal-content">
  <h3 style="margin-top:0">Új tétel</h3>
  <div class="add-row">
    <div class="preview" id="preview" onclick="openPicker('new')">🛒</div>
    <input type="text" id="manualInput" placeholder="Pl: Tej, Kenyér, Sör..." autocomplete="off">
  </div>
  <textarea id="manualNote" placeholder="Megjegyzés (opcionális)" rows="2"></textarea>
  <button class="primary-btn" onclick="addItem()">Hozzáadás a listához</button>
  <button class="cancel" onclick="closeModal('inputModal')">Mégse</button>
</div></div>

<div id="listModal" class="custom-modal"><div class="modal-content">
  <h3 style="margin-top:0">Szobaváltás</h3>
  <input type="text" id="joinCodeInput" inputmode="numeric" maxlength="4" placeholder="4 jegyű kód">
  <button class="primary-btn" onclick="joinByCode()">Csatlakozás</button>
  <button class="cancel" onclick="closeModal('listModal')">Bezárás</button>
</div></div>

<div id="pickerModal" class="custom-modal"><div class="modal-content">
  <h3 style="margin-top:0">Válassz ikont</h3>
  <div class="picker" id="pickerGrid"></div>
  <button class="cancel" onclick="closeModal('pickerModal')">Mégse</button>
</div></div>

<script>
const firebaseConfig={apiKey:"AIzaSyC0fhL9VVErpN9LX6eJ8Tv5nuxF5Ea-qjE",databaseURL:"https://kozoslista-e0717-default-rtdb.europe-west1.firebasedatabase.app",projectId:"kozoslista-e0717"};
firebase.initializeApp(firebaseConfig);
const db=firebase.database();
let currentListId=localStorage.getItem('currentListId')||"2316";
let listRef=db.ref('shoppingLists/'+currentListId);
let openId=null,pickTarget=null,chosenIcon=null,lastItems=[];

if(localStorage.getItem('dark')==='1')document.body.classList.add('dark');

/* ---------- Ikonok ---------- */
const ICONS=`🥛:tej,tejfol,kefir,tejszin|🍞:kenyer,kifli,pek,zsemle,piritos,teknyo,bagett|🥐:croissant,vajas|🥩:hus,szalonna,virsli,kolbasz,felvagott,sonka,szalami,steak,darahus,daralt|🍗:csirke,pulyka,szarny|🐟:hal,tonhal,lazac,ponty,halrud|🥚:tojas|🧀:sajt,mozzarella,trappista,turo,vaj,margarin,parmezan|🍦:joghurt,fagylalt,puding|🍻:sor,sorok,keg|🍷:bor,pezsgo,palinka,whisky,vodka,likor,rum,gin|🥤:viz,uditő,udito,cola,fanta,szoda,limonade,asvanyviz,energiaital,tonik|🧃:gyumolcsle,narancsle,juice,szörp,szorp|☕:kave,kakao,tea,kapszula|🥦:zoldseg,brokkoli,karfiol,kaposzta,cukkini,padlizsan|🍅:paradicsom|🫑:paprika|🥕:sargarepa,repa,petrezselyem|🥔:burgonya,krumpli|🧅:hagyma|🧄:fokhagyma|🥒:uborka|🥬:salata,spenot,rukkola|🍄:gomba|🌽:kukorica|🍎:alma,gyumolcs|🍌:banan|🍊:narancs,mandarin|🍋:citrom,lime|🍇:szolo|🍓:eper,malna,szamoca,afonya|🍉:dinnye|🍐:korte|🍑:barack,szilva,seresznye,cseresznye,meggy|🥑:avokado|🍫:csoki,csokolade,nutella|🍪:keksz,piskota,suti|🍬:cukorka,gumicukor,edesseg|🍿:chips,popcorn,perec,mogyoro|🍰:torta,sutemeny,muffin|🍝:teszta,spagetti,tarhonya,makaroni,tészta|🍚:rizs|🌾:liszt,zab,muzli,pehely,gabona|🫒:olaj,olivaolaj,ecet|🧂:so,cukor,fuszer,bors,vegeta|🍯:mez,lekvar,dzsem|🥫:konzerv,kukoricakonzerv,babkonzerv,leves|🫘:bab,lencse,borso,csicseriborso|🥜:dio,mandula,magok|🧻:wc,papir,zsebkendo,torolkozo,konyhai|🧼:szappan,tisztit,mosogato,mosopor,oblito,hipo,hipó,fertotlenito|🧴:samp,tusfurdo,krem,fogkrem,deo,balzsam,naptej|🪥:fogkefe,fogselyem|🪒:borotva|🧽:szivacs,fureszt|🗑️:szemetes,zsak|🍕:pizza|🍔:hamburger,hotdog,buci|🌮:taco,tortilla,wrap|🍜:tesztaleves,instant,tészta|🐶:kutya,kutyatap|🐱:macska,alom,macskatap|🍼:baba,pelenka,tapszer,popsi|💊:gyogyszer,vitamin,tabletta,fajdalomcsillapito,tapasz|🔋:elem,akku|💡:izzo,lampa|🕯️:gyertya|🌸:virag,virag|🎂:szuletesnap,tortagyertya|🎁:ajandek|🥶:fagyasztott,jeg|🧊:jeg,jegkocka|📝:fuzet,toll,ceruza,jegyzet|🧦:zokni,ruha,polo,nadrag|🚗:benzin,autó,auto,mosoauto`;
const DICT=ICONS.split('|').map(r=>{const[e,k]=r.split(':');return[e,k.split(',').map(norm)]});
function norm(s){return String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/ő/g,'o').replace(/ű/g,'u').trim()}
function getMem(){try{return JSON.parse(localStorage.getItem('iconMem')||'{}')}catch(e){return{}}}
function iconFor(text){
  const n=norm(text),mem=getMem();
  if(mem[n])return mem[n];
  const words=n.split(/[^a-z0-9]+/).filter(Boolean);
  let best=null,bl=0;
  for(const[e,kws]of DICT)for(const k of kws){
    if(!k)continue;
    const hit=k.length<4?words.includes(k):n.includes(k);
    if(hit&&k.length>bl){best=e;bl=k.length}
  }
  return best||'🛒';
}
const PICK=Array.from('🛒🥛🍞🥩🍗🐟🥚🧀🍦🍻🍷🥤☕🥦🍅🥕🥔🧅🍎🍌🍊🍇🍓🍉🍫🍪🍬🍿🍰🍝🍚🌾🫒🧂🍯🥫🧻🧼🧴🪥🧽🍕🍔🐶🐱🍼💊🔋💡🕯️🌸🎁📝🧦🥑🥬🍄🌽🧊🍋');

/* ---------- Init ---------- */
function init(){
  document.getElementById('roomNum').textContent=currentListId;
  listRef.on('value',snap=>{
    const d=snap.val();
    lastItems=d?Object.keys(d).map(k=>({id:k,...d[k]})):[];
    render();
  });
  const pRef=db.ref('presence/'+currentListId);
  const myP=pRef.push(true);
  myP.onDisconnect().remove();
  pRef.on('value',s=>{document.getElementById('userCount').textContent=s.numChildren()+' ember szerkeszti épp'});
}

function btn(label,bg,fn){
  const b=document.createElement('button');
  b.className='action-circle';b.style.background=bg;b.textContent=label;
  b.onclick=e=>{e.stopPropagation();fn()};return b;
}

function render(){
  const grid=document.getElementById('activeGrid'),done=document.getElementById('doneList'),miss=document.getElementById('missingList');
  grid.textContent='';done.textContent='';miss.textContent='';
  const items=[...lastItems].sort((a,b)=>(a.order||0)-(b.order||0));
  let active=0;
  items.forEach(it=>{
    const icon=it.icon||iconFor(it.text||'');
    if(it.status==='active'){
      active++;
      const t=document.createElement('div');
      t.className='tile'+(it.note?' has-info':'')+(openId===it.id?' open-menu':'');
      const i=document.createElement('div');i.className='tile-icon';i.textContent=icon;
      const x=document.createElement('div');x.className='tile-text';x.textContent=it.text;
      t.append(i,x);
      if(it.note){const n=document.createElement('div');n.className='tile-note';n.textContent=it.note;t.append(n)}
      const a=document.createElement('div');a.className='tile-actions';
      a.append(
        btn('✓','var(--primary-dark)',()=>setStatus(it.id,'done')),
        btn('✖','var(--danger)',()=>setStatus(it.id,'x')),
        btn('😀','var(--accent)',()=>openPicker(it.id)),
        btn('🗑️','#b2bec3',()=>listRef.child(it.id).remove())
      );
      t.append(a);
      t.onclick=()=>{
        openId=openId===it.id?null:it.id;render();
        if(openId){const id=openId;setTimeout(()=>{if(openId===id){openId=null;render()}},4000)}
      };
      grid.append(t);
    }else{
      const g=document.createElement('div');g.className='mini-tag';
      const s=document.createElement('span');s.textContent=icon+' '+it.text;
      const u=document.createElement('span');u.className='undo';u.textContent='↺';u.onclick=()=>setStatus(it.id,'active');
      g.append(s,u);
      (it.status==='done'?done:miss).append(g);
    }
  });
  if(!active){const e=document.createElement('div');e.className='empty';e.textContent='Még nincs tétel – koppints a + gombra';grid.append(e)}
}

/* ---------- Műveletek ---------- */
function openAdd(){
  chosenIcon=null;
  document.getElementById('manualInput').value='';document.getElementById('manualNote').value='';
  document.getElementById('preview').textContent='🛒';
  openModal('inputModal');
  setTimeout(()=>document.getElementById('manualInput').focus(),50);
}
function addItem(){
  const val=document.getElementById('manualInput').value.trim();
  if(!val)return;
  listRef.push({text:val,note:document.getElementById('manualNote').value.trim(),icon:chosenIcon||iconFor(val),status:'active',order:Date.now()});
  closeModal('inputModal');
}
function setStatus(id,s){listRef.child(id).update({status:s})}
function clearStatus(s){
  const ids=lastItems.filter(i=>i.status===s).map(i=>i.id);
  if(ids.length&&confirm('Törlöd ezeket ('+ids.length+')?'))ids.forEach(id=>listRef.child(id).remove());
}
function clearAllItems(){if(confirm('Mindent törölsz?'))listRef.remove()}
function toggleMode(){document.body.classList.toggle('dark');localStorage.setItem('dark',document.body.classList.contains('dark')?'1':'0')}
function openModal(id){document.getElementById(id).style.display='flex'}
function closeModal(id){document.getElementById(id).style.display='none'}
function joinByCode(){
  const c=document.getElementById('joinCodeInput').value.trim();
  if(/^\d{4}$/.test(c)){localStorage.setItem('currentListId',c);location.reload()}
}

/* ---------- Ikonválasztó ---------- */
function openPicker(target){
  pickTarget=target;
  const g=document.getElementById('pickerGrid');g.textContent='';
  PICK.forEach(e=>{const b=document.createElement('button');b.textContent=e;b.onclick=()=>pickIcon(e);g.append(b)});
  openModal('pickerModal');
}
function pickIcon(e){
  if(pickTarget==='new'){
    chosenIcon=e;document.getElementById('preview').textContent=e;
  }else{
    const it=lastItems.find(i=>i.id===pickTarget);
    if(it){listRef.child(it.id).update({icon:e});const m=getMem();m[norm(it.text)]=e;localStorage.setItem('iconMem',JSON.stringify(m))}
  }
  closeModal('pickerModal');
}

/* ---------- Események ---------- */
document.getElementById('manualInput').addEventListener('input',e=>{
  if(!chosenIcon)document.getElementById('preview').textContent=e.target.value.trim()?iconFor(e.target.value):'🛒';
});
document.getElementById('manualInput').addEventListener('keydown',e=>{if(e.key==='Enter')addItem()});

init();
</script>
</body>
</html>
