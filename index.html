<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bevásárló lista</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        :root { --bg: #121212; --card: #1e1e1e; --text: #e0e0e0; --primary: #bb86fc; --success: #2e7d32; --danger: #c62828; --grey: #333; }
        body.light { --bg: #f0f0f7; --card: #ffffff; --text: #1c1c1e; --primary: #5856d6; --success: #34c759; --danger: #ff3b30; --grey: #e5e5ea; }
        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
        body { background: var(--bg); color: var(--text); font-family: sans-serif; margin: 0; padding: 10px; overflow-x: hidden; position: relative; }
        .version { position: absolute; top: 5px; left: 10px; font-size: 10px; color: #444; }
        .header { text-align: center; margin-bottom: 15px; border-bottom: 1px solid #333; padding-bottom: 10px; padding-top: 15px; }
        .theme-btn { position: absolute; top: 10px; right: 10px; font-size: 20px; border: none; background: none; cursor: pointer; color: var(--text); }
        .btn-row { display: flex; gap: 8px; margin-bottom: 15px; }
        .main-btn { flex: 1; padding: 14px; border-radius: 10px; border: none; font-weight: bold; font-size: 13px; color: white; text-transform: uppercase; cursor: pointer; }
        .list-container { display: flex; flex-direction: column; gap: 6px; }
        .bottom-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
        .column-label { text-align: center; font-size: 11px; font-weight: bold; margin-bottom: 8px; padding: 10px; border-radius: 8px; background: var(--grey); }
        .item { background: var(--card); padding: 10px; border-radius: 8px; display: flex; align-items: center; gap: 8px; border: 1px solid transparent; }
        .item.checked { background: var(--success) !important; color: white; }
        .item.cancelled { background: var(--danger) !important; color: white; }
        .item-text { flex-grow: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; user-select: none; }
        .btn-sm { border: none; width: 32px; height: 32px; border-radius: 6px; display: flex; align-items: center; justify-content: center; color: white; cursor: pointer; background: rgba(255,255,255,0.15); }
        #inputModal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); justify-content: center; align-items: flex-start; padding-top: 15vh; z-index: 1000; }
        .modal-content { background: var(--card); padding: 20px; border-radius: 15px; width: 90%; max-width: 320px; }
        .modal-content input { width: 100%; padding: 15px; margin-bottom: 15px; border-radius: 10px; border: 1px solid #555; background: var(--bg); color: var(--text); font-size: 18px; outline: none; }
        .clear-all { background: none; color: var(--danger); border: 1px solid var(--danger); margin-top: 30px; width: 100%; padding: 12px; font-size: 11px; border-radius: 8px; font-weight: bold; opacity: 0.6; }
    </style>
</head>
<body class="dark">
    <div class="version">v1.4</div>
    <button class="theme-btn" onclick="toggleTheme()">🌙</button>
    <div class="header"><h2>BEVÁSÁRLÓ LISTA</h2></div>
    <div class="btn-row">
        <button id="micBtn" class="main-btn" style="background: var(--primary);">🎤 HANG</button>
        <button id="writeBtn" class="main-btn" style="background: var(--grey); color: var(--text);">⌨️ ÍRÁS</button>
    </div>
    <div id="activeItems" class="list-container"></div>
    <div class="bottom-grid">
        <div><div class="column-label">TALÁLTAM</div><div id="doneItems" class="list-container"></div></div>
        <div><div class="column-label">NINCS</div><div id="missingItems" class="list-container"></div></div>
    </div>
    <button class="clear-all" onclick="clearAll()">LISTA TÖRLÉSE</button>

    <div id="inputModal">
        <div class="modal-content">
            <input type="text" id="manualInput" placeholder="Termék neve..." autocomplete="off">
            <div class="btn-row" style="margin-bottom:0">
                <button class="main-btn" style="background:#444;" onclick="closeModal()">MÉGSE</button>
                <button class="main-btn" style="background:var(--primary);" onclick="handleManualAdd()">OK</button>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyC0fhL9VVErpN9LX6eJ8Tv5nuxF5Ea-qjE",
            databaseURL: "https://kozoslista-e0717-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "kozoslista-e0717"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const listRef = db.ref('shoppingList');
        let shoppingList = [];
        let isFirstLoad = true;

        listRef.on('value', (snapshot) => {
            const data = snapshot.val();
            const newList = data ? Object.keys(data).map(key => ({ id: key, ...data[key] })) : [];
            
            if (!isFirstLoad && newList.length > shoppingList.length) {
                const newest = newList[newList.length - 1];
                if (newest.status === 'active') {
                    if (Notification.permission === "granted") {
                        new Notification("Bevásárló lista", { body: "Új termék a listán: " + newest.text });
                    }
                }
            }
            shoppingList = newList;
            isFirstLoad = false;
            renderAll();
        });

        function renderAll() {
            const containers = { active: document.getElementById('activeItems'), done: document.getElementById('doneItems'), x: document.getElementById('missingItems') };
            Object.values(containers).forEach(c => c.innerHTML = '');
            shoppingList.forEach(item => {
                const div = document.createElement('div');
                div.className = `item ${item.status === 'done' ? 'checked' : (item.status === 'x' ? 'cancelled' : '')}`;
                div.innerHTML = `<span class="item-text">${item.text}</span>
                    <div class="actions">
                        ${item.status === 'active' ? `<button class="btn-sm" style="background:#4caf50" onclick="updateStatus('${item.id}','done')">✔</button>
                        <button class="btn-sm" style="background:#f44336" onclick="updateStatus('${item.id}','x')">✖</button>` : ''}
                        <button class="btn-sm" onclick="deleteItem('${item.id}')">🗑</button>
                    </div>`;
                const target = item.status === 'active' ? containers.active : (item.status === 'done' ? containers.done : containers.x);
                target.appendChild(div);
            });
        }

        document.getElementById('writeBtn').onclick = () => {
            document.getElementById('inputModal').style.display = 'flex';
            document.getElementById('manualInput').focus();
        };

        function closeModal() { document.getElementById('inputModal').style.display = 'none'; document.getElementById('manualInput').value = ''; }
        function handleManualAdd() { const val = document.getElementById('manualInput').value.trim(); if(val) { listRef.push({ text: val, status: 'active', time: Date.now() }); closeModal(); } }
        document.getElementById('manualInput').onkeypress = (e) => { if(e.key === 'Enter') handleManualAdd(); };
        function updateStatus(id, s) { listRef.child(id).update({ status: s }); }
        function deleteItem(id) { if(confirm("Törlöd?")) listRef.child(id).remove(); }
        function toggleTheme() { document.body.classList.toggle('light'); }
        function clearAll() { if(confirm("Mindent törölsz?")) listRef.remove(); }
        if (Notification.permission !== "granted") Notification.requestPermission();
    </script>
</body>
</html>
