<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bevásárló lista v2.4.0</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    
    <style>
        :root { 
            --bg: #0b0b0b; --card: #1a1a1a; --text: #f0f0f0; 
            --primary: #a87ff3; --success: #32a852; --danger: #eb4034; --grey: #333;
        }
        .light-mode { 
            --bg: #d1d1d6; --card: #f0f0f7; --text: #1c1c1e; 
            --primary: #5856d6; --success: #34c759; --danger: #d66d6d; --grey: #e5e5ea;
        }
        
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: -apple-system, sans-serif; user-select: none; }
        body { background: var(--bg); color: var(--text); margin: 0; padding: 15px; transition: 0.3s; padding-bottom: 100px; }
        
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .room-btn { background: var(--grey); color: var(--text); padding: 8px 16px; border-radius: 20px; font-weight: bold; border: none; font-size: 11px; cursor: pointer; }

        /* FIX 2 OSZLOPOS GRID */
        .grid-container { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 12px; 
            margin-bottom: 30px; 
        }

        .tile { 
            background: var(--card); 
            border-radius: 22px; 
            aspect-ratio: 1 / 1;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 15px; position: relative; transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: 2px solid transparent; overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .tile-icon { font-size: 38px; margin-bottom: 8px; }
        
        .tile-text { 
            font-size: 13px; font-weight: 800; text-align: center; line-height: 1.2;
            display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
        }

        /* INTERAKTÍV SZÍNEZÉS */
        .tile.open { border-color: var(--primary); }
        .overlay { 
            position: absolute; inset: 0; background: rgba(0,0,0,0.8); 
            display: flex; justify-content: center; align-items: center; gap: 10px;
            opacity: 0; pointer-events: none; transition: 0.2s;
        }
        .tile.open .overlay { opacity: 1; pointer-events: auto; }
        
        .btn-round { width: 42px; height: 42px; border-radius: 50%; border: none; color: white; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 18px; }

        /* LENTI EGYSZERŰ LISTA */
        .label { font-size: 10px; text-transform: uppercase; color: #888; margin: 25px 0 10px; text-align: center; letter-spacing: 1px; font-weight: 900; }
        .mini-list { display: flex; flex-direction: column; gap: 8px; }
        .mini-item { 
            background: var(--card); padding: 14px 20px; border-radius: 18px; 
            display: flex; align-items: center; justify-content: space-between;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .mini-text { font-size: 14px; font-weight: 700; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        .fab { position: fixed; bottom: 25px; right: 25px; width: 65px; height: 65px; background: var(--primary); color: white; border-radius: 50%; border: none; font-size: 35px; box-shadow: 0 8px 25px rgba(0,0,0,0.5); z-index: 100; font-weight: bold; }

        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 1000; align-items: center; justify-content: center; padding: 20px; backdrop-filter: blur(5px); }
        .modal-box { background: var(--card); width: 100%; max-width: 350px; border-radius: 25px; padding: 25px; }
        input, textarea { width: 100%; padding: 15px; margin-bottom: 12px; border-radius: 12px; border: 1px solid #333; background: #000; color: white; font-size: 16px; }
    </style>
</head>
<body>

<div class="header">
    <button class="room-btn" onclick="changeRoom()">🏠 <span id="rNum">----</span></button>
    <div style="display:flex; gap:20px; align-items: center;">
        <button onclick="toggleMode()" style="background:none; border:none; font-size:22px; cursor:pointer;">🌓</button>
        <button onclick="clearAll()" style="background:none; border:none; font-size:22px; opacity:0.3; cursor:pointer;">🗑️</button>
    </div>
</div>

<div id="uCount" style="font-size:10px; text-align:center; color:#666; margin-bottom:20px; font-weight: bold;">...</div>

<div class="grid-container" id="activeGrid"></div>

<div class="label">Megvan ✓</div>
<div id="doneList" class="mini-list"></div>

<div class="label">Nincs ✖</div>
<div id="missingList" class="mini-list"></div>

<button class="fab" onclick="openM('inputM')">+</button>

<div id="inputM" class="modal"><div class="modal-box">
    <h3 style="margin-top:0">Új tétel</h3>
    <input type="text" id="iName" placeholder="Termék neve...">
    <textarea id="iNote" placeholder="Megjegyzés..." rows="2"></textarea>
    <button onclick="save()" style="width:100%; padding:16px; border-radius:15px; background:var(--primary); border:none; color:white; font-weight:bold; font-size:16px;">HOZZÁADÁS</button>
    <button onclick="closeM('inputM')" style="width:100%; background:none; border:none; color:#888; margin-top:15px;">Mégse</button>
</div></div>

<script>
    const firebaseConfig = { apiKey: "AIzaSyC0fhL9VVErpN9LX6eJ8Tv5nuxF5Ea-qjE", databaseURL: "https://kozoslista-e0717-default-rtdb.europe-west1.firebasedatabase.app" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    
    let roomId = localStorage.getItem('room') || "2316";
    if(localStorage.getItem('mode') === 'light') document.body.classList.add('light-mode');

    function getIcon(t) {
        t = t.toLowerCase();
        if(t.includes("tej")) return "🥛"; if(t.includes("kenyér") || t.includes("kifli")) return "🍞";
        if(t.includes("sör") || t.includes("alkohol")) return "🍺"; if(t.includes("hús") || t.includes("sonka")) return "🥩";
        if(t.includes("sajt")) return "🧀"; if(t.includes("víz") || t.includes("üdítő")) return "💧";
        if(t.includes("gyüm")) return "🍎"; if(t.includes("zöld")) return "🥦";
        if(t.includes("wc") || t.includes("papír")) return "🧻"; if(t.includes("tojás")) return "🥚";
        return "📦";
    }

    function sync() {
        document.getElementById('rNum').innerText = roomId;
        db.ref('shoppingLists/' + roomId).on('value', snap => {
            const data = snap.val() ? Object.keys(snap.val()).map(k => ({id: k, ...snap.val()[k]})) : [];
            const grid = document.getElementById('activeGrid');
            const doneL = document.getElementById('doneList');
            const missL = document.getElementById('missingList');
            
            grid.innerHTML = ''; doneL.innerHTML = ''; missL.innerHTML = '';

            data.forEach(it => {
                const status = it.status || 'active';
                if(status === 'active') {
                    const tile = document.createElement('div');
                    tile.className = 'tile';
                    tile.innerHTML = `
                        <div class="tile-icon">${getIcon(it.text)}</div>
                        <div class="tile-text">${it.text}</div>
                        <div class="overlay">
                            <button class="btn-round" style="background:var(--success)" onclick="upd('${it.id}','done')">✓</button>
                            <button class="btn-round" style="background:var(--danger)" onclick="upd('${it.id}','x')">✖</button>
                            <button class="btn-round" style="background:#444" onclick="alert('${it.note||'Nincs megjegyzés'}')">i</button>
                        </div>`;
                    tile.onclick = (e) => {
                        if(e.target.tagName !== 'BUTTON') {
                            document.querySelectorAll('.tile').forEach(el => el.classList.remove('open'));
                            tile.classList.add('open');
                            setTimeout(() => tile.classList.remove('open'), 4000);
                        }
                    };
                    grid.appendChild(tile);
                } else {
                    const row = document.createElement('div');
                    row.className = 'mini-item';
                    row.innerHTML = `
                        <div class="mini-text">${it.text}</div>
                        <div style="display:flex; gap:12px;">
                            <button onclick="upd('${it.id}','active')" style="background:none; border:none; font-size:20px; cursor:pointer;">↺</button>
                            <button onclick="del('${it.id}')" style="background:none; border:none; font-size:20px; cursor:pointer;">🗑️</button>
                        </div>`;
                    if(status === 'done') doneL.appendChild(row); else missL.appendChild(row);
                }
            });
        });

        const p = db.ref('presence/' + roomId);
        p.push(true).onDisconnect().remove();
        p.on('value', s => document.getElementById('uCount').innerText = `${s.numChildren()} aktív szerkesztő`);
    }

    function save() {
        const text = document.getElementById('iName').value;
        if(text) {
            db.ref('shoppingLists/' + roomId).push({ text, note: document.getElementById('iNote').value, status: 'active', order: Date.now() });
            closeM('inputM'); document.getElementById('iName').value = ''; document.getElementById('iNote').value = '';
        }
    }

    function upd(id, s) { db.ref(`shoppingLists/${roomId}/${id}`).update({status: s}); }
    function del(id) { if(confirm("Véglegesen törlöd?")) db.ref(`shoppingLists/${roomId}/${id}`).remove(); }
    function openM(id) { document.getElementById(id).style.display = 'flex'; }
    function closeM(id) { document.getElementById(id).style.display = 'none'; }
    
    function toggleMode() { 
        document.body.classList.toggle('light-mode');
        localStorage.setItem('mode', document.body.classList.contains('light-mode') ? 'light' : 'dark');
    }

    function changeRoom() { const n = prompt("Szoba kódja:", roomId); if(n) { localStorage.setItem('room', n); location.reload(); } }
    function clearAll() { if(confirm("Mindent törölsz a szobából?")) db.ref('shoppingLists/' + roomId).remove(); }

    sync();
</script>
</body>
</html>
