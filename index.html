<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lista Pro v0.2.5</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-storage-compat.js"></script>
    <style>
        :root { --bg: #0b0b0b; --card-bg: #1a1a1a; --item-bg: #262626; --text: #f0f0f0; --primary: #a87ff3; --success: #32a852; --danger: #eb4034; --grey: #333; --border: #444; }
        body.light { --bg: #e5e5ea; --card-bg: #ffffff; --item-bg: #f2f2f7; --text: #000000; --primary: #5856d6; --grey: #d1d1d6; --border: #ccc; }
        
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: sans-serif; }
        body { background: var(--bg); color: var(--text); margin: 0; padding: 10px; display: flex; justify-content: center; min-height: 100vh; }
        
        .app-card { background: var(--card-bg); width: 100%; max-width: 400px; border-radius: 20px; padding: 15px; align-self: flex-start; box-shadow: 0 10px 30px rgba(0,0,0,0.3); position: relative; }
        
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .col-label { font-size: 10px; text-align: center; color: #aaa; margin: 10px auto 8px; text-transform: uppercase; letter-spacing: 1px; background: var(--grey); padding: 4px 12px; border-radius: 20px; display: table; }

        .list-container { display: flex; flex-direction: column; gap: 8px; }
        .item-wrapper { position: relative; border-radius: 10px; overflow: hidden; background: #000; }
        .item { background: var(--item-bg); padding: 10px 12px; border-radius: 10px; display: flex; align-items: center; gap: 10px; position: relative; z-index: 5; transition: transform 0.2s ease-out; border: 1px solid transparent; }
        
        .status-done { background: #1b3d26 !important; border-color: var(--success) !important; }
        .status-x { background: #421a18 !important; border-color: var(--danger) !important; }

        .btn-sm { border: none; width: 34px; height: 34px; border-radius: 8px; display: flex; align-items: center; justify-content: center; cursor: pointer; background: rgba(255,255,255,0.1); color: white; }
        .has-note-btn { background: #555 !important; } /* Sárga helyett szürke az 'i' gomb ha van tartalom */

        /* MODAL & RÉSZLETEK JAVÍTÁSA */
        .custom-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 2000; justify-content: center; align-items: center; padding: 20px; }
        .modal-content { background: var(--card-bg); width: 100%; max-width: 340px; border-radius: 20px; padding: 30px 20px 20px; position: relative; border: 1px solid var(--border); }
        .close-x { position: absolute; top: 12px; right: 15px; background: none; color: var(--text); font-size: 24px; cursor: pointer; border:none; outline:none; }

        .note-display-box { border: 1px solid var(--border); border-radius: 15px; overflow: hidden; background: rgba(255,255,255,0.02); }
        .note-text-content { padding: 15px; text-align: center; font-size: 15px; line-height: 1.5; white-space: pre-wrap; word-wrap: break-word; }
        .note-divider { height: 1px; background: var(--border); width: 90%; margin: 0 auto; }
        .note-footer-actions { display: flex; justify-content: center; gap: 25px; padding: 10px; }
        .note-icon-btn { background: none; border: none; font-size: 22px; cursor: pointer; filter: grayscale(1); opacity: 0.8; }
        .note-icon-btn:hover { opacity: 1; filter: grayscale(0); }

        .img-area-box { width: 100%; border-radius: 12px; margin-bottom: 15px; border: 1px solid var(--border); min-height: 100px; display: flex; align-items: center; justify-content: center; background: #000; overflow: hidden; }
        
        input, textarea { width: 100%; padding: 12px; margin-bottom: 10px; border-radius: 10px; border: 1px solid var(--border); background: #000; color: #fff; outline: none; }
    </style>
</head>
<body class="dark">

<div class="app-card">
    <div class="top-bar">
        <div style="font-size:10px; color:#444;">v0.2.5</div>
        <div style="display:flex; gap:15px; align-items:center;">
            <button onclick="clearAllItems()" style="background:none; border:none; font-size:18px; opacity:0.5;">🗑️</button>
            <div onclick="document.body.classList.toggle('light')" style="cursor:pointer;">🌓</div>
        </div>
    </div>
    
    <h2 style="text-align:center; font-size:19px; margin-bottom:20px; letter-spacing:1px;">BEVÁSÁRLÓ LISTA</h2>
    
    <div style="display:flex; gap:10px; margin-bottom:20px;">
        <button id="micBtn" style="flex:1; padding:15px; border-radius:12px; border:none; background:var(--primary); color:white; font-weight:bold;">🎤 HANG</button>
        <button onclick="openModal('inputModal')" style="flex:1; padding:15px; border-radius:12px; border:none; background:var(--grey); color:white; font-weight:bold;">⌨️ ÍRÁS</button>
    </div>

    <div class="col-label">Aktív tételek</div>
    <div id="activeItems" class="list-container"></div>
    
    <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px; margin-top:10px;">
        <div><div class="col-label">Megvan</div><div id="doneItems" class="list-container"></div></div>
        <div><div class="col-label">Nincs</div><div id="missingItems" class="list-container"></div></div>
    </div>
</div>

<div id="detailsModal" class="custom-modal">
    <div class="modal-content">
        <button class="close-x" onclick="closeModal('detailsModal')">✕</button>
        <h3 id="detTitle" style="margin-top:0; text-align:center; font-size:17px; margin-bottom:15px;"></h3>
        <div id="detImgArea" class="img-area-box"></div>
        
        <div id="detNoteView">
            </div>

        <div id="detEditView" style="display:none;">
            <textarea id="editNoteInput" rows="5"></textarea>
            <button onclick="saveNote()" style="width:100%; padding:15px; background:var(--primary); color:white; border:none; border-radius:10px; font-weight:bold;">MENTÉS</button>
        </div>
        <input type="file" id="fileInExtra" hidden accept="image/*">
    </div>
</div>

<div id="inputModal" class="custom-modal">
    <div class="modal-content">
        <button class="close-x" onclick="closeModal('inputModal')">✕</button>
        <input type="text" id="manualInput" placeholder="Termék neve...">
        <textarea id="manualNote" placeholder="Megjegyzés..." rows="2"></textarea>
        <div id="fileBtn" onclick="document.getElementById('fileIn').click()" style="border:1px dashed #444; padding:15px; text-align:center; border-radius:10px; color:#888; cursor:pointer;">📷 Kép hozzáadása</div>
        <input type="file" id="fileIn" hidden accept="image/*">
        <button onclick="addItem()" style="width:100%; padding:15px; border-radius:10px; border:none; background:var(--primary); color:white; font-weight:bold; margin-top:15px;">HOZZÁADÁS</button>
    </div>
</div>

<script>
    const firebaseConfig = { 
        apiKey: "AIzaSyC0fhL9VVErpN9LX6eJ8Tv5nuxF5Ea-qjE", 
        databaseURL: "https://kozoslista-e0717-default-rtdb.europe-west1.firebasedatabase.app", 
        projectId: "kozoslista-e0717",
        storageBucket: "kozoslista-e0717.firebasestorage.app"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const storage = firebase.storage();
    const listRef = db.ref('shoppingList');

    let currentId = null, tempUrl = "";

    function openModal(id) { document.getElementById(id).style.display = 'flex'; }
    function closeModal(id) { 
        document.getElementById(id).style.display = 'none';
        document.getElementById('detNoteView').style.display = 'block';
        document.getElementById('detEditView').style.display = 'none';
    }

    function openDetails(id, text, note, img) {
        currentId = id;
        document.getElementById('detTitle').innerText = text;
        const imgArea = document.getElementById('detImgArea');
        imgArea.innerHTML = img ? `<img src="${img}" style="width:100%" onclick="window.open('${img}')">` : `<div onclick="document.getElementById('fileInExtra').click()" style="color:#555; cursor:pointer">📷 Kép hozzáadása</div>`;
        
        const noteView = document.getElementById('detNoteView');
        if(note && note.trim() !== "") {
            noteView.innerHTML = `
                <div class="note-display-box">
                    <div class="note-text-content">${note}</div>
                    <div class="note-divider"></div>
                    <div class="note-footer-actions">
                        <button class="note-icon-btn" onclick="switchToEdit(\`${note.replace(/`/g, '\\`')}\`)">✏️</button>
                        <button class="note-icon-btn" onclick="deleteNote()">🗑️</button>
                    </div>
                </div>`;
        } else {
            noteView.innerHTML = `<div style="border:1px dashed var(--border); padding:20px; text-align:center; border-radius:12px; color:#666; cursor:pointer;" onclick="switchToEdit('')">➕ Megjegyzés hozzáadása</div>`;
        }
        openModal('detailsModal');
    }

    function switchToEdit(val) {
        document.getElementById('detNoteView').style.display = 'none';
        document.getElementById('detEditView').style.display = 'block';
        document.getElementById('editNoteInput').value = val;
    }

    function saveNote() {
        listRef.child(currentId).update({ note: document.getElementById('editNoteInput').value.trim() });
        closeModal('detailsModal');
    }

    function deleteNote() {
        if(confirm("Törlöd a megjegyzést?")) {
            listRef.child(currentId).update({ note: "" });
            closeModal('detailsModal');
        }
    }

    // Alap renderelés és egyéb funkciók...
    function render(items) {
        const conts = { active: document.getElementById('activeItems'), done: document.getElementById('doneItems'), x: document.getElementById('missingItems') };
        Object.values(conts).forEach(c => c.innerHTML = '');
        items.sort((a,b) => a.order - b.order).forEach(it => {
            const wrap = document.createElement('div');
            wrap.className = 'item-wrapper';
            wrap.innerHTML = `<div style="position:absolute;right:0;top:0;bottom:0;width:75px;background:var(--danger);display:flex;align-items:center;justify-content:center;color:white;font-size:11px;font-weight:bold;" onclick="firebase.database().ref('shoppingList/${it.id}').remove()">TÖRLÉS</div>`;
            const div = document.createElement('div');
            div.className = `item ${it.status==='done'?'status-done':(it.status==='x'?'status-x':'')}`;
            const hasC = (it.note && it.note.trim() !== "") || it.img;
            div.innerHTML = `<span style="flex:1; overflow:hidden; text-overflow:ellipsis;">${it.text}</span>
                <div style="display:flex; gap:5px;">
                    <button class="btn-sm ${hasC?'has-note-btn':''}" onclick="openDetails('${it.id}','${it.text.replace(/'/g, "\\'")}','${(it.note||"").replace(/'/g, "\\'")}','${it.img||''}')">ℹ️</button>
                    ${it.status==='active'? `<button class="btn-sm" style="background:var(--success)" onclick="firebase.database().ref('shoppingList/${it.id}').update({status:'done'})">✔</button>
                    <button class="btn-sm" style="background:var(--danger)" onclick="firebase.database().ref('shoppingList/${it.id}').update({status:'x'})">✖</button>` : 
                    `<button class="btn-sm" onclick="firebase.database().ref('shoppingList/${it.id}').update({status:'active'})">↩</button>`}
                </div>`;
            
            let sX = 0;
            div.addEventListener('touchstart', e => sX = e.touches[0].clientX);
            div.addEventListener('touchmove', e => { 
                let dX = sX - e.touches[0].clientX; 
                if(dX > 10 && dX < 100) div.style.transform = `translateX(-${dX}px)`; 
            });
            div.addEventListener('touchend', e => div.style.transform = (sX - e.changedTouches[0].clientX > 50) ? 'translateX(-75px)' : 'translateX(0)');
            
            wrap.appendChild(div);
            conts[it.status==='done'?'done':(it.status==='x'?'x':'active')].appendChild(wrap);
        });
    }

    listRef.on('value', snap => {
        const data = snap.val();
        render(data ? Object.keys(data).map(k => ({id:k, ...data[k]})) : []);
    });

    function addItem() {
        const t = document.getElementById('manualInput').value.trim();
        const n = document.getElementById('manualNote').value.trim();
        if(t) { 
            listRef.push({ text: t, note: n, img: tempUrl, status: 'active', order: Date.now() }); 
            closeModal('inputModal');
            document.getElementById('manualInput').value=""; document.getElementById('manualNote').value="";
            tempUrl = "";
        }
    }

    function clearAllItems() { if(confirm("Mindent törölsz?")) listRef.remove(); }
    
    document.getElementById('fileIn').onchange = async e => {
        const file = e.target.files[0];
        if(!file) return;
        const ref = storage.ref('img/' + Date.now() + "_" + file.name);
        await ref.put(file);
        tempUrl = await ref.getDownloadURL();
        document.getElementById('fileBtn').innerText = "✅ Kép OK";
    };

    document.getElementById('fileInExtra').onchange = async e => {
        const file = e.target.files[0];
        if(!file) return;
        const ref = storage.ref('img/' + Date.now() + "_" + file.name);
        await ref.put(file);
        const url = await ref.getDownloadURL();
        await listRef.child(currentId).update({ img: url });
        const s = await listRef.child(currentId).get();
        openDetails(currentId, s.val().text, s.val().note, s.val().img);
    };
</script>
</body>
</html>
