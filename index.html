<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bevásárló lista v1.6.3</title>
    
    <link rel="apple-touch-icon" href="IMG_4302.png">
    <link rel="icon" type="image/png" href="IMG_4302.png">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    
    <style>
        :root { --bg: #0b0b0b; --card-bg: #1a1a1a; --item-bg: #262626; --text: #f0f0f0; --primary: #a87ff3; --success: #32a852; --danger: #eb4034; --grey: #333; --border: #444; }
        .light-mode { --bg: #d1d1d6; --card-bg: #f0f0f7; --item-bg: #ffffff; --text: #1c1c1e; --primary: #5856d6; --success: #34c759; --danger: #d66d6d; --grey: #e5e5ea; --border: #c7c7cc; }
        
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: -apple-system, sans-serif; user-select: none; -webkit-user-select: none; }
        body { background: var(--bg); color: var(--text); margin: 0; padding: 10px; display: flex; justify-content: center; min-height: 100vh; transition: background 0.3s; }
        
        .app-card { background: var(--card-bg); width: 100%; max-width: 400px; border-radius: 20px; padding: 15px; align-self: flex-start; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        
        .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; position: relative; }
        .mode-toggle { background: none; border: none; color: var(--text); font-size: 20px; cursor: pointer; padding: 5px; }
        .version-label { font-size: 10px; color: #444; position: absolute; left: 50%; transform: translateX(-50%); top: -5px; }
        
        .title-section { position: relative; display: flex; flex-direction: column; align-items: center; gap: 5px; margin-bottom: 15px; }
        .list-selector-btn { position: absolute; right: 0; top: 50%; transform: translateY(-50%); background: var(--grey); color: var(--text); border: none; border-radius: 8px; padding: 6px 12px; font-size: 13px; font-weight: bold; cursor: pointer; }

        .notif-toggle-btn { border: none; color: white; font-size: 11px; font-weight: bold; cursor: pointer; padding: 8px 20px; border-radius: 20px; transition: 0.3s; text-transform: uppercase; min-width: 160px; }
        .notif-on { background-color: var(--success) !important; }
        .notif-off { background-color: var(--danger) !important; }

        .col-label { font-size: 10px; text-align: center; color: #aaa; margin: 10px auto 8px; text-transform: uppercase; letter-spacing: 1px; background: var(--grey); padding: 4px 12px; border-radius: 20px; display: table; }
        .list-container { display: flex; flex-direction: column; gap: 8px; min-height: 20px; width: 100%; }
        
        .item-wrapper { position: relative; border-radius: 12px; overflow: hidden; background: transparent; width: 100%; isolation: isolate; }
        .delete-btn-bg { position: absolute; right: 1px; top: 1px; bottom: 1px; width: 78px; background: var(--danger); color: white; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: bold; z-index: 1; border-radius: 0 11px 11px 0; }
        .item { background: var(--item-bg); padding: 10px 12px; border-radius: 12px; display: flex; align-items: center; gap: 8px; position: relative; z-index: 5; transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1); border: 1.5px solid transparent; width: 100%; }
        
        .drag-handle { color: #555; font-size: 18px; cursor: grab; flex-shrink: 0; }
        .item-text { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; min-width: 0; }
        
        .status-done { background: linear-gradient(rgba(50, 168, 82, 0.1), rgba(50, 168, 82, 0.1)), var(--card-bg) !important; border-color: var(--success) !important; }
        .status-x { background: linear-gradient(rgba(235, 64, 52, 0.1), rgba(235, 64, 52, 0.1)), var(--card-bg) !important; border-color: var(--danger) !important; }
        
        .btn-sm { width: 28px; height: 28px; border-radius: 7px; display: flex; align-items: center; justify-content: center; cursor: pointer; background: rgba(255,255,255,0.08); color: white; border: 1px solid transparent; font-size: 12px; }
        .has-data { border-color: var(--danger) !important; background: rgba(235, 64, 52, 0.1); }

        .bottom-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; width: 100%; }

        .custom-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 2000; justify-content: center; align-items: flex-start; padding: 40px 20px 20px; backdrop-filter: blur(5px); overflow-y: auto; }
        .modal-content { background: var(--card-bg); width: 100%; max-width: 350px; border-radius: 20px; padding: 15px; position: relative; border: 1px solid var(--border); display: flex; flex-direction: column; margin-top: 20px; }
        .close-x { position: absolute; top: 3px; right: 13px; font-size: 28px; color: var(--danger); cursor: pointer; z-index: 2001; }
        
        textarea, input[type="text"], input[type="number"] { width: 100%; padding: 12px; margin-bottom: 10px; border-radius: 10px; border: 1px solid var(--border); background: #000; color: #fff; outline: none; font-size: 14px; }
        .action-btn { width: 100%; padding: 15px; border-radius: 10px; border: none; background: var(--primary); color: white; font-weight: bold; cursor: pointer; font-size: 16px; margin-top: 10px; }
        
        .img-preview-box { width: 100%; max-height: 150px; object-fit: cover; border-radius: 10px; margin: 8px 0; border: 1px solid var(--border); }
        .info-box { background: rgba(255,255,255,0.03); padding: 10px; border-radius: 10px; margin-bottom: 10px; border: 1px solid rgba(255,255,255,0.05); }
    </style>
</head>
<body class="dark">

<div class="app-card">
    <div class="header-top">
        <button class="mode-toggle" onclick="toggleMode()">🌓</button>
        <div class="version-label">v1.6.3</div>
        <div style="display:flex; gap:12px; align-items: center;">
            <button onclick="openModal('bugModal')" style="background:none; border:none; font-size:20px; cursor:pointer;">✉️</button>
            <button onclick="clearAllItems()" style="background:none; border:none; font-size:20px; opacity:0.3; cursor:pointer;">🗑️</button>
        </div>
    </div>
    
    <div class="title-section">
        <h2 style="font-size:18px; margin:0; letter-spacing:1px; font-weight:900;">BEVÁSÁRLÓ LISTA</h2>
        <button id="notifBtn" class="notif-toggle-btn notif-off" onclick="toggleNotifications()">Értesítések: KI</button>
        <button class="list-selector-btn" id="activeListDisplay" onclick="openModal('listModal')">----</button>
    </div>

    <button onclick="openModal('inputModal')" style="width:100%; padding:14px; border-radius:12px; border:none; background:var(--grey); color:var(--text); font-weight:bold; cursor:pointer; margin-bottom:20px; font-size:14px;">HOZZÁADÁS</button>

    <div class="col-label" id="activeCountLabel">Aktív tételek (0)</div>
    <div id="activeItems" class="list-container"></div>

    <div class="bottom-grid">
        <div class="sub-col"><div class="col-label">Megvan</div><div id="doneItems" class="list-container"></div></div>
        <div class="sub-col"><div class="col-label">Nincs</div><div id="missingItems" class="list-container"></div></div>
    </div>
</div>

<div id="bugModal" class="custom-modal">
    <div class="modal-content">
        <div class="close-x" onclick="closeModal('bugModal')">×</div>
        <h3 style="text-align:center; margin-top:10px; margin-bottom:15px;">Visszajelzés ✉️</h3>
        
        <div style="display:flex; gap:10px;">
            <div style="flex:1;">
                <label style="font-size:10px; color:#aaa; margin-left:5px; text-transform: uppercase;">Név</label>
                <input type="text" id="bugName" placeholder="Opcionális">
            </div>
            <div style="flex:1;">
                <label style="font-size:10px; color:#aaa; margin-left:5px; text-transform: uppercase;">Email</label>
                <input type="text" id="bugEmail" placeholder="Opcionális">
            </div>
        </div>

        <label style="font-size:10px; color:#aaa; margin-left:5px; text-transform: uppercase;">Discord név</label>
        <input type="text" id="bugDiscord" placeholder="felhasznalo">

        <label style="font-size:10px; color:#aaa; margin-left:5px; text-transform: uppercase;">Leírás / Hiba (Kötelező)</label>
        <textarea id="bugText" placeholder="Írd le a hibát vagy az új ötletedet..." rows="3"></textarea>
        
        <label style="display:block; text-align:center; padding:10px; background:#333; border-radius:8px; margin-bottom:10px; cursor:pointer; color: white; font-size: 12px; font-weight:bold;">📷 KÉP CSATOLÁSA (Opcionális)<input type="file" id="bugPhotoFile" accept="image/*" style="display:none" onchange="previewBugPhoto(this)"></label>
        <img id="bugPhotoPreview" style="width:100%; max-height:120px; object-fit:contain; display:none; margin-bottom:10px; border-radius:8px; border:1px solid #444;">

        <button class="action-btn" id="sendBugBtn" onclick="sendBugReport()">KÜLDÉS DISCORDRA</button>
    </div>
</div>

<div id="listModal" class="custom-modal">
    <div class="modal-content">
        <div class="close-x" onclick="closeModal('listModal')">×</div>
        <h3 style="text-align:center; margin-top:10px;">Szoba</h3>
        <div id="myCurrentCode" style="text-align:center; font-size:24px; font-weight:900; margin:10px 0; color:var(--primary);">0000</div>
        <input type="number" id="joinCodeInput" placeholder="4 jegyű kód...">
        <button class="action-btn" onclick="joinByCode()" style="background:var(--success)">CSATLAKOZÁS</button>
        <button class="action-btn" onclick="generateNewCode()" style="background:var(--grey); font-size:12px;">ÚJ SZÓBA</button>
    </div>
</div>

<div id="inputModal" class="custom-modal">
    <div class="modal-content">
        <div class="close-x" onclick="closeModal('inputModal')">×</div>
        <input type="text" id="manualInput" placeholder="Termék neve..." style="margin-top:20px;">
        <textarea id="manualNote" placeholder="Megjegyzés..." rows="2"></textarea>
        <label style="display:block; text-align:center; padding:12px; background:#333; border-radius:8px; margin-bottom:10px; cursor:pointer; color: white; font-size: 13px; font-weight:bold;">📷 FOTÓ<input type="file" id="newPhotoFile" accept="image/*" style="display:none" onchange="previewPhoto(this, 'newPhotoPreview')"></label>
        <img id="newPhotoPreview" class="img-preview-box" style="display:none;">
        <button class="action-btn" onclick="addItem()">HOZZÁADÁS</button>
    </div>
</div>

<div id="infoModal" class="custom-modal">
    <div class="modal-content">
        <div class="close-x" onclick="closeModal('infoModal')">×</div>
        <h3 id="infoTitle" style="text-align:center; margin:25px 0 12px; font-size:16px;"></h3>
        <div id="viewArea">
            <div id="noteBox" class="info-box">
                <div id="noteDisplay" style="font-size:13px; text-align:center; margin-bottom:10px; color:#ccc;"></div>
                <div id="noteActions" style="display:flex; justify-content:center; gap:20px;">
                    <button onclick="showEdit('note')" style="background:none; border:none; font-size:18px;">✏️</button>
                    <button onclick="deleteField('note')" style="background:none; border:none; font-size:18px;">🗑️</button>
                </div>
                <button id="addNoteBtn" onclick="showEdit('note')" style="width:100%; background:var(--grey); border:none; color:var(--text); padding:10px; border-radius:8px; font-weight:bold; font-size:12px;">+ Megjegyzés</button>
            </div>
            <div id="photoBox" class="info-box" style="text-align:center;">
                <img id="infoPhotoImg" class="img-preview-box" style="cursor:pointer;" onclick="window.open(this.src)">
                <div id="photoActions" style="display:flex; justify-content:center; gap:20px;">
                    <button onclick="showEdit('photo')" style="background:none; border:none; font-size:18px;">✏️</button>
                    <button onclick="deleteField('photo')" style="background:none; border:none; font-size:18px;">🗑️</button>
                </div>
                <button id="addPhotoBtn" onclick="showEdit('photo')" style="width:100%; background:var(--grey); border:none; color:var(--text); padding:10px; border-radius:8px; font-weight:bold; font-size:12px;">+ Fotó</button>
            </div>
        </div>
        <div id="editArea" style="display:none;">
            <div id="noteEditSection" style="display:none;"><textarea id="editNoteInput" rows="4"></textarea></div>
            <div id="photoEditSection" style="display:none;"><input type="file" id="editPhotoInput" accept="image/*" style="display:none" onchange="previewPhoto(this, 'editPhotoPreview')"><img id="editPhotoPreview" class="img-preview-box" style="display:none;"></div>
            <button class="action-btn" onclick="saveInfo()">MENTÉS</button>
        </div>
    </div>
</div>

<script>
    const firebaseConfig = { apiKey: "AIzaSyC0fhL9VVErpN9LX6eJ8Tv5nuxF5Ea-qjE", databaseURL: "https://kozoslista-e0717-default-rtdb.europe-west1.firebasedatabase.app", projectId: "kozoslista-e0717" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    
    let currentListId = localStorage.getItem('currentListId') || (Math.floor(1000 + Math.random() * 9000)).toString();
    localStorage.setItem('currentListId', currentListId);
    let listRef = db.ref('shoppingLists/' + currentListId);

    const DISCORD_WEBHOOK_URL = "https://discord.com/api/webhooks/1097304257084018688/9uXJHFAgg4U19P4QOxuNIFzatGbfGjJmQntZqTp6qf9F4nlC_U7rlffLowivrcNu6_rM";
    let currentItemId = null, tempPhotoData = "", bugPhotoData = "", isSorting = false, notificationsEnabled = localStorage.getItem('notifEnabled') === 'true';

    function vibrate(ms = 30) { if (navigator.vibrate) navigator.vibrate(ms); }
    
    function initList() {
        document.getElementById('activeListDisplay').innerText = currentListId;
        document.getElementById('myCurrentCode').innerText = currentListId;
        listRef.off();
        listRef = db.ref('shoppingLists/' + currentListId);
        listRef.on('value', snap => { 
            const d = snap.val(); 
            const items = d ? Object.keys(d).map(k => ({id: k, ...d[k]})) : [];
            render(items); 
        });
    }

    function previewBugPhoto(input) {
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = e => {
                bugPhotoData = e.target.result;
                const prev = document.getElementById('bugPhotoPreview');
                prev.src = e.target.result;
                prev.style.display = 'block';
            };
            reader.readAsDataURL(input.files[0]);
        }
    }

    function sendBugReport() {
        const name = document.getElementById('bugName').value.trim() || "Névtelen";
        const email = document.getElementById('bugEmail').value.trim() || "Nincs megadva";
        let discord = document.getElementById('bugDiscord').value.trim();
        const message = document.getElementById('bugText').value.trim();
        
        if(!message) { vibrate(100); alert("A leírás kitöltése kötelező!"); return; }

        if(discord && !discord.startsWith('@')) discord = '@' + discord;
        else if(!discord) discord = "Nincs megadva";

        const btn = document.getElementById('sendBugBtn');
        btn.innerText = "KÜLDÉS..."; btn.disabled = true;

        const currentMode = document.body.classList.contains('light-mode') ? "Light Mode" : "Dark Mode";

        fetch(DISCORD_WEBHOOK_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                embeds: [{
                    title: "✉️ Új visszajelzés (v1.6.3)",
                    color: 11042707,
                    fields: [
                        { name: "Küldő", value: name, inline: true },
                        { name: "Email", value: email, inline: true },
                        { name: "Discord", value: discord, inline: true },
                        { name: "Szoba", value: currentListId, inline: true },
                        { name: "Mód", value: currentMode, inline: true },
                        { name: "Leírás", value: message }
                    ]
                }]
            })
        }).then(() => {
            vibrate(100); alert("Visszajelzés elküldve!");
            document.getElementById('bugText').value = "";
            document.getElementById('bugPhotoPreview').style.display = 'none';
            bugPhotoData = "";
            closeModal('bugModal');
        }).finally(() => { btn.innerText = "KÜLDÉS DISCORDRA"; btn.disabled = false; });
    }

    function render(items) {
        const containers = { active: 'activeItems', done: 'doneItems', x: 'missingItems' };
        Object.values(containers).forEach(id => document.getElementById(id).innerHTML = '');
        let activeCount = 0;
        items.sort((a,b) => (a.order || 0) - (b.order || 0)).forEach(it => {
            if(it.status === 'active') activeCount++;
            const wrap = document.createElement('div'); wrap.className = 'item-wrapper'; wrap.setAttribute('data-id', it.id);
            const del = document.createElement('div'); del.className = 'delete-btn-bg'; del.innerText = 'TÖRLÉS'; del.onclick = () => listRef.child(it.id).remove();
            const div = document.createElement('div'); div.className = `item ${it.status==='done'?'status-done':(it.status==='x'?'status-x':'')}`;
            const hasExtra = it.note || it.photo;
            div.innerHTML = `${it.status==='active'?'<div class="drag-handle">≡</div>':''} <span class="item-text">${it.text}</span><div style="display:flex; gap:4px; margin-left:auto;"><button class="btn-sm ${hasExtra?'has-data':''}" onclick="openInfo('${it.id}')">ℹ️</button>${it.status==='active'?`<button class="btn-sm" style="background:var(--success)" onclick="updateStatus('${it.id}', 'done')">✔</button><button class="btn-sm" style="background:var(--danger)" onclick="updateStatus('${it.id}', 'x')">✖</button>`:`<button class="btn-sm" onclick="updateStatus('${it.id}', 'active')">↩</button>`}</div>`;
            
            let sX = 0, cX = 0;
            div.addEventListener('touchstart', e => { if(isSorting) return; sX = e.touches[0].clientX; div.style.transition = 'none'; }, {passive:true});
            div.addEventListener('touchmove', e => { if(isSorting) return; let diff = sX - e.touches[0].clientX; cX = Math.max(0, Math.min(diff, 85)); div.style.transform = `translateX(-${cX}px)`; }, {passive:true});
            div.addEventListener('touchend', () => { if(isSorting) return; div.style.transition = 'transform 0.3s'; if(cX > 50) { div.style.transform = 'translateX(-80px)'; } else { div.style.transform = 'translateX(0)'; } });

            wrap.appendChild(del); wrap.appendChild(div);
            document.getElementById(containers[it.status] || 'activeItems').appendChild(wrap);
        });
        document.getElementById('activeCountLabel').innerText = `Aktív tételek (${activeCount})`;
    }

    function updateStatus(id, s) { vibrate(40); listRef.child(id).update({status: s}); }
    function openModal(id) { document.getElementById(id).style.display = 'flex'; }
    function closeModal(id) { document.getElementById(id).style.display = 'none'; }
    function toggleMode() { vibrate(20); document.body.classList.toggle('light-mode'); }
    function generateNewCode() { const c = (Math.floor(1000 + Math.random() * 9000)).toString(); if(confirm("Új szoba: "+c+"?")) updateRoom(c); }
    function joinByCode() { const i = document.getElementById('joinCodeInput').value; if(i.length===4) { updateRoom(i); closeModal('listModal'); } }
    function updateRoom(c) { currentListId = c; localStorage.setItem('currentListId', c); initList(); }
    function clearAllItems() { if(confirm("Minden törlése?")) listRef.remove(); }
    function toggleNotifications() { vibrate(20); notificationsEnabled = !notificationsEnabled; localStorage.setItem('notifEnabled', notificationsEnabled); updateNotifBtnUI(); }
    function updateNotifBtnUI() { const b = document.getElementById('notifBtn'); b.innerText = notificationsEnabled ? "Értesítések: BE" : "Értesítések: KI"; b.className = `notif-toggle-btn ${notificationsEnabled?'notif-on':'notif-off'}`; }
    function previewPhoto(i, pId) { if(i.files[0]) { const r = new FileReader(); r.onload = e => { tempPhotoData = e.target.result; const p = document.getElementById(pId); p.src = tempPhotoData; p.style.display='block'; }; r.readAsDataURL(i.files[0]); } }
    function addItem() { const v = document.getElementById('manualInput').value.trim(); if(v) { listRef.push({ text: v, note: document.getElementById('manualNote').value, photo: tempPhotoData, status: 'active', order: Date.now() }); closeModal('inputModal'); tempPhotoData = ""; } }
    function openInfo(id) { currentItemId = id; vibrate(15); document.getElementById('viewArea').style.display = 'block'; document.getElementById('editArea').style.display = 'none'; listRef.child(id).once('value', snap => { const it = snap.val(); document.getElementById('infoTitle').innerText = it.text; const nD = document.getElementById('noteDisplay'), nA = document.getElementById('noteActions'), nB = document.getElementById('addNoteBtn'); if(it.note){ nD.innerText = it.note; nD.style.display='block'; nA.style.display='flex'; nB.style.display='none'; document.getElementById('editNoteInput').value = it.note; } else { nD.style.display='none'; nA.style.display='none'; nB.style.display='block'; document.getElementById('editNoteInput').value = ""; } const pI = document.getElementById('infoPhotoImg'), pA = document.getElementById('photoActions'), pB = document.getElementById('addPhotoBtn'); if(it.photo){ pI.src = it.photo; pI.style.display='block'; pA.style.display='flex'; pB.style.display='none'; } else { pI.style.display='none'; pA.style.display='none'; pB.style.display='block'; } openModal('infoModal'); }); }
    function showEdit(type) { vibrate(15); document.getElementById('viewArea').style.display = 'none'; document.getElementById('editArea').style.display = 'block'; document.getElementById('noteEditSection').style.display = type === 'note' ? 'block' : 'none'; document.getElementById('photoEditSection').style.display = type === 'photo' ? 'block' : 'none'; if(type==='photo') document.getElementById('editPhotoInput').click(); }
    function saveInfo() { const noteValue = document.getElementById('editNoteInput').value; listRef.child(currentItemId).once('value', snap => { const it = snap.val(); const fNote = document.getElementById('noteEditSection').style.display === 'block' ? noteValue : (it.note || ""); const fPhoto = document.getElementById('photoEditSection').style.display === 'block' ? tempPhotoData : (it.photo || ""); listRef.child(currentItemId).update({ note: fNote, photo: fPhoto }).then(() => { tempPhotoData = ""; vibrate(30); openInfo(currentItemId); }); }); }
    function deleteField(f) { if(confirm("Biztosan törlöd?")) { vibrate(50); let u = {}; u[f] = ""; listRef.child(currentItemId).update(u).then(() => { openInfo(currentItemId); }); } }

    initList(); updateNotifBtnUI();
    new Sortable(document.getElementById('activeItems'), { handle: '.drag-handle', animation: 200, onStart: () => { isSorting = true; }, onEnd: () => { isSorting = false; document.querySelectorAll('#activeItems .item-wrapper').forEach((el, i) => listRef.child(el.getAttribute('data-id')).update({order: Date.now()+i})); } });
</script>
</body>
</html>
