<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bevásárló lista</title>
    <link rel="apple-touch-icon" href="IMG_4302.png">
    <link rel="icon" type="image/png" href="IMG_4302.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <style>
        :root { --bg: #0b0b0b; --card-bg: #1a1a1a; --item-bg: #262626; --text: #f0f0f0; --primary: #a87ff3; --success: #32a852; --danger: #eb4034; --grey: #333; --border: #444; }
        
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: -apple-system, sans-serif; user-select: none; -webkit-user-select: none; }
        input, textarea { user-select: text !important; -webkit-user-select: text !important; }

        body { background: var(--bg); color: var(--text); margin: 0; padding: 8px; display: flex; justify-content: center; min-height: 100vh; overflow-x: hidden; }
        .app-card { background: var(--card-bg); width: 100%; max-width: 400px; border-radius: 20px; padding: 12px; align-self: flex-start; }
        
        .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; position: relative; }
        .version-tag { position: absolute; left: 50%; transform: translateX(-50%); font-size: 10px; font-weight: bold; opacity: 0.3; }
        
        .notif-toggle-btn { background: var(--item-bg); color: var(--text); border: 1px solid var(--border); padding: 6px 15px; border-radius: 20px; font-size: 10px; font-weight: bold; cursor: pointer; }
        .notif-toggle-btn.active { background: var(--success); color: white; border-color: var(--success); }

        .col-label { font-size: 9px; text-align: center; color: #aaa; margin: 12px auto 6px; text-transform: uppercase; background: var(--grey); padding: 3px 10px; border-radius: 20px; display: table; }
        .list-container { display: flex; flex-direction: column; gap: 6px; }
        
        .item-wrapper { position: relative; border-radius: 10px; overflow: hidden; width: 100%; }
        .delete-btn-bg { position: absolute; right: 0; top: 0; bottom: 0; width: 70px; background: var(--danger); color: white; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: bold; }
        
        .item { background: var(--item-bg); padding: 8px 10px; border-radius: 10px; display: flex; align-items: center; gap: 8px; position: relative; z-index: 5; transition: transform 0.2s; border: 1.5px solid transparent; touch-action: pan-y; width: 100%; }
        
        /* UNIVERZÁLIS FIX: Mindenhol levágja a szöveget, ha hosszú */
        .item span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; min-width: 0; }
        
        .btn-group { display: flex; gap: 4px; flex-shrink: 0; align-items: center; }
        .btn-sm { width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.1); color: white; border: none; font-size: 14px; }
        .has-data { border: 1.5px solid var(--danger) !important; }
        
        .status-done { border-color: var(--success) !important; }
        .status-x { border-color: var(--danger) !important; }

        .bottom-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
        /* Alsó oszlopokban kisebb margó a gomboknak */
        .bottom-grid .btn-group { gap: 3px; }
        .bottom-grid .btn-sm { width: 28px; height: 28px; font-size: 12px; }

        .custom-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.92); z-index: 2000; justify-content: center; align-items: center; padding: 20px; }
        .modal-content { background: var(--card-bg); width: 100%; max-width: 360px; border-radius: 24px; padding: 40px 20px 25px; position: relative; border: 1px solid var(--border); }
        .close-x { position: absolute; top: 12px; right: 20px; font-size: 30px; color: var(--danger); cursor: pointer; font-weight: bold; }
        
        #infoTitle { text-align: center; margin: 0 0 20px 0; font-size: 18px; word-break: break-word; white-space: normal; line-height: 1.3; }
        .action-btn { width: 100%; padding: 15px; border-radius: 12px; border: none; background: var(--primary); color: white; font-weight: bold; }
        .info-box { background: rgba(255,255,255,0.05); padding: 12px; border-radius: 12px; margin-bottom: 12px; text-align: center; }
    </style>
</head>
<body>

<div class="app-card">
    <div class="header-top">
        <button onclick="document.body.classList.toggle('light-mode')" style="background:none; border:none; font-size:18px;">🌓</button>
        <div class="version-tag">v0.9.2</div>
        <button onclick="clearAll()" style="background:none; border:none; font-size:16px; opacity:0.2;">🗑️</button>
    </div>
    
    <div style="display:flex; justify-content:center; margin-bottom:15px;">
        <button id="notifBtn" class="notif-toggle-btn" onclick="toggleNotifications()">Értesítések: KI</button>
    </div>

    <button onclick="openModal('inputModal')" style="width:100%; padding:14px; border-radius:12px; border:none; background:var(--grey); color:var(--text); font-weight:bold; margin-bottom:15px;">+ ÚJ TÉTEL</button>

    <div class="col-label">Aktív lista</div>
    <div id="activeItems" class="list-container"></div>
    
    <div class="bottom-grid">
        <div><div class="col-label">Megvan</div><div id="doneItems" class="list-container"></div></div>
        <div><div class="col-label">Nincs</div><div id="missingItems" class="list-container"></div></div>
    </div>
</div>

<div id="inputModal" class="custom-modal"><div class="modal-content"><div class="close-x" onclick="closeModal('inputModal')">×</div><input type="text" id="manualInput" placeholder="Termék..."><textarea id="manualNote" placeholder="Megjegyzés..."></textarea><button class="action-btn" onclick="addItem()">HOZZÁADÁS</button></div></div>
<div id="infoModal" class="custom-modal"><div class="modal-content"><div class="close-x" onclick="closeModal('infoModal')">×</div><h3 id="infoTitle"></h3><div id="viewArea"><div class="info-box"><div id="noteDisplay"></div></div></div><button class="action-btn" onclick="closeModal('infoModal')">BEZÁRÁS</button></div></div>

<script>
    const firebaseConfig = { apiKey: "AIzaSyC0fhL9VVErpN9LX6eJ8Tv5nuxF5Ea-qjE", databaseURL: "https://kozoslista-e0717-default-rtdb.europe-west1.firebasedatabase.app", projectId: "kozoslista-e0717" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database(), listRef = db.ref('shoppingList');
    let isInitialLoad = true, notificationsEnabled = localStorage.getItem('notifications') === 'true';

    function updateNotifUI() { 
        const btn = document.getElementById('notifBtn'); 
        btn.innerText = notificationsEnabled ? "Értesítések: BE" : "Értesítések: KI"; 
        btn.classList.toggle('active', notificationsEnabled); 
    }
    updateNotifUI();

    async function toggleNotifications() {
        if (!notificationsEnabled) { 
            const perm = await Notification.requestPermission(); 
            if (perm === 'granted') { 
                notificationsEnabled = true; 
                localStorage.setItem('notifications', 'true'); 
                new Notification("Rendszer üzenet", { body: "Értesítések aktiválva", tag: "sys-"+Date.now() });
            } 
        } else { notificationsEnabled = false; localStorage.setItem('notifications', 'false'); }
        updateNotifUI();
    }

    // Értesítés v4: A legstabilabb megoldás
    listRef.on('child_added', snap => {
        if (!isInitialLoad && notificationsEnabled && snap.val().status === 'active' && document.visibilityState !== 'visible') {
            try {
                navigator.serviceWorker.ready.then(reg => {
                    reg.showNotification('Új tétel a listán!', {
                        body: snap.val().text,
                        icon: 'IMG_4302.png',
                        tag: 'notif-' + Math.random().toString(36).substr(2, 9), // Teljesen véletlen tag
                        renotify: true,
                        vibrate: [200, 100, 200]
                    });
                });
            } catch(e) {
                new Notification("Új tétel!", { body: snap.val().text, tag: 'fallback-'+Date.now() });
            }
        }
    });
    listRef.once('value', () => { setTimeout(() => isInitialLoad = false, 1200); });

    function render(data) {
        const containers = { active: 'activeItems', done: 'doneItems', x: 'missingItems' };
        Object.values(containers).forEach(id => document.getElementById(id).innerHTML = '');
        if(!data) return;
        Object.keys(data).map(k => ({id:k, ...data[k]})).sort((a,b) => a.order - b.order).forEach(it => {
            const wrap = document.createElement('div'); wrap.className = 'item-wrapper'; wrap.setAttribute('data-id', it.id);
            const del = document.createElement('div'); del.className = 'delete-btn-bg'; del.innerText = 'TÖRLÉS'; del.onclick = () => listRef.child(it.id).remove();
            const div = document.createElement('div'); div.className = `item ${it.status==='done'?'status-done':it.status==='x'?'status-x':''}`;
            const hasExtra = (it.note && it.note.trim()) || it.photo;

            div.innerHTML = `
                ${it.status==='active'?'<div class="drag-handle">≡</div>':'<div style="width:2px"></div>'}
                <span>${it.text}</span>
                <div class="btn-group">
                    <button class="btn-sm ${hasExtra?'has-data':''}" onclick="openInfo('${it.id}')">i</button>
                    ${it.status==='active' ? 
                        `<button class="btn-sm" style="background:var(--success)" onclick="listRef.child('${it.id}').update({status:'done'})">✔</button>
                         <button class="btn-sm" style="background:var(--danger)" onclick="listRef.child('${it.id}').update({status:'x'})">✖</button>` :
                        `<button class="btn-sm" onclick="listRef.child('${it.id}').update({status:'active'})">↩</button>`
                    }
                </div>`;

            let sX = 0, cX = 0, isSwipe = false;
            div.addEventListener('touchstart', e => { sX = e.touches[0].clientX; div.style.transition = 'none'; }, {passive:true});
            div.addEventListener('touchmove', e => {
                let d = sX - e.touches[0].clientX;
                if (d > 15) { isSwipe = true; cX = Math.min(d, 70); div.style.transform = `translateX(-${cX}px)`; }
            }, {passive:true});
            div.addEventListener('touchend', () => {
                div.style.transition = 'transform 0.3s ease';
                div.style.transform = (isSwipe && cX > 35) ? 'translateX(-70px)' : 'translateX(0)';
                isSwipe = false;
            });

            wrap.appendChild(del); wrap.appendChild(div);
            document.getElementById(containers[it.status] || 'activeItems').appendChild(wrap);
        });
    }

    function addItem() {
        const v = document.getElementById('manualInput').value.trim();
        if(v) { listRef.push({ text: v, note: document.getElementById('manualNote').value, status: 'active', order: Date.now() }); closeModal('inputModal'); }
    }

    listRef.on('value', snap => render(snap.val()));
    new Sortable(document.getElementById('activeItems'), { handle: '.drag-handle', animation: 150, onEnd: () => {
        document.querySelectorAll('#activeItems .item-wrapper').forEach((el, i) => listRef.child(el.getAttribute('data-id')).update({ order: Date.now() + i }));
    }});

    function openModal(id) { document.getElementById(id).style.display = 'flex'; }
    function closeModal(id) { document.getElementById(id).style.display = 'none'; }
    function openInfo(id) {
        listRef.child(id).once('value', snap => {
            const it = snap.val(); document.getElementById('infoTitle').innerText = it.text;
            document.getElementById('noteDisplay').innerText = it.note || "Nincs megjegyzés.";
            openModal('infoModal');
        });
    }
    function clearAll() { if(confirm("Törölsz mindent?")) listRef.remove(); }
    
    // Regisztráljuk a Service Workert
    if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js'); }
</script>
</body>
</html>
