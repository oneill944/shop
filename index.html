<style>

<script>
const firebaseConfig={apiKey:"AIzaSyC0fhL9VVErpN9LX6eJ8Tv5nuxF5Ea-qjE",databaseURL:"https://kozoslista-e0717-default-rtdb.europe-west1.firebasedatabase.app",projectId:"kozoslista-e0717"};
firebase.initializeApp(firebaseConfig);
const db=firebase.database();
let currentListId=localStorage.getItem('currentListId')||"2316";
let listRef=db.ref('shoppingLists/'+currentListId);
const photoRef=id=>db.ref('photos/'+currentListId+'/'+id);
let openId=null,pickTarget=null,chosenIcon=null,detailId=null,lastItems=[],pendingFull=null,pendingThumb=null;
const $=id=>document.getElementById(id);
if(localStorage.getItem('dark')==='1')document.body.classList.add('dark');

/* ---------- Kategóriák (bolti sorrend) ---------- */
const CATS=[['zold','Zöldség & gyümölcs','🥦'],['pek','Pékáru','🍞'],['hus','Húsok & felvágottak','🥩'],['tej','Tejtermék & tojás','🥛'],['szaraz','Száraz élelmiszer','🥫'],['edes','Édesség & snack','🍫'],['ital','Italok','🥤'],['fagy','Fagyasztott','🧊'],['haz','Háztartás & drogéria','🧻'],['egyeb','Egyéb','📦']];
const DATA=`zold|🥦:zoldseg,brokkoli,karfiol,kaposzta,cukkini,padlizsan;🍅:paradicsom;🫑:paprika;🥕:sargarepa,repa,petrezselyem;🥔:burgonya,krumpli;🧅:hagyma;🧄:fokhagyma;🥒:uborka;🥬:salata,spenot,rukkola;🍄:gomba;🌽:kukorica;🍎:alma,gyumolcs;🍌:banan;🍊:narancs,mandarin;🍋:citrom,lime;🍇:szolo;🍓:eper,malna,szamoca,afonya;🍉:dinnye;🍐:korte;🍑:barack,szilva,seresznye,cseresznye,meggy;🥑:avokado
pek|🍞:kenyer,kifli,pek,zsemle,piritos,teknyo,bagett,buci;🥐:croissant,vajas
hus|🥩:hus,szalonna,virsli,kolbasz,felvagott,sonka,szalami,steak,darahus,daralt;🍗:csirke,pulyka,szarny;🐟:hal,tonhal,lazac,ponty
tej|🥛:tej,tejfol,kefir,tejszin;🥚:tojas;🧀:sajt,mozzarella,trappista,turo,vaj,margarin,parmezan;🍨:joghurt,puding
szaraz|🍝:teszta,spagetti,tarhonya,makaroni;🍚:rizs;🌾:liszt,zab,muzli,pehely,gabona;🫒:olaj,olivaolaj,ecet;🧂:so,cukor,fuszer,bors,vegeta;🍯:mez,lekvar,dzsem;🥫:konzerv,leves;🫘:bab,lencse,borso,csicseriborso;🥜:dio,mandula,magok;☕:kave,kakao,tea,kapszula;🍜:instant
edes|🍫:csoki,csokolade,nutella,szelet;🍪:keksz,piskota,suti;🍬:cukorka,gumicukor,edesseg,nyaloka;🍿:chips,popcorn,snack,nachos,ragcsa,szalmaburgonya;🥨:perec,ropi;🥜:mogyoro,kesu,pisztacia;🍰:torta,sutemeny,muffin
ital|🍺:sor,keg;🍷:bor,pezsgo,palinka,whisky,vodka,likor,rum,gin;🥤:viz,udito,cola,fanta,szoda,limonade,asvanyviz,energiaital,tonik;🧃:gyumolcsle,narancsle,juice,szorp
fagy|🥶:fagyasztott;🍕:pizza;🍦:fagylalt;🧊:jeg,jegkocka
haz|🧻:wc,papir,zsebkendo,torolkozo,konyhai;🧼:szappan,tisztit,mosogato,mosopor,oblito,hipo,fertotlenito;🧴:samp,tusfurdo,krem,fogkrem,deo,balzsam,naptej;🪥:fogkefe,fogselyem;🪒:borotva;🧽:szivacs,fureszt;🗑️:szemetes,zsak;🔋:elem,akku;💡:izzo,lampa;🕯️:gyertya
egyeb|🐶:kutya,kutyatap;🐱:macska,alom,macskatap;🍼:baba,pelenka,tapszer,popsi;💊:gyogyszer,vitamin,tabletta,tapasz;🌸:virag;🎁:ajandek;📝:fuzet,toll,ceruza;🧦:zokni,ruha,polo,nadrag;🍔:hamburger,hotdog;🌮:taco,tortilla,wrap`;
function norm(s){return String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim()}
const DICT=[];
DATA.split('\n').forEach(line=>{const[c,rest]=line.split('|');rest.split(';').forEach(p=>{const[e,k]=p.split(':');DICT.push([e,k.split(',').map(norm),c])})});
const getMem=()=>{try{return JSON.parse(localStorage.getItem('iconMem')||'{}')}catch(e){return{}}};
function guess(text){
  const n=norm(text),words=n.split(/[^a-z0-9]+/).filter(Boolean);
  let best={icon:'🛒',cat:'egyeb'},bl=0;
  for(const[e,kws,c]of DICT)for(const k of kws){
    const hit=k.length<4?words.includes(k):n.includes(k);
    if(hit&&k.length>bl){best={icon:e,cat:c};bl=k.length}
  }
  const m=getMem()[n];if(m)best.icon=m;
  return best;
}

/* ---------- Realisztikus (3D) ikonok, tartalék: Noto, végül natív emoji ---------- */
function iconEl(e,cls){
  const code=Array.from(e).map(c=>c.codePointAt(0).toString(16)).filter(c=>c!=='fe0f').join('-');
  const srcs=[`https://cdn.jsdelivr.net/npm/@lobehub/fluent-emoji-3d@1.1.0/assets/${code}.webp`,`https://cdn.jsdelivr.net/gh/googlefonts/noto-emoji@main/png/128/emoji_u${code.replace(/-/g,'_')}.png`];
  const img=new Image();img.className='ico '+(cls||'');img.alt=e;img.loading='lazy';let i=0;img.src=srcs[0];
  img.onerror=()=>{i++;if(i<srcs.length)img.src=srcs[i];else{const s=document.createElement('span');s.className='ico '+(cls||'');s.textContent=e;img.replaceWith(s)}};
  return img;
}
const setIcon=(el,e,cls)=>el.replaceChildren(iconEl(e,cls));

function btn(label,bg,fn){

function render(){
  const grid=$('activeGrid'),done=$('doneList'),miss=$('missingList');
  const y=window.scrollY;const sl={};grid.querySelectorAll('.cat-row').forEach(r=>sl[r.dataset.c]=r.scrollLeft);grid.textContent='';done.textContent='';miss.textContent='';
  const items=[...lastItems].sort((a,b)=>(a.order||0)-(b.order||0));
  const groups={};let active=0;
  items.forEach(it=>{
    const g=guess(it.text||'');it._icon=it.icon||g.icon;it._cat=it.cat||g.cat;
    if(it.status==='active'){active++;(groups[it._cat]=groups[it._cat]||[]).push(it)}
    else{
      const t=document.createElement('div');t.className='mini-tag mini';
      const ic=iconEl(it._icon,'s');const s=document.createElement('span');s.textContent=it.text;
      const u=document.createElement('span');u.className='undo';u.textContent='↺';u.onclick=()=>setStatus(it.id,'active');
      t.append(ic,s,u);(it.status==='done'?done:miss).append(t);

    const h=document.createElement('div');h.className='cat-title';h.dataset.k=cid;h.append(iconEl(emo,'s'),document.createTextNode((COL.has(cid)?'▸ ':'▾ ')+label+' ('+arr.length+')'));h.onclick=()=>{COL.has(cid)?COL.delete(cid):COL.add(cid);localStorage.setItem('collapsed',JSON.stringify([...COL]));render()};grid.append(h);const row=document.createElement('div');row.className='cat-row'+(COL.has(cid)?' collapsed':'');row.dataset.c=cid;row.dataset.k=cid;grid.append(row);
    arr.forEach(it=>{

      t.className='tile'+(openId===it.id?' open-menu':'');
      const th=it.thumb||(PM[pmKey(it.text)]||{}).t;if(th){const im=document.createElement('img');im.className='thumb';im.src=th;t.append(im)}else t.append(realPic(it)||iconEl(it._icon));
      const x=document.createElement('div');x.className='tile-text';x.textContent=it.text;t.append(x);
      if(it.note){const n=document.createElement('div');n.className='tile-note';n.textContent=it.note;t.append(n)}

        btn(it.thumb?'🖼️':'ℹ️','#339af0',()=>openDetail(it.id)),btn('🗑️','#b2bec3',()=>delItem(it.id)));
      t.append(a);
      t.onclick=()=>{const was=t.classList.contains('open-menu');document.querySelectorAll('.tile.open-menu').forEach(x=>x.classList.remove('open-menu'));openId=null;if(!was){t.classList.add('open-menu');openId=it.id;const id=it.id;setTimeout(()=>{if(openId===id){t.classList.remove('open-menu');openId=null}},4000)}};
      row.append(t);
    });
    row.scrollLeft=sl[cid]||0;

  renderProg();window.scrollTo(0,y);renderQuick();

/* ---------- Képek ---------- */
function shrink(file,max,q){return new Promise((res,rej)=>{
  const u=URL.createObjectURL(file),im=new Image();
  im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');
    c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);
    URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',q))};
  im.onerror=rej;im.src=u;
});}
$('fileNew').onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  try{pendingFull=await shrink(f,900,.7);pendingThumb=await shrink(f,160,.6);$('newPhotoBtn').textContent='✓ Kép hozzáadva (csere)'}catch(x){alert('A képet nem sikerült beolvasni.')}
  e.target.value='';
};
$('fileDetail').onchange=async e=>{
  const f=e.target.files[0];if(!f||!detailId)return;
  try{
    const full=await shrink(f,900,.7),th=await shrink(f,160,.6);
    await photoRef(detailId).set(full);await listRef.child(detailId).update({thumb:th});savePM((lastItems.find(i=>i.id===detailId)||{}).text,th);
    showPhoto(full);
  }catch(x){alert('A kép mentése nem sikerült.')}
  e.target.value='';
};
function showPhoto(src){
  const p=$('dPhoto');
  if(src){p.src=src;p.style.display='block'}else{p.style.display='none';p.removeAttribute('src')}
  $('dPhotoDel').style.display=src?'block':'none';
  $('dPhotoBtn').textContent=src?'📷 Kép cseréje':'📷 Kép hozzáadása';
}
function removePhoto(){
  if(!detailId)return;
  photoRef(detailId).remove();listRef.child(detailId).update({thumb:null});savePM((lastItems.find(i=>i.id===detailId)||{}).text,null);showPhoto(null);
}

function openAdd(){
  chosenIcon=null;pendingFull=pendingThumb=null;
  $('manualInput').value='';$('manualNote').value='';$('newCat').value='';
  $('newPhotoBtn').textContent='📷 Kép hozzáadása';setIcon($('preview'),'🛒');

function addItem(){
  const val=$('manualInput').value.trim();if(!val)return;
  const parts=val.split(/[,;\n]+/).map(x=>x.trim()).filter(Boolean);
  if(parts.length>1){
    parts.forEach((t,i)=>{t=t[0].toUpperCase()+t.slice(1);const g=guess(t),it={text:t,note:'',icon:g.icon,cat:$('newCat').value||g.cat,status:'active',order:Date.now()+i,by:DEV};listRef.push().set(it);bumpFreq(it)});
    toast('✓ '+parts.length+' tétel hozzáadva');closeModal('inputModal');return;
  }
  const g=guess(val),ref=listRef.push();
  const item={text:val,note:$('manualNote').value.trim(),icon:chosenIcon||g.icon,cat:$('newCat').value||g.cat,status:'active',order:Date.now()};
  if(pendingThumb){item.thumb=pendingThumb;photoRef(ref.key).set(pendingFull);savePM(val,pendingThumb)}
  item.by=DEV;ref.set(item);bumpFreq(item);closeModal('inputModal');
}
function openDetail(id){

  showPhoto(it.thumb||null);
  if(it.thumb)photoRef(id).once('value').then(s=>{if(detailId===id&&s.val())showPhoto(s.val())});
  openModal('detailModal');
}

const EN={tej:'Milk',tejfol:'Sour Cream',vaj:'Butter',sajt:'Cheddar Cheese',mozzarella:'Mozzarella',parmezan:'Parmesan',joghurt:'Yogurt',tojas:'Eggs',csirke:'Chicken',marha:'Beef',sertes:'Pork',szalonna:'Bacon',kolbasz:'Sausages',lazac:'Salmon',tonhal:'Tuna',rizs:'Rice',liszt:'Flour',cukor:'Sugar',so:'Salt',bors:'Black Pepper',olivaolaj:'Olive Oil',mez:'Honey',paradicsom:'Tomatoes',hagyma:'Onions',fokhagyma:'Garlic',burgonya:'Potatoes',krumpli:'Potatoes',sargarepa:'Carrots',uborka:'Cucumber',gomba:'Mushrooms',alma:'Apples',banan:'Bananas',citrom:'Lemon',narancs:'Orange',eper:'Strawberries',avokado:'Avocado',brokkoli:'Broccoli',karfiol:'Cauliflower',spenot:'Spinach',kaposzta:'Cabbage',cukkini:'Courgettes',kukorica:'Sweetcorn',bab:'Kidney Beans',csokolade:'Dark Chocolate',kave:'Coffee'};
const EK=Object.keys(EN).map(k=>[norm(k),EN[k]]).sort((a,b)=>b[0].length-a[0].length);
const WK={kenyer:'Kenyér',zsemle:'Zsemle',kifli:'Kifli',hus:'en:Steak',sonka:'Sonka',szalami:'Szalámi',virsli:'Virsli',kolbasz:'Kolbász',chips:'en:Potato chip',cola:'Kóla',viz:'Ásványvíz',asvanyviz:'Ásványvíz',sor:'en:Beer',bor:'en:Wine',pezsgo:'Pezsgő',palinka:'Pálinka',gumicukor:'Gumicukor',csoki:'Csokoládé',keksz:'Keksz',perec:'Perec',popcorn:'Pattogatott kukorica',pizza:'Pizza',hamburger:'Hamburger',torta:'Torta',fagylalt:'Fagylalt',narancsle:'Narancslé',gyumolcsle:'Gyümölcslé',kave:'en:Coffee',tea:'Tea',teszta:'en:Pasta',spagetti:'en:Spaghetti',zsebkendo:'Papírzsebkendő',wc:'WC-papír',fogkrem:'Fogkrém',szappan:'Szappan',samp:'Sampon',tusfurdo:'Tusfürdő',mosopor:'Mosópor',pelenka:'Pelenka',elem:'Elem',gyertya:'Gyertya',kutyatap:'Kutyaeledel',macskatap:'Macskaeledel',ketchup:'Ketchup',majonez:'Majonéz',mustar:'Mustár',ecet:'Ecet',olaj:'Étolaj',margarin:'Margarin',leves:'Leves',konzerv:'Konzerv'};
const WKK=Object.keys(WK).map(k=>[norm(k),WK[k]]).sort((a,b)=>b[0].length-a[0].length);
const wc=(()=>{try{return JSON.parse(localStorage.getItem('wikiPic')||'{}')}catch(e){return{}}})();
const wpend=new Set();let wT=null;
function wikiPic(it,n,w){
  const h=WKK.find(([k])=>k.length<4?w.includes(k):n.includes(k));
  const title=h?h[1]:(it.text||'').trim().replace(/\s+/g,'_');
  if(!title)return null;
  const key=norm(title),v=wc[key];
  if(v===0)return null;
  if(v){const im=new Image();im.className='thumb';im.alt=it.text;im.loading='lazy';im.src=v;im.onerror=()=>im.replaceWith(iconEl(it._icon));return im}
  if(!wpend.has(key)){
    wpend.add(key);
    fetch((m=>'https://'+(m?m[1]:'hu')+'.wikipedia.org/api/rest_v1/page/summary/'+encodeURIComponent((m?m[2]:title).replace(/ /g,'_')))(/^([a-z]{2}):(.+)$/.exec(title)))
      .then(r=>r.ok?r.json():{})
      .then(j=>{wc[key]=(j.type!=='disambiguation'&&j.thumbnail&&j.thumbnail.source)||0;try{localStorage.setItem('wikiPic',JSON.stringify(wc))}catch(e){}clearTimeout(wT);wT=setTimeout(render,300)})
      .catch(()=>wpend.delete(key));
  }
  return null;
}
function realPic(it){
  if(localStorage.getItem('realPics')==='0'||it.icon!==guess(it.text||'').icon)return null;
  const n=norm(it.text||''),w=n.split(/[^a-z0-9]+/);
  const hit=EK.find(([k])=>k.length<4?w.includes(k):n.includes(k));
  if(!hit)return wikiPic(it,n,w);
  const im=new Image(),base='https://www.themealdb.com/images/ingredients/'+encodeURIComponent(hit[1]);
  let st=0;im.className='ico';im.alt=it.text;im.loading='lazy';im.src=base+'-Small.png';
  im.onerror=()=>{if(st++===0)im.src=base+'.png';else im.replaceWith(iconEl(it._icon))};
  return im;
}

  document.body.append(c);setTimeout(()=>c.remove(),4800);

  Notification.requestPermission().then(p=>toast(p==='granted'?'🔔 Értesítések bekapcsolva':'Az értesítés le van tiltva'));

const getOrder=()=>{try{return JSON.parse(localStorage.getItem('catOrder')||'[]')}catch(e){return[]}};

function moveCat(i,d){
  const cs=orderedCats().map(c=>c[0]),j=i+d;if(j<0||j>=cs.length)return;
  [cs[i],cs[j]]=[cs[j],cs[i]];localStorage.setItem('catOrder',JSON.stringify(cs));openOrder();render();
}
const getFreq=()=>{try{return JSON.parse(localStorage.getItem('freq')||'{}')}catch(e){return{}}};
function bumpFreq(it){const f=getFreq(),k=norm(it.text),e=f[k]||{n:0};f[k]={n:e.n+1,text:it.text,icon:it.icon,cat:it.cat};localStorage.setItem('freq',JSON.stringify(f))}
function renderQuick(){
  const q=$('quick');q.textContent='';
  const act=new Set(lastItems.filter(i=>i.status==='active').map(i=>norm(i.text||'')));
  Object.entries(getFreq()).filter(([k])=>!act.has(k)).sort((a,b)=>b[1].n-a[1].n).slice(0,8).forEach(([k,e])=>{

}
function quickAdd(e){const it={text:e.text,note:'',icon:e.icon,cat:e.cat,status:'active',order:Date.now(),by:DEV};listRef.push().set(it);bumpFreq(it)}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
init();
