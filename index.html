<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Smart List</title>
    <style>
        :root {
            --bg: #1a1a1d; --card: #2c2c2e; --text: #efeff4;
            --primary: #af52de; --success: #28a745; --danger: #dc3545;
            --grey-btn: #48484a; --modal-bg: rgba(0,0,0,0.95);
        }
        body { background: var(--bg); color: var(--text); font-family: -apple-system, sans-serif; margin: 0; padding: 10px; user-select: none; -webkit-tap-highlight-color: transparent; }
        
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .btn-row { display: flex; gap: 6px; margin-bottom: 10px; }
        .main-btn { flex: 1; padding: 10px; border-radius: 10px; border: none; font-weight: 600; cursor: pointer; font-size: 13px; color: white; }
        
        /* Modal */
        #inputModal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--modal-bg); justify-content: center; padding-top: 50px; z-index: 1000;
        }
        .modal-content { background: var(--card); padding: 15px; border-radius: 15px; width: 85%; max-width: 320px; height: fit-content; text-align: center; }
        .modal-content input {
            width: 90%; padding: 12px; margin: 10px 0; border-radius: 8px; border: 1px solid #444;
            background: #3a3a3c; color: white; font-size: 18px; outline: none;
        }

        /* Kisebb sorok és ikonok */
        .list-container { display: flex; flex-direction: column; gap: 5px; }
        .item { 
            background: var(--card); padding: 8px 10px; border-radius: 8px; 
            display: flex; align-items: center; gap: 8px; touch-action: none;
        }
        .item.checked { background: var(--success); }
        .item.cancelled { background: var(--danger); }
        .item.dragging { opacity: 0.5; transform: scale(1.02); }
        
        .item-text { flex-grow: 1; font-size: 15px; pointer-events: none; }
        
        /* Kisebb gombok */
        .btn-sm { border: none; width: 30px; height: 30px; border-radius: 6px; cursor: pointer; font-size: 15px; display: flex; align-items: center; justify-content: center; color: white; }
        .btn-check { background: #34c759; }
        .btn-x { background: #ff3b30; } 
        .btn-grey { background: var(--grey-btn); }
        
        .summary-title { margin-top: 20px; border-top: 1px solid #333; padding-top: 10px; font-size: 11px; color: #888; text-transform: uppercase; }
        .clear-all { background: none; color: #ff3b30; border: 1px solid #ff3b30; margin-top: 15px; width: 100%; padding: 8px; font-size: 12px; }
    </style>
</head>
<body>

    <div class="header"><h3 style="margin:0">Bevásárlás</h3></div>

    <div class="btn-row">
        <button id="micBtn" class="main-btn" style="background: var(--primary);">🎤 Hang</button>
        <button class="main-btn" style="background: #3a3a3c;" onclick="openModal()">⌨️ Írás</button>
    </div>

    <div id="activeItems" class="list-container"></div>
    <div class="summary-title">Összesítés</div>
    <div id="doneItems" class="list-container"></div>
    <button class="main-btn clear-all" onclick="clearAll()">🗑️ Lista ürítése</button>

    <div id="inputModal">
        <div class="modal-content">
            <input type="text" id="manualInput" placeholder="Írd ide..." autocomplete="off">
            <div class="btn-row">
                <button class="main-btn" style="background:#48484a;" onclick="closeModal()">Mégse</button>
                <button class="main-btn" style="background:var(--primary);" onclick="handleManualAdd()">OK</button>
            </div>
        </div>
    </div>

    <script>
        let shoppingList = JSON.parse(localStorage.getItem('myShoppingList')) || [];
        const micBtn = document.getElementById('micBtn');

        window.onload = renderAll;

        // --- MANUÁLIS BEVITEL ---
        function openModal() {
            document.getElementById('inputModal').style.display = 'flex';
            const input = document.getElementById('manualInput');
            input.focus(); 
        }

        function closeModal() {
            document.getElementById('inputModal').style.display = 'none';
            document.getElementById('manualInput').value = '';
        }

        function handleManualAdd() {
            const val = document.getElementById('manualInput').value.trim();
            if(val) { addItem(val); closeModal(); }
        }

        document.getElementById('manualInput').addEventListener("keypress", (e) => { if (e.key === "Enter") handleManualAdd(); });

        // --- HANGFELISMERÉS (Javított) ---
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (SpeechRecognition) {
            const recognition = new SpeechRecognition();
            recognition.lang = 'hu-HU';
            
            micBtn.onclick = () => {
                recognition.start();
                micBtn.innerText = "🛑 Hallgatom...";
            };

            recognition.onresult = (e) => {
                addItem(e.results[0][0].transcript);
                micBtn.innerText = "🎤 Hang";
            };

            recognition.onerror = () => { micBtn.innerText = "🎤 Hang"; };
            recognition.onend = () => { micBtn.innerText = "🎤 Hang"; };
        }

        function addItem(text) {
            shoppingList.push({ id: Date.now(), text: text, status: 'active' });
            saveAndRender();
        }

        function updateStatus(id, newStatus) {
            const i = shoppingList.findIndex(x => x.id === id);
            if(i !== -1) { shoppingList[i].status = newStatus; saveAndRender(); }
        }

        function deleteItem(id) {
            shoppingList = shoppingList.filter(x => x.id !== id);
            saveAndRender();
        }

        function saveAndRender() {
            localStorage.setItem('myShoppingList', JSON.stringify(shoppingList));
            renderAll();
        }

        // --- MEGJELENÍTÉS ÉS MOZGATÁS ---
        function renderAll() {
            const act = document.getElementById('activeItems');
            const don = document.getElementById('doneItems');
            act.innerHTML = ''; don.innerHTML = '';

            shoppingList.forEach(item => {
                const div = document.createElement('div');
                div.className = `item ${item.status !== 'active' ? item.status === 'done' ? 'checked' : 'cancelled' : ''}`;
                div.dataset.id = item.id;
                
                div.innerHTML = `
                    <span class="item-text">${item.text}</span>
                    <div class="actions">
                        ${item.status === 'active' ? `
                            <button class="btn-sm btn-check" onclick="updateStatus(${item.id}, 'done')">✔</button>
                            <button class="btn-sm btn-x" onclick="updateStatus(${item.id}, 'x')">✖</button>
                        ` : `
                            <button class="btn-sm btn-grey" onclick="updateStatus(${item.id}, 'active')">↩</button>
                        `}
                        <button class="btn-sm btn-grey" onclick="deleteItem(${item.id})">🗑</button>
                    </div>
                `;

                // Mobilbarát mozgatás (Drag)
                div.addEventListener('touchstart', (e) => {
                    if(item.status === 'active' && e.target.className === 'item-text') {
                        div.classList.add('dragging');
                    }
                }, {passive: true});

                div.addEventListener('touchmove', (e) => {
                    if(!div.classList.contains('dragging')) return;
                    const touch = e.touches[0];
                    const afterElement = getDragAfterElement(act, touch.clientY);
                    if (afterElement == null) act.appendChild(div);
                    else act.insertBefore(div, afterElement);
                }, {passive: false});

                div.addEventListener('touchend', () => {
                    if(div.classList.contains('dragging')) {
                        div.classList.remove('dragging');
                        reorderList();
                    }
                });

                (item.status === 'active' ? act : don).appendChild(div);
            });
        }

        function getDragAfterElement(container, y) {
            const draggables = [...container.querySelectorAll('.item:not(.dragging)')];
            return draggables.reduce((closest, child) => {
                const box = child.getBoundingClientRect();
                const offset = y - box.top - box.height / 2;
                if (offset < 0 && offset > closest.offset) return { offset: offset, element: child };
                else return closest;
            }, { offset: Number.NEGATIVE_INFINITY }).element;
        }

        function reorderList() {
            const newOrder = [];
            document.querySelectorAll('#activeItems .item').forEach(el => {
                newOrder.push(shoppingList.find(x => x.id == el.dataset.id));
            });
            shoppingList = [...newOrder, ...shoppingList.filter(x => x.status !== 'active')];
            localStorage.setItem('myShoppingList', JSON.stringify(shoppingList));
        }

        function clearAll() { if(confirm("Üríted a listát?")) { shoppingList = []; saveAndRender(); } }
    </script>
</body>
</html>
