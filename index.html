<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lista Pro v0.5.0</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    
    <style>
        :root { --bg: #0b0b0b; --card-bg: #1a1a1a; --item-bg: #262626; --text: #f0f0f0; --primary: #a87ff3; --success: #32a852; --danger: #eb4034; --grey: #333; --border: #444; }
        .light-mode { --bg: #d1d1d6; --card-bg: #f0f0f7; --item-bg: #ffffff; --text: #1c1c1e; --primary: #5856d6; --success: #34c759; --danger: #d66d6d; --grey: #e5e5ea; --border: #c7c7cc; }
        
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: -apple-system, sans-serif; user-select: none; -webkit-user-select: none; }
        body { background: var(--bg); color: var(--text); margin: 0; padding: 10px; display: flex; justify-content: center; min-height: 100vh; transition: background 0.3s; }
        
        .app-card { background: var(--card-bg); width: 100%; max-width: 400px; border-radius: 20px; padding: 15px; align-self: flex-start; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        .col-label { font-size: 10px; text-align: center; color: #aaa; margin: 10px auto 8px; text-transform: uppercase; letter-spacing: 1px; background: var(--grey); padding: 4px 12px; border-radius: 20px; display: table; }
        
        .list-container { display: flex; flex-direction: column; gap: 8px; min-height: 20px; width: 100%; }
        .item-wrapper { position: relative; border-radius: 10px; overflow: hidden; background: transparent; width: 100%; }
        
        .delete-btn-bg { position: absolute; right: 0; top: 0; bottom: 0; width: 80px; background: var(--danger); color: white; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: bold; border-radius: 0 10px 10px 0; z-index: 1; }

        .item { background: var(--item-bg); padding: 10px 12px; border-radius: 10px; display: flex; align-items: center; gap: 10px; position: relative; z-index: 5; transition: transform 0.2s; border: 1px solid transparent; touch-action: pan-y; width: 100%; }
        .drag-handle { color: #555; font-size: 22px; padding-right: 5px; cursor: grab; flex-shrink: 0; }
        .status-done { background: var(--success) !important; color: white !important; }
        .status-x { background: var(--danger) !important; color: white !important; }
        
        .btn-sm { width: 34px; height: 34px; border-radius: 8px; display: flex; align-items: center; justify-content: center; cursor: pointer; background: rgba(255,255,255,0.1); color: white; border: 1px solid transparent; flex-shrink: 0; }
        .has-data { border-color: var(--danger) !important; background: rgba(255,255,255,0.1) !important; color: white !important; }

        .bottom-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 15px; width: 100%; }
        .sub-col { display: flex; flex-direction: column; align-items: center; width: 100%; }

        .custom-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 2000; justify-content: center; align-items: center; padding: 20px; }
        .modal-content { background: var(--card-bg); width: 100%; max-width: 340px; border-radius: 20px; padding: 25px 20px 20px; position: relative; border: 1px solid var(--border); max-height: 90vh; overflow-y: auto; }
        
        /* Szövegbevitel engedélyezése modalban */
        .modal-content input, .modal-content textarea { user-select: text !important; -webkit-user-select: text !important; }
        
        .close-x { position: absolute; top: 10px; right: 15px; font-size: 24px; color: var(--danger); cursor: pointer; }
        
        input, textarea { width: 100%; padding: 12px; margin-bottom: 10px; border-radius: 10px; border: 1px solid var(--border); background: #000; color: #fff; outline: none; font-size: 16px; }
        .action-btn { width: 100%; padding: 15px; border-radius: 10px; border: none; background: var(--primary); color: white; font-weight: bold; cursor: pointer; }
        
        .img-preview-box { width: 100%; max-height: 150px; object-fit: cover; border-radius: 10px; margin: 10px 0; border: 1px solid var(--border); }
        .mode-toggle { background: var(--grey); border: none; color: var(--text); width: 40px; height: 30px; border-radius: 15px; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; }

        #noteBox { background: rgba(255,255,255,0.05); padding: 15px; border-radius: 10px; margin-bottom: 10px; word-wrap: break-word; }
        #noteDisplay { font-size: 14px; text-align: center; margin-bottom: 15px; line-height: 1.4; }
        #noteActions { display: flex; justify-content: center; gap: 30px; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 10px; }
    </style>
</head>
<body class="dark">

<div class="app-card">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
        <div style="font-size:10px; color:#444;">v0.5.0</div>
        <button class="mode-toggle" onclick="toggleMode()">🌓</button>
        <button onclick="clearAllItems()" style="background:none; border:none; font-size:18px; opacity:0.3;">🗑️</button>
    </div>
    
    <h2 style="text-align:center; font-size:19px; margin-bottom:20px; letter-spacing:1px;">BEVÁSÁRLÓ LISTA</h2>

    <div style="display:flex; gap:10px; margin-bottom:20px;">
        <button id="micBtn" style="flex:1; padding:15px; border-radius:12px; border:none; background:var(--primary); color:white; font-weight:bold;">🎤 HANG</button>
        <button onclick="openModal('inputModal')" style="flex:1; padding:15px; border-radius:12px; border:none; background:var(--grey); color:var(--text); font-weight:bold;">⌨️ ÍRÁS</button>
    </div>

    <div class="col-label">Aktív tételek</div>
    <div id="activeItems" class="list-container"></div>

    <div class="bottom-grid">
        <div class="sub-col">
            <div class="col-label">Megvan</div>
            <div id="doneItems" class="list-container"></div>
        </div>
        <div class="sub-col">
            <div class="col-label">Nincs</div>
            <div id="missingItems" class="list-container"></div>
        </div>
    </div>
</div>

<div id="inputModal" class="custom-modal">
    <div class="modal-content">
        <div class="close-x" onclick="closeModal('inputModal')">×</div>
        <input type="text" id="manualInput" placeholder="Termék neve...">
        <textarea id="manualNote" placeholder="Megjegyzés..." rows="2"></textarea>
        <label style="display:block; text-align:center; padding:12px; background:#333; border-radius:10px; margin-bottom:10px; cursor:pointer; font-size:14px; color: white;">
            📷 Fotó hozzáadása
            <input type="file" id="newPhotoFile" accept="image/*" style="display:none" onchange="previewPhoto(this)">
        </label>
        <img id="newPhotoPreview" class="img-preview-box" style="display:none;">
        <button class="action-btn" onclick="addItem()">HOZZÁADÁS</button>
    </div>
</div>

<div id="infoModal" class="custom-modal">
    <div class="modal-content">
        <div class="close-x" onclick="closeModal('infoModal')">×</div>
        <h3 id="infoTitle" style="text-align:center; margin-top:0; border-bottom: 1px solid var(--border); padding-bottom: 10px;"></h3>
        
        <div id="noteBox">
            <div id="noteDisplay"></div>
            <div id="noteActions">
                <button onclick="showNoteEditor(true)" style="background:none; border:none; font-size:22px;">✏️</button>
                <button onclick="deleteNote()" style="background:none; border:none; font-size:22px;">🗑️</button>
            </div>
            <button id="addNoteBtn" onclick="showNoteEditor(false)" style="display:none; width:100%; background:var(--grey); border:none; color:var(--text); padding:12px; border-radius:10px; font-size:14px; font-weight:bold;">+ Megjegyzés hozzáadása</button>
        </div>

        <div id="noteEditArea" style="display:none;">
            <textarea id="noteTextarea" placeholder="Írd ide a megjegyzést..." rows="4" style="background:#111; color:#fff; border:1px solid var(--primary);"></textarea>
            <button class="action-btn" onclick="saveNote()">MENTÉS</button>
        </div>

        <img id="infoPhotoImg" class="img-preview-box" style="display:none; cursor:pointer; max-height:250px;" onclick="window.open(this.src)">
        <button class="action-btn" style="background:var(--grey); margin-top:15px; color:var(--text);" onclick="closeModal('infoModal')">BEZÁRÁS</button>
    </div>
</div>

<script>
    const firebaseConfig = { 
        apiKey: "AIzaSyC0fhL9VVErpN9LX6eJ8Tv5nuxF5Ea-qjE", 
        databaseURL: "https://kozoslista-e0717-default-rtdb.europe-west1.firebasedatabase.app", 
        projectId: "kozoslista-e0717" 
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const listRef = db.ref('shoppingList');
    let currentItemId = null, tempPhotoData = "";

    function toggleMode() {
        document.body.classList.toggle('light-mode');
        localStorage.setItem('theme', document.body.classList.contains('light-mode') ? 'light' : 'dark');
    }
    if(localStorage.getItem('theme') === 'light') document.body.classList.add('light-mode');

    function openModal(id) { document.getElementById(id).style.display = 'flex'; }
    function closeModal(id) { document.getElementById(id).style.display = 'none'; }

    // Rendező
    new Sortable(document.getElementById('activeItems'), {
        handle: '.drag-handle',
        animation: 150,
        onStart: (evt) => { evt.item.style.background = 'transparent'; },
        onEnd: () => {
            const items = document.querySelectorAll('#activeItems .item-wrapper');
            items.forEach((el, index) => listRef.child(el.getAttribute('data-id')).update({ order: Date.now() + index }));
        }
    });

    // Hangfelismerés
    const micBtn = document.getElementById('micBtn');
    if ('webkitSpeechRecognition' in window) {
        const rec = new webkitSpeechRecognition();
        rec.lang = 'hu-HU';
        rec.onresult = e => {
            const val = e.results[0][0].transcript;
            listRef.push({ text: val, status: 'active', order: Date.now() });
        };
        micBtn.onclick = () => { rec.start(); micBtn.style.opacity = 0.5; };
        rec.onend = () => { micBtn.style.opacity = 1; };
    }

    function previewPhoto(input) {
        if(input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = e => {
                tempPhotoData = e.target.result;
                const p = document.getElementById('newPhotoPreview');
                p.src = tempPhotoData; p.style.display = 'block';
            };
            reader.readAsDataURL(input.files[0]);
        }
    }

    function openInfo(id) {
        currentItemId = id;
        listRef.child(id).once('value', snap => {
            const it = snap.val();
            document.getElementById('infoTitle').innerText = it.text;
            const noteDisp = document.getElementById('noteDisplay'), 
                  noteAct = document.getElementById('noteActions'), 
                  addBtn = document.getElementById('addNoteBtn'),
                  noteBox = document.getElementById('noteBox');
            
            document.getElementById('noteEditArea').style.display = 'none';
            noteBox.style.display = 'block';

            if(it.note && it.note.trim() !== "") {
                noteDisp.innerText = it.note;
                noteDisp.style.display = 'block';
                noteAct.style.display = 'flex';
                addBtn.style.display = 'none';
            } else {
                noteDisp.innerText = "";
                noteDisp.style.display = 'none';
                noteAct.style.display = 'none';
                addBtn.style.display = 'block';
            }
            
            const img = document.getElementById('infoPhotoImg');
            if(it.photo) { img.src = it.photo; img.style.display = 'block'; } else { img.style.display = 'none'; }
            openModal('infoModal');
        });
    }

    function showNoteEditor(isEdit) {
        document.getElementById('noteBox').style.display = 'none';
        document.getElementById('noteEditArea').style.display = 'block';
        const area = document.getElementById('noteTextarea');
        area.value = isEdit ? document.getElementById('noteDisplay').innerText : "";
        setTimeout(() => area.focus(), 100);
    }

    function deleteNote() {
        if(confirm("Törlöd a megjegyzést?")) {
            listRef.child(currentItemId).update({ note: "" }).then(() => openInfo(currentItemId));
        }
    }

    function saveNote() {
        const val = document.getElementById('noteTextarea').value.trim();
        listRef.child(currentItemId).update({ note: val }).then(() => openInfo(currentItemId));
    }

    function render(items) {
        const containers = { active: 'activeItems', done: 'doneItems', x: 'missingItems' };
        Object.values(containers).forEach(id => document.getElementById(id).innerHTML = '');

        items.sort((a,b) => a.order - b.order).forEach(it => {
            const wrap = document.createElement('div');
            wrap.className = 'item-wrapper';
            wrap.setAttribute('data-id', it.id);
            
            const delBtn = document.createElement('div');
            delBtn.className = 'delete-btn-bg';
            delBtn.innerText = 'TÖRLÉS';
            delBtn.onclick = () => { if(confirm("Törlöd a tételt?")) listRef.child(it.id).remove(); };
            wrap.appendChild(delBtn);

            const div = document.createElement('div');
            div.className = `item ${it.status === 'done' ? 'status-done' : (it.status === 'x' ? 'status-x' : '')}`;
            const hasExtra = (it.note && it.note.trim() !== "") || it.photo;

            div.innerHTML = `
                ${it.status === 'active' ? '<div class="drag-handle">≡</div>' : '<div style="width:5px"></div>'}
                <span style="flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${it.text}</span>
                <div style="display:flex; gap:5px;">
                    <button class="btn-sm ${hasExtra?'has-data':''}" onclick="openInfo('${it.id}')">ℹ️</button>
                    ${it.status === 'active' ? 
                        `<button class="btn-sm" style="background:var(--success)" onclick="listRef.child('${it.id}').update({status:'done'})">✔</button>
                         <button class="btn-sm" style="background:var(--danger)" onclick="listRef.child('${it.id}').update({status:'x'})">✖</button>` : 
                        `<button class="btn-sm" onclick="listRef.child('${it.id}').update({status:'active'})">↩</button>`
                    }
                </div>`;

            let startX = 0, currentX = 0;
            div.addEventListener('touchstart', e => { startX = e.touches[0].clientX; div.style.transition = 'none'; }, {passive: true});
            div.addEventListener('touchmove', e => {
                let diff = startX - e.touches[0].clientX;
                if (diff > 0) {
                    currentX = Math.min(diff, 85);
                    div.style.transform = `translateX(-${currentX}px)`;
                } else {
                    currentX = 0;
                    div.style.transform = `translateX(0)`;
                }
            }, {passive: true});

            div.addEventListener('touchend', e => {
                div.style.transition = 'transform 0.3s ease';
                if (currentX > 50) div.style.transform = `translateX(-80px)`;
                else div.style.transform = `translateX(0)`;
            });

            wrap.appendChild(div);
            document.getElementById(containers[it.status] || 'activeItems').appendChild(wrap);
        });
    }

    function addItem() {
        const val = document.getElementById('manualInput').value.trim();
        const note = document.getElementById('manualNote').value.trim();
        if (val) {
            listRef.push({ text: val, note: note, photo: tempPhotoData, status: 'active', order: Date.now() });
            document.getElementById('manualInput').value = '';
            document.getElementById('manualNote').value = '';
            document.getElementById('newPhotoPreview').style.display = 'none';
            tempPhotoData = "";
            closeModal('inputModal');
        }
    }

    listRef.on('value', snap => {
        const d = snap.val();
        render(d ? Object.keys(d).map(k => ({id: k, ...d[k]})) : []);
    });

    function clearAllItems() { if(confirm("Mindent törölsz a listából?")) listRef.remove(); }
</script>
</body>
</html>
