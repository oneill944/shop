<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bevásárló lista v1.7.5</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#a87ff3">
    <link rel="apple-touch-icon" href="IMG_4302.png">
    
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    
    <style>
        :root { 
            --bg: #0f0f12; 
            --card-bg: #1c1c1e; 
            --item-bg: #2c2c2e; 
            --text: #ffffff; 
            --primary: #a87ff3; 
            --success: #32d74b; 
            --danger: #ff453a; 
            --grey: #3a3a3c; 
            --border: #48484a;
        }
        
        .light-mode { 
            --bg: #f2f2f7; 
            --card-bg: #ffffff; 
            --item-bg: #f2f2f7; 
            --text: #1c1c1e; 
            --primary: #5856d6; 
            --success: #34c759; 
            --danger: #ff3b30; 
            --grey: #e5e5ea; 
            --border: #c7c7cc; 
        }
        
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: var(--bg); color: var(--text); margin: 0; padding: 15px; display: flex; justify-content: center; min-height: 100vh; transition: 0.3s; }
        
        .app-card { background: var(--card-bg); width: 100%; max-width: 420px; border-radius: 24px; padding: 20px; align-self: flex-start; box-shadow: 0 20px 40px rgba(0,0,0,0.4); border: 1px solid var(--border); }
        
        .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .version-tag { font-size: 10px; background: var(--grey); padding: 2px 8px; border-radius: 10px; opacity: 0.6; }
        
        .title-section h2 { font-weight: 800; font-size: 22px; margin: 0; text-align: center; letter-spacing: -0.5px; }
        
        .room-badge { background: var(--primary); color: white; padding: 4px 12px; border-radius: 12px; font-size: 12px; font-weight: bold; margin: 10px auto; display: block; border: none; cursor: pointer; }

        .add-trigger { 
            width: 100%; padding: 16px; border-radius: 16px; border: 2px dashed var(--border); 
            background: transparent; color: var(--text); font-weight: 600; cursor: pointer; 
            margin: 20px 0; transition: 0.2s; font-size: 15px;
        }
        .add-trigger:active { transform: scale(0.98); background: rgba(168, 127, 243, 0.1); border-color: var(--primary); }

        .item-wrapper { position: relative; margin-bottom: 10px; border-radius: 16px; }
        .item { 
            background: var(--item-bg); padding: 14px 16px; border-radius: 16px; 
            display: flex; align-items: center; gap: 12px; position: relative; 
            z-index: 2; transition: transform 0.2s; border: 1px solid transparent;
        }
        
        .item-icon { font-size: 20px; width: 30px; text-align: center; }
        .item-text { flex: 1; font-weight: 500; font-size: 16px; }
        
        .status-done { opacity: 0.6; filter: grayscale(1); }
        .status-done .item-text { text-decoration: line-through; }
        
        .empty-state { text-align: center; padding: 40px 20px; color: #888; font-style: italic; font-size: 14px; }
        
        /* Gombok stílusa */
        .btn-circle { 
            width: 34px; height: 34px; border-radius: 50%; border: none; 
            display: flex; align-items: center; justify-content: center; 
            cursor: pointer; font-size: 14px; transition: 0.2s;
        }
        .btn-info { background: var(--grey); color: var(--text); }
        .btn-check { background: var(--success); color: white; }

        /* Modal design */
        .custom-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 1000; align-items: center; justify-content: center; padding: 20px; backdrop-filter: blur(10px); }
        .modal-content { background: var(--card-bg); width: 100%; max-width: 360px; border-radius: 28px; padding: 25px; border: 1px solid var(--border); }
        
        input, textarea { 
            width: 100%; background: var(--item-bg); border: 1px solid var(--border); 
            color: white; padding: 14px; border-radius: 14px; margin-bottom: 12px; font-size: 16px;
        }
    </style>
</head>
<body class="dark">

<div class="app-card">
    <div class="header-top">
        <button onclick="toggleMode()" style="background:none; border:none; font-size:20px; cursor:pointer;">🌓</button>
        <div class="version-tag">v1.7.5</div>
        <button onclick="openModal('bugModal')" style="background:none; border:none; font-size:20px; cursor:pointer;">✉️</button>
    </div>
    
    <div class="title-section">
        <h2>Bevásárló Lista</h2>
        <button id="roomBtn" class="room-badge" onclick="openModal('listModal')">Szoba: ----</button>
        <div id="userCount" style="font-size:10px; text-align:center; color:#888;">Frissítés...</div>
    </div>

    <button class="add-trigger" onclick="openModal('inputModal')">+ Új tétel hozzáadása</button>

    <div id="activeItems"></div>
    
    <div class="col-label" style="margin-top:30px; font-size:12px; color:var(--primary); font-weight:bold; text-transform:uppercase;">Megvettem</div>
    <div id="doneItems"></div>
</div>

<div id="inputModal" class="custom-modal">
    <div class="modal-content">
        <h3 style="margin-top:0">Új tétel</h3>
        <input type="text" id="manualInput" placeholder="Pl. Tej, Kenyér..." autofocus>
        <textarea id="manualNote" placeholder="Megjegyzés (opcionális)" rows="2"></textarea>
        <button class="action-btn" onclick="addItem()" style="width:100%; padding:16px; border-radius:14px; background:var(--primary); border:none; color:white; font-weight:bold; font-size:16px;">Mentés</button>
        <button onclick="closeModal('inputModal')" style="width:100%; background:none; border:none; color:#888; margin-top:15px; cursor:pointer;">Mégse</button>
    </div>
</div>

<script>
    // Konfiguráció és alapfüggvények maradnak a régiek...
    const firebaseConfig = { apiKey: "AIzaSyC0fhL9VVErpN9LX6eJ8Tv5nuxF5Ea-qjE", databaseURL: "https://kozoslista-e0717-default-rtdb.europe-west1.firebasedatabase.app", projectId: "kozoslista-e0717" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    
    let currentListId = localStorage.getItem('currentListId') || "1111";
    let listRef = db.ref('shoppingLists/' + currentListId);

    // Automata ikon választó
    function getEmoji(text) {
        text = text.toLowerCase();
        if (text.includes("tej")) return "🥛";
        if (text.includes("kenyér") || text.includes("kifli")) return "🍞";
        if (text.includes("hús") || text.includes("csirke")) return "🍗";
        if (text.includes("tojás")) return "🥚";
        if (text.includes("sör") || text.includes("bor")) return "🍻";
        if (text.includes("víz") || text.includes("üdítő")) return "🥤";
        if (text.includes("gyümölcs") || text.includes("alma")) return "🍎";
        if (text.includes("zöldség") || text.includes("paprika")) return "🫑";
        if (text.includes("sajt")) return "🧀";
        return "📦"; // Alapértelmezett
    }

    function render(items) {
        const activeCont = document.getElementById('activeItems');
        const doneCont = document.getElementById('doneItems');
        activeCont.innerHTML = '';
        doneCont.innerHTML = '';

        if (items.length === 0) {
            activeCont.innerHTML = '<div class="empty-state">A listád jelenleg üres.</div>';
            return;
        }

        items.forEach(it => {
            const div = document.createElement('div');
            div.className = `item ${it.status === 'done' ? 'status-done' : ''}`;
            div.innerHTML = `
                <div class="item-icon">${getEmoji(it.text)}</div>
                <div class="item-text">${it.text}</div>
                <div style="display:flex; gap:8px;">
                    <button class="btn-circle btn-info" onclick="openInfo('${it.id}')">i</button>
                    ${it.status === 'active' ? 
                        `<button class="btn-circle btn-check" onclick="updateStatus('${it.id}', 'done')">✓</button>` : 
                        `<button class="btn-circle btn-info" onclick="updateStatus('${it.id}', 'active')">↺</button>`
                    }
                </div>
            `;
            
            const wrap = document.createElement('div');
            wrap.className = 'item-wrapper';
            wrap.appendChild(div);

            if (it.status === 'active') activeCont.appendChild(wrap);
            else doneCont.appendChild(wrap);
        });
    }

    // A többi funkció (addItem, updateStatus, Modal kezelés) 
    // marad a v1.6.7-ből, de az új designhoz igazítva.
    // ... (itt folytatódik a korábbi logikád)

    listRef.on('value', snap => {
        const d = snap.val();
        const items = d ? Object.keys(d).map(k => ({id: k, ...d[k]})) : [];
        render(items);
    });

    function addItem() {
        const v = document.getElementById('manualInput').value.trim();
        if(v) {
            listRef.push({ 
                text: v, 
                note: document.getElementById('manualNote').value, 
                status: 'active', 
                order: Date.now() 
            });
            closeModal('inputModal');
            document.getElementById('manualInput').value = '';
        }
    }

    function updateStatus(id, status) {
        listRef.child(id).update({status: status});
    }

    function openModal(id) { document.getElementById(id).style.display = 'flex'; }
    function closeModal(id) { document.getElementById(id).style.display = 'none'; }
    function toggleMode() { document.body.classList.toggle('light-mode'); }
</script>
</body>
</html>
