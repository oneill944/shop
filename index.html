<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bevásárló lista</title>
    
    <link rel="apple-touch-icon" href="IMG_4302.png">
    <link rel="icon" type="image/png" href="IMG_4302.png">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    
    <style>
        :root { --bg: #0b0b0b; --card-bg: #1a1a1a; --item-bg: #262626; --text: #f0f0f0; --primary: #a87ff3; --success: #32a852; --danger: #eb4034; --grey: #333; --border: #444; }
        .light-mode { --bg: #d1d1d6; --card-bg: #f0f0f7; --item-bg: #ffffff; --text: #1c1c1e; --primary: #5856d6; --success: #34c759; --danger: #d66d6d; --grey: #e5e5ea; --border: #c7c7cc; }
        
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: -apple-system, sans-serif; user-select: none; -webkit-user-select: none; }
        body { background: var(--bg); color: var(--text); margin: 0; padding: 10px; display: flex; justify-content: center; min-height: 100vh; transition: background 0.3s; }
        
        .app-card { background: var(--card-bg); width: 100%; max-width: 400px; border-radius: 20px; padding: 15px; align-self: flex-start; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        
        .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; position: relative; }
        .mode-toggle { background: none; border: none; color: var(--text); font-size: 20px; cursor: pointer; padding: 5px; }
        .version-label { font-size: 10px; color: #444; position: absolute; left: 50%; transform: translateX(-50%); }
        
        .notif-status-bar { text-align: center; margin-bottom: 15px; }
        .notif-btn-text { background: none; border: none; color: var(--primary); font-size: 11px; font-weight: bold; cursor: pointer; text-decoration: underline; opacity: 0.6; }

        .col-label { font-size: 10px; text-align: center; color: #aaa; margin: 10px auto 8px; text-transform: uppercase; letter-spacing: 1px; background: var(--grey); padding: 4px 12px; border-radius: 20px; display: table; }
        
        .list-container { display: flex; flex-direction: column; gap: 8px; min-height: 20px; width: 100%; }
        .item-wrapper { position: relative; border-radius: 10px; overflow: hidden; background: transparent; width: 100%; }
        
        .delete-btn-bg { position: absolute; right: 0; top: 0; bottom: 0; width: 80px; background: var(--danger); color: white; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: bold; border-radius: 10px; z-index: 1; }

        .item { background: var(--item-bg); padding: 8px 12px; border-radius: 10px; display: flex; align-items: center; gap: 8px; position: relative; z-index: 5; transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1); border: 1.5px solid transparent; touch-action: pan-y; width: 100%; }
        .drag-handle { color: #555; font-size: 18px; padding-right: 2px; cursor: grab; flex-shrink: 0; }
        
        .item-text { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; min-width: 0; }
        
        .status-done { background: linear-gradient(rgba(50, 168, 82, 0.1), rgba(50, 168, 82, 0.1)), var(--card-bg) !important; border-color: var(--success) !important; }
        .status-x { background: linear-gradient(rgba(235, 64, 52, 0.1), rgba(235, 64, 52, 0.1)), var(--card-bg) !important; border-color: var(--danger) !important; }
        
        .btn-sm { width: 28px; height: 28px; border-radius: 7px; display: flex; align-items: center; justify-content: center; cursor: pointer; background: rgba(255,255,255,0.08); color: white; border: 1px solid transparent; flex-shrink: 0; font-size: 12px; }
        .has-data { border-color: var(--danger) !important; background: rgba(235, 64, 52, 0.1); }

        .bottom-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; width: 100%; }
        .sub-col { display: flex; flex-direction: column; width: 100%; overflow: hidden; }

        .custom-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 2000; justify-content: center; align-items: center; padding: 20px; backdrop-filter: blur(5px); }
        .modal-content { background: var(--card-bg); width: 100%; max-width: 350px; border-radius: 24px; padding: 30px 20px 20px; position: relative; border: 1px solid var(--border); max-height: 85vh; overflow-y: auto; }
        
        .close-x { position: absolute; top: 6px; right: 15px; font-size: 26px; color: var(--danger); cursor: pointer; z-index: 2001; }
        
        #manualInput { width: 100%; padding: 18px; margin-bottom: 10px; border-radius: 10px; border: 1px solid var(--border); background: #000; color: #fff; outline: none; font-size: 18px; }
        
        textarea { width: 100%; padding: 12px; margin-bottom: 10px; border-radius: 10px; border: 1px solid var(--border); background: #000; color: #fff; outline: none; font-size: 16px; }
        .action-btn { width: 100%; padding: 14px; border-radius: 12px; border: none; background: var(--primary); color: white; font-weight: bold; cursor: pointer; font-size: 15px; }
        .img-preview-box { width: 100%; max-height: 200px; object-fit: cover; border-radius: 12px; margin: 10px 0; border: 1px solid var(--border); }
        .info-box { background: rgba(255,255,255,0.03); padding: 12px; border-radius: 12px; margin-bottom: 10px; border: 1px solid rgba(255,255,255,0.05); }
        
        #infoTitle { 
            text-align: center; margin: 0 0 15px; padding-bottom: 10px; border-bottom: 1px solid var(--border);
            font-size: 18px; line-height: 1.3; font-weight: bold;
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; text-overflow: ellipsis;
            white-space: normal; word-break: break-word;
        }
    </style>
</head>
<body class="dark">

<div class="app-card">
    <div class="header-top">
        <button class="mode-toggle" onclick="toggleMode()">🌓</button>
        <div class="version-label">v1.2.6</div>
        <button onclick="clearAllItems()" style="background:none; border:none; font-size:18px; opacity:0.3; cursor:pointer;">🗑️</button>
    </div>
    
    <h2 style="text-align:center; font-size:18px; margin:0; letter-spacing:1px; font-weight:900;">BEVÁSÁRLÓ LISTA</h2>
    <div class="notif-status-bar">
        <button id="notifBtn" class="notif-btn-text" onclick="toggleNotifications()">Értesítések bekapcsolása</button>
    </div>

    <button onclick="openModal('inputModal')" style="width:100%; padding:14px; border-radius:12px; border:none; background:var(--grey); color:var(--text); font-weight:bold; cursor:pointer; margin-bottom:20px; font-size:14px;">HOZZÁADÁS</button>

    <div class="col-label">Aktív tételek</div>
    <div id="activeItems" class="list-container"></div>

    <div class="bottom-grid">
        <div class="sub-col"><div class="col-label">Megvan</div><div id="doneItems" class="list-container"></div></div>
        <div class="sub-col"><div class="col-label">Nincs</div><div id="missingItems" class="list-container"></div></div>
    </div>
</div>

<div id="inputModal" class="custom-modal">
    <div class="modal-content">
        <div class="close-x" onclick="closeModal('inputModal')">×</div>
        <input type="text" id="manualInput" placeholder="Termék neve...">
        <textarea id="manualNote" placeholder="Megjegyzés hozzáadása..." rows="2"></textarea>
        <label style="display:block; text-align:center; padding:12px; background:#333; border-radius:10px; margin-bottom:10px; cursor:pointer; color: white; font-size: 14px;">📷 Fotó hozzáadása<input type="file" id="newPhotoFile" accept="image/*" style="display:none" onchange="previewPhoto(this, 'newPhotoPreview')"></label>
        <img id="newPhotoPreview" class="img-preview-box" style="display:none;">
        <button class="action-btn" onclick="addItem()">HOZZÁADÁS</button>
    </div>
</div>

<div id="infoModal" class="custom-modal">
    <div class="modal-content">
        <div class="close-x" onclick="closeModal('infoModal')">×</div>
        <h3 id="infoTitle"></h3>
        <div id="viewArea">
            <div id="noteBox" class="info-box">
                <div id="noteDisplay" style="font-size:14px; text-align:center; margin-bottom:10px; word-wrap: break-word; color: #ccc;"></div>
                <div class="info-actions" id="noteActions" style="display:flex; justify-content:center; gap:20px;">
                    <button onclick="showEdit('note')" style="background:none; border:none; font-size:18px;">✏️</button>
                    <button onclick="deleteField('note')" style="background:none; border:none; font-size:18px;">🗑️</button>
                </div>
                <button id="addNoteBtn" onclick="showEdit('note')" style="width:100%; background:var(--grey); border:none; color:var(--text); padding:10px; border-radius:8px; font-weight:bold; font-size:13px;">+ Megjegyzés hozzáadása</button>
            </div>
            <div id="photoBox" class="info-box" style="text-align:center;">
                <img id="infoPhotoImg" class="img-preview-box" style="cursor:pointer;" onclick="window.open(this.src)">
                <div class="info-actions" id="photoActions" style="display:flex; justify-content:center; gap:20px;">
                    <button onclick="showEdit('photo')" style="background:none; border:none; font-size:18px;">✏️</button>
                    <button onclick="deleteField('photo')" style="background:none; border:none; font-size:18px;">🗑️</button>
                </div>
                <button id="addPhotoBtn" onclick="showEdit('photo')" style="width:100%; background:var(--grey); border:none; color:var(--text); padding:10px; border-radius:8px; font-weight:bold; font-size:13px;">+ Fotó hozzáadása</button>
            </div>
        </div>
        <div id="editArea" style="display:none;">
            <div id="noteEditSection" style="display:none;"><textarea id="editNoteInput" rows="4" placeholder="Írj egy megjegyzést..."></textarea></div>
            <div id="photoEditSection" style="display:none;"><input type="file" id="editPhotoInput" accept="image/*" style="display:none" onchange="previewPhoto(this, 'editPhotoPreview')"><img id="editPhotoPreview" class="img-preview-box" style="display:none;"></div>
            <button class="action-btn" onclick="saveInfo()">MENTÉS</button>
        </div>
    </div>
</div>

<script>
    const firebaseConfig = { apiKey: "AIzaSyC0fhL9VVErpN9LX6eJ8Tv5nuxF5Ea-qjE", databaseURL: "https://kozoslista-e0717-default-rtdb.europe-west1.firebasedatabase.app", projectId: "kozoslista-e0717" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database(), listRef = db.ref('shoppingList');
    let currentItemId = null, tempPhotoData = "";

    listRef.on('value', snap => {
        const d = snap.val(); render(d ? Object.keys(d).map(k => ({id: k, ...d[k]})) : []);
    });

    function render(items) {
        const containers = { active: 'activeItems', done: 'doneItems', x: 'missingItems' };
        Object.values(containers).forEach(id => document.getElementById(id).innerHTML = '');
        items.sort((a,b) => a.order - b.order).forEach(it => {
            const wrap = document.createElement('div'); wrap.className = 'item-wrapper'; wrap.setAttribute('data-id', it.id);
            const del = document.createElement('div'); del.className = 'delete-btn-bg'; del.innerText = 'TÖRLÉS'; del.onclick = () => { if(confirm("Törlöd?")) listRef.child(it.id).remove(); };
            const div = document.createElement('div'); div.className = `item ${it.status==='done'?'status-done':(it.status==='x'?'status-x':'')}`;
            const hasExtra = (it.note && it.note.trim()) || it.photo;
            
            div.innerHTML = `${it.status==='active'?'<div class="drag-handle">≡</div>':'<div style="width:2px"></div>'}<span class="item-text">${it.text}</span><div style="display:flex; gap:4px; margin-left:auto;"><button class="btn-sm ${hasExtra?'has-data':''}" onclick="openInfo('${it.id}')">ℹ️</button>${it.status==='active'?`<button class="btn-sm" style="background:var(--success)" onclick="listRef.child('${it.id}').update({status:'done'})">✔</button><button class="btn-sm" style="background:var(--danger)" onclick="listRef.child('${it.id}').update({status:'x'})">✖</button>`:`<button class="btn-sm" onclick="listRef.child('${it.id}').update({status:'active'})">↩</button>`}</div>`;
            
            let sX = 0, cX = 0;
            div.addEventListener('touchstart', e => { sX = e.touches[0].clientX; div.style.transition = 'none'; }, {passive:true});
            div.addEventListener('touchmove', e => { 
                let diff = sX - e.touches[0].clientX; 
                cX = Math.max(-10, Math.min(diff, 85));
                div.style.transform = `translateX(-${cX}px)`; 
            }, {passive:true});
            div.addEventListener('touchend', () => { 
                div.style.transition = 'transform 0.3s cubic-bezier(0.18, 0.89, 0.32, 1.28)'; 
                div.style.transform = (cX > 50) ? 'translateX(-80px)' : 'translateX(0)'; 
            });
            
            wrap.appendChild(del); wrap.appendChild(div);
            document.getElementById(containers[it.status] || 'activeItems').appendChild(wrap);
        });
    }

    function openInfo(id) {
        currentItemId = id;
        document.getElementById('viewArea').style.display = 'block';
        document.getElementById('editArea').style.display = 'none';
        document.getElementById('editNoteInput').value = '';
        listRef.child(id).once('value', snap => {
            const it = snap.val(); document.getElementById('infoTitle').innerText = it.text;
            const nD = document.getElementById('noteDisplay'), nA = document.getElementById('noteActions'), nB = document.getElementById('addNoteBtn');
            if(it.note){ nD.innerText = it.note; nD.style.display='block'; nA.style.display='flex'; nB.style.display='none'; document.getElementById('editNoteInput').value = it.note; } 
            else { nD.style.display='none'; nA.style.display='none'; nB.style.display='block'; }
            const pI = document.getElementById('infoPhotoImg'), pA = document.getElementById('photoActions'), pB = document.getElementById('addPhotoBtn');
            if(it.photo){ pI.src = it.photo; pI.style.display='block'; pA.style.display='flex'; pB.style.display='none'; } 
            else { pI.style.display='none'; pA.style.display='none'; pB.style.display='block'; }
            openModal('infoModal');
        });
    }

    function showEdit(type) {
        document.getElementById('viewArea').style.display = 'none'; document.getElementById('editArea').style.display = 'block';
        document.getElementById('noteEditSection').style.display = type === 'note' ? 'block' : 'none';
        document.getElementById('photoEditSection').style.display = type === 'photo' ? 'block' : 'none';
        if(type==='photo') document.getElementById('editPhotoInput').click();
    }

    function saveInfo() {
        const noteValue = document.getElementById('editNoteInput').value;
        listRef.child(currentItemId).once('value', snap => {
            const it = snap.val();
            const fNote = document.getElementById('noteEditSection').style.display === 'block' ? noteValue : (it.note || "");
            const fPhoto = document.getElementById('photoEditSection').style.display === 'block' ? tempPhotoData : (it.photo || "");
            listRef.child(currentItemId).update({ note: fNote, photo: fPhoto }).then(() => { tempPhotoData = ""; openInfo(currentItemId); });
        });
    }

    function deleteField(f) { if(confirm("Törlöd?")) { let u = {}; u[f] = ""; listRef.child(currentItemId).update(u).then(() => openInfo(currentItemId)); } }
    function previewPhoto(i, pId) { if(i.files && i.files[0]) { const r = new FileReader(); r.onload = e => { tempPhotoData = e.target.result; const p = document.getElementById(pId); p.src = tempPhotoData; p.style.display='block'; }; r.readAsDataURL(i.files[0]); } }
    function addItem() { const v = document.getElementById('manualInput').value.trim(); if(v) { listRef.push({ text: v, note: document.getElementById('manualNote').value, photo: tempPhotoData, status: 'active', order: Date.now() }); closeModal('inputModal'); } }
    function openModal(id) { document.getElementById(id).style.display = 'flex'; }
    function closeModal(id) { document.getElementById(id).style.display = 'none'; tempPhotoData = ""; document.getElementById('newPhotoPreview').style.display='none'; document.getElementById('manualInput').value=''; document.getElementById('manualNote').value=''; }
    function toggleMode() { document.body.classList.toggle('light-mode'); }
    function clearAllItems() { if(confirm("Mindent törölsz?")) listRef.remove(); }
    function toggleNotifications() { Notification.requestPermission(); }

    new Sortable(document.getElementById('activeItems'), { 
        handle: '.drag-handle', 
        animation: 200, 
        onEnd: () => {
            // FIX: Minden sor visszaugrik a helyére, hogy ne maradjon kint a piros törlés gomb
            document.querySelectorAll('.item').forEach(el => el.style.transform = 'translateX(0)');
            document.querySelectorAll('#activeItems .item-wrapper').forEach((el, index) => listRef.child(el.getAttribute('data-id')).update({ order: Date.now() + index }));
        }
    });
</script>
</body>
</html>
