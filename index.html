<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mini Shop List</title>
    <style>
        :root {
            --bg: #121212; --card: #1e1e1e; --text: #e0e0e0;
            --primary: #bb86fc; --success: #2e7d32; --danger: #c62828; --grey: #3a3a3c;
        }
        body { background: var(--bg); color: var(--text); font-family: sans-serif; margin: 0; padding: 8px; user-select: none; -webkit-tap-highlight-color: transparent; }
        
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .btn-row { display: flex; gap: 4px; margin-bottom: 8px; }
        .main-btn { flex: 1; padding: 8px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; font-size: 12px; color: white; text-transform: uppercase; }
        
        #inputModal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); justify-content: center; padding-top: 20px; z-index: 1000;
        }
        .modal-content { background: var(--card); padding: 12px; border-radius: 12px; width: 80%; max-width: 300px; text-align: center; }
        .modal-content input {
            width: 90%; padding: 10px; margin: 10px 0; border-radius: 6px; border: 1px solid #444;
            background: #2a2a2a; color: white; font-size: 16px; outline: none;
        }

        .list-container { display: flex; flex-direction: column; gap: 4px; }
        .item { 
            background: var(--card); padding: 6px 10px; border-radius: 6px; 
            display: flex; align-items: center; gap: 6px; touch-action: none;
        }
        .item.checked { background: var(--success) !important; }
        .item.cancelled { background: var(--danger) !important; }
        .item.dragging { opacity: 0.4; transform: scale(0.98); border: 1px dashed #fff; }
        
        .item-text { flex-grow: 1; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        .actions { display: flex; gap: 3px; }
        .btn-sm { border: none; width: 28px; height: 28px; border-radius: 4px; cursor: pointer; font-size: 14px; display: flex; align-items: center; justify-content: center; color: white; }
        .btn-check { background: #4caf50; }
        .btn-x { background: #f44336; } 
        .btn-grey { background: var(--grey); }
        
        .summary-title { margin-top: 15px; border-top: 1px solid #333; padding-top: 8px; font-size: 10px; color: #777; letter-spacing: 1px; }
        .clear-all { background: none; color: #ff5252; border: 1px solid #ff5252; margin-top: 10px; width: 100%; padding: 6px; font-size: 11px; }
    </style>
</head>
<body>

    <div class="header"><h4 style="margin:0">LISTA</h4></div>

    <div class="btn-row">
        <button id="micBtn" class="main-btn" style="background: var(--primary);">🎤 HANG</button>
        <button class="main-btn" style="background: var(--grey);" onclick="openModal()">⌨️ ÍRÁS</button>
    </div>

    <div id="activeItems" class="list-container"></div>
    <div class="summary-title">ÖSSZESÍTÉS</div>
    <div id="doneItems" class="list-container"></div>
    <button class="main-btn clear-all" onclick="clearAll()">🗑️ TÖRLÉS</button>

    <div id="inputModal">
        <div class="modal-content">
            <input type="text" id="manualInput" placeholder="..." autocomplete="off">
            <div class="btn-row">
                <button class="main-btn" style="background:#444;" onclick="closeModal()">MÉGSE</button>
                <button class="main-btn" style="background:var(--primary);" onclick="handleManualAdd()">OK</button>
            </div>
        </div>
    </div>

    <script>
        let shoppingList = JSON.parse(localStorage.getItem('myShoppingList')) || [];
        let isRecording = false;
        let recognition;

        window.onload = renderAll;

        function openModal() {
            document.getElementById('inputModal').style.display = 'flex';
            setTimeout(() => document.getElementById('manualInput').focus(), 150);
        }

        function closeModal() {
            document.getElementById('inputModal').style.display = 'none';
            document.getElementById('manualInput').value = '';
        }

        function handleManualAdd() {
            const val = document.getElementById('manualInput').value.trim();
            if(val) { addItem(val); closeModal(); }
        }

        document.getElementById('manualInput').addEventListener("keypress", (e) => { if (e.key === "Enter") handleManualAdd(); });

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.lang = 'hu-HU';
            recognition.onresult = (e) => { addItem(e.results[0][0].transcript); stopRecording(); };
            recognition.onend = () => { if(isRecording) stopRecording(); };
        }

        document.getElementById('micBtn').onclick = () => {
            if (!isRecording) {
                isRecording = true;
                recognition.start();
                document.getElementById('micBtn').innerText = "🛑 STOP";
                document.getElementById('micBtn').style.background = "#ff5252";
            } else {
                stopRecording();
            }
        };

        function stopRecording() {
            isRecording = false;
            recognition.stop();
            document.getElementById('micBtn').innerText = "🎤 HANG";
            document.getElementById('micBtn').style.background = "var(--primary)";
        }

        function addItem(text) {
            shoppingList.push({ id: Date.now(), text: text, status: 'active' });
            saveAndRender();
        }

        function updateStatus(id, newStatus) {
            const i = shoppingList.findIndex(x => x.id === id);
            if(i !== -1) { shoppingList[i].status = newStatus; saveAndRender(); }
        }

        function deleteItem(id) {
            shoppingList = shoppingList.filter(x => x.id !== id);
            saveAndRender();
        }

        function saveAndRender() {
            localStorage.setItem('myShoppingList', JSON.stringify(shoppingList));
            renderAll();
        }

        function renderAll() {
            const act = document.getElementById('activeItems');
            const don = document.getElementById('doneItems');
            act.innerHTML = ''; don.innerHTML = '';

            shoppingList.forEach(item => {
                const div = document.createElement('div');
                div.className = `item ${item.status !== 'active' ? item.status === 'done' ? 'checked' : 'cancelled' : ''}`;
                div.dataset.id = item.id;
                
                div.innerHTML = `
                    <span class="item-text">${item.text}</span>
                    <div class="actions">
                        ${item.status === 'active' ? `
                            <button class="btn-sm btn-check" onclick="updateStatus(${item.id}, 'done')">✔</button>
                            <button class="btn-sm btn-x" onclick="updateStatus(${item.id}, 'x')">✖</button>
                        ` : `
                            <button class="btn-sm btn-grey" onclick="updateStatus(${item.id}, 'active')">↩</button>
                        `}
                        <button class="btn-sm btn-grey" onclick="deleteItem(${item.id})">🗑</button>
                    </div>
                `;

                // Drag and drop érintésre
                div.addEventListener('touchstart', (e) => {
                    if(item.status === 'active') div.classList.add('dragging');
                }, {passive: true});

                div.addEventListener('touchmove', (e) => {
                    if(!div.classList.contains('dragging')) return;
                    const touch = e.touches[0];
                    const target = getDragAfterElement(act, touch.clientY);
                    if (!target) act.appendChild(div);
                    else act.insertBefore(div, target);
                }, {passive: false});

                div.addEventListener('touchend', () => {
                    if(div.classList.contains('dragging')) {
                        div.classList.remove('dragging');
                        reorderList();
                    }
                });

                (item.status === 'active' ? act : don).appendChild(div);
            });
        }

        function getDragAfterElement(container, y) {
            const draggables = [...container.querySelectorAll('.item:not(.dragging)')];
            return draggables.reduce((closest, child) => {
                const box = child.getBoundingClientRect();
                const offset = y - box.top - box.height / 2;
                if (offset < 0 && offset > closest.offset) return { offset: offset, element: child };
                else return closest;
            }, { offset: Number.NEGATIVE_INFINITY }).element;
        }

        function reorderList() {
            const newOrder = [];
            document.querySelectorAll('#activeItems .item').forEach(el => {
                newOrder.push(shoppingList.find(x => x.id == el.dataset.id));
            });
            shoppingList = [...newOrder, ...shoppingList.filter(x => x.status !== 'active')];
            localStorage.setItem('myShoppingList', JSON.stringify(shoppingList));
        }

        function clearAll() { if(confirm("Üríted a listát?")) { shoppingList = []; saveAndRender(); } }
    </script>
</body>
</html>
