<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lista Pro v0.3.9</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-storage-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    
    <style>
        :root { --bg: #0b0b0b; --card-bg: #1a1a1a; --item-bg: #262626; --text: #f0f0f0; --primary: #a87ff3; --success: #32a852; --danger: #eb4034; --grey: #333; --border: #444; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: -apple-system, sans-serif; user-select: none; }
        body { background: var(--bg); color: var(--text); margin: 0; padding: 20px 10px; display: flex; justify-content: center; min-height: 100vh; }
        .app-card { background: var(--card-bg); width: 100%; max-width: 400px; border-radius: 20px; padding: 15px; align-self: flex-start; }
        
        .col-label { font-size: 10px; text-align: center; color: #aaa; margin: 15px auto 8px; text-transform: uppercase; letter-spacing: 1px; background: var(--grey); padding: 4px 12px; border-radius: 20px; display: table; }
        
        .list-container { display: flex; flex-direction: column; gap: 8px; min-height: 20px; }
        
        .item-wrapper { position: relative; border-radius: 10px; overflow: hidden; background: var(--danger); }
        
        .item { 
            background: var(--item-bg); 
            padding: 10px 12px; 
            display: flex; 
            align-items: center; 
            gap: 10px; 
            position: relative; 
            z-index: 5; 
            transition: transform 0.2s ease-out; 
            border: 1px solid transparent; 
            touch-action: pan-y;
        }
        
        .drag-handle { cursor: grab; color: #555; font-size: 18px; padding-right: 5px; }
        .drag-handle:active { cursor: grabbing; }

        .status-done { background: #1b3d26 !important; border-color: var(--success) !important; }
        .status-x { background: #421a18 !important; border-color: var(--danger) !important; }
        
        .delete-label { 
            position: absolute; right: 0; top: 0; bottom: 0; width: 75px; 
            display: flex; align-items: center; justify-content: center; 
            color: white; font-size: 10px; font-weight: bold; z-index: 1;
        }

        .btn-sm { width: 34px; height: 34px; border-radius: 8px; display: flex; align-items: center; justify-content: center; cursor: pointer; background: rgba(255,255,255,0.1); color: white; border: none; }
        .info-has-content { border: 1px solid var(--danger) !important; background: #555 !important; }

        /* Modal stílusok */
        .custom-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 2000; justify-content: center; align-items: center; padding: 20px; }
        .modal-content { background: var(--card-bg); width: 100%; max-width: 340px; border-radius: 20px; padding: 30px 20px 20px; position: relative; border: 1px solid var(--border); user-select: auto; }
        .close-x { position: absolute; top: 5px; right: 10px; background: none; color: var(--text); font-size: 22px; border: none; padding: 8px; }
        
        input, textarea { width: 100%; padding: 12px; margin-bottom: 10px; border-radius: 10px; border: 1px solid var(--border); background: #000; color: #fff; outline: none; user-select: auto; }
        .action-btn { width: 100%; padding: 15px; border-radius: 10px; border: none; background: var(--primary); color: white; font-weight: bold; }
        
        .full-screen-img { display: none; position: fixed; inset: 0; background: #000; z-index: 3000; justify-content: center; align-items: center; }
        .full-screen-img img { max-width: 100%; max-height: 100%; }
    </style>
</head>
<body class="dark">

<div class="app-card">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
        <div style="font-size:10px; color:#444;">v0.3.9</div>
        <button onclick="clearAllItems()" style="background:none; border:none; font-size:18px; opacity:0.3;">🗑️</button>
    </div>
    
    <div style="display:flex; gap:10px; margin-bottom:20px;">
        <button id="micBtn" style="flex:1; padding:15px; border-radius:12px; border:none; background:var(--primary); color:white; font-weight:bold;">🎤 HANG</button>
        <button onclick="openModal('inputModal')" style="flex:1; padding:15px; border-radius:12px; border:none; background:var(--grey); color:white; font-weight:bold;">⌨️ ÍRÁS</button>
    </div>

    <div class="col-label">Lista</div>
    <div id="activeItems" class="list-container"></div>

    <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
        <div><div class="col-label">Kész</div><div id="doneItems" class="list-container"></div></div>
        <div><div class="col-label">Nincs</div><div id="missingItems" class="list-container"></div></div>
    </div>
</div>

<div id="inputModal" class="custom-modal">
    <div class="modal-content">
        <button class="close-x" onclick="closeModal('inputModal')">✕</button>
        <input type="text" id="manualInput" placeholder="Termék..." autofocus>
        <textarea id="manualNote" placeholder="Jegyzet..." rows="2"></textarea>
        <button class="action-btn" id="addBtn" onclick="addItem()">HOZZÁADÁS</button>
    </div>
</div>

<script>
    const firebaseConfig = { 
        apiKey: "AIzaSyC0fhL9VVErpN9LX6eJ8Tv5nuxF5Ea-qjE", 
        databaseURL: "https://kozoslista-e0717-default-rtdb.europe-west1.firebasedatabase.app", 
        projectId: "kozoslista-e0717",
        storageBucket: "kozoslista-e0717.firebasestorage.app"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const listRef = db.ref('shoppingList');

    function openModal(id) { document.getElementById(id).style.display = 'flex'; }
    function closeModal(id) { document.getElementById(id).style.display = 'none'; }

    // Sorrendezés beállítása
    const sortable = new Sortable(document.getElementById('activeItems'), {
        handle: '.drag-handle',
        animation: 150,
        onEnd: function() {
            const items = document.querySelectorAll('#activeItems .item-wrapper');
            items.forEach((el, index) => {
                const id = el.getAttribute('data-id');
                listRef.child(id).update({ order: index });
            });
        }
    });

    function render(items) {
        const containers = { active: 'activeItems', done: 'doneItems', x: 'missingItems' };
        Object.values(containers).forEach(id => document.getElementById(id).innerHTML = '');

        items.sort((a,b) => a.order - b.order).forEach(it => {
            const wrap = document.createElement('div');
            wrap.className = 'item-wrapper';
            wrap.setAttribute('data-id', it.id);
            wrap.innerHTML = `<div class="delete-label">TÖRLÉS</div>`;

            const div = document.createElement('div');
            div.className = `item ${it.status === 'done' ? 'status-done' : (it.status === 'x' ? 'status-x' : '')}`;
            
            const hasExtra = it.note || it.img;
            
            div.innerHTML = `
                <div class="drag-handle">≡</div>
                <span style="flex:1;">${it.text}</span>
                <div style="display:flex; gap:5px;">
                    <button class="btn-sm ${hasExtra ? 'info-has-content' : ''}" onclick="alert('Részletek hamarosan...')">ℹ️</button>
                    ${it.status === 'active' ? 
                        `<button class="btn-sm" style="background:var(--success)" onclick="updateStatus('${it.id}','done')">✔</button>
                         <button class="btn-sm" style="background:var(--danger)" onclick="updateStatus('${it.id}','x')">✖</button>` : 
                        `<button class="btn-sm" onclick="updateStatus('${it.id}','active')">↩</button>`
                    }
                </div>
            `;

            // Húzásra törlés logika
            let startX = 0;
            div.addEventListener('touchstart', e => startX = e.touches[0].clientX, {passive: true});
            div.addEventListener('touchmove', e => {
                let diff = startX - e.touches[0].clientX;
                if (diff > 10 && diff < 100) div.style.transform = `translateX(-${diff}px)`;
            }, {passive: true});
            div.addEventListener('touchend', e => {
                let diff = startX - e.changedTouches[0].clientX;
                if (diff > 60) {
                    listRef.child(it.id).remove();
                } else {
                    div.style.transform = `translateX(0)`;
                }
            });

            wrap.appendChild(div);
            document.getElementById(containers[it.status] || 'activeItems').appendChild(wrap);
        });
    }

    function updateStatus(id, status) { listRef.child(id).update({ status: status }); }

    function addItem() {
        const val = document.getElementById('manualInput').value.trim();
        if (val) {
            listRef.push({ text: val, note: document.getElementById('manualNote').value, status: 'active', order: Date.now() });
            document.getElementById('manualInput').value = '';
            closeModal('inputModal');
        }
    }

    listRef.on('value', snap => {
        const data = snap.val();
        render(data ? Object.keys(data).map(k => ({id: k, ...data[k]})) : []);
    });

    function clearAllItems() { if(confirm("Mindent törölsz?")) listRef.remove(); }
</script>
</body>
</html>
