<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bevásárló lista Pro v3.3</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        :root { --bg: #0b0b0b; --card-bg: #1a1a1a; --item-bg: #262626; --text: #f0f0f0; --primary: #a87ff3; --success: #32a852; --danger: #eb4034; --grey: #333; --yellow: #ffff00; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: -apple-system, sans-serif; }
        body { background: var(--bg); color: var(--text); margin: 0; padding: 10px; display: flex; justify-content: center; min-height: 100vh; }
        
        .app-card { background: var(--card-bg); width: 100%; max-width: 400px; border-radius: 20px; padding: 15px; position: relative; align-self: flex-start; }
        .version { position: absolute; top: 8px; left: 15px; font-size: 10px; color: #555; }
        
        .header { text-align: center; padding-bottom: 15px; border-bottom: 1px solid #333; margin-bottom: 15px; }
        #notifBtn { font-size: 11px; padding: 6px 15px; border-radius: 20px; border: 1px solid #444; background: #222; color: #888; cursor: pointer; }
        #notifBtn.active { background: var(--success); color: white; border: none; }

        /* MODAL ÉS AZ X GOMB JAVÍTÁSA */
        .custom-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 2000; justify-content: center; align-items: center; padding: 20px; }
        .modal-content { background: var(--card-bg); width: 100%; max-width: 320px; border-radius: 15px; padding: 25px 20px 20px; position: relative; border: 1px solid #444; }
        
        /* Pontosan a sarokba pozícionált X */
        .close-x { 
            position: absolute; 
            top: -15px; 
            right: -15px; 
            background: var(--danger); 
            color: white; 
            width: 35px; 
            height: 35px; 
            border-radius: 50%; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-size: 20px; 
            font-weight: bold; 
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            z-index: 2100;
        }

        input { width: 100%; padding: 12px; margin-bottom: 10px; border-radius: 10px; border: 1px solid #444; background: #000; color: #fff; font-size: 16px; }
        
        .list-container { display: flex; flex-direction: column; gap: 8px; }
        .item { background: var(--item-bg); padding: 12px; border-radius: 10px; display: flex; align-items: center; justify-content: space-between; }
        .btn-sm { border: none; width: 38px; height: 38px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 18px; color: white; cursor: pointer; background: rgba(255,255,255,0.05); }
        .has-data { background: var(--yellow) !important; color: #000 !important; }

        #doneItems .item { background: var(--success) !important; }
        #missingItems .item { background: var(--danger) !important; }
    </style>
</head>
<body>

<div class="app-card">
    <div class="version">v3.3 - Tömörített képek</div>
    <div class="header">
        <h2 style="margin:0 0 10px; font-size: 20px;">BEVÁSÁRLÓ LISTA</h2>
        <button id="notifBtn" onclick="toggleNotifs()">🔔 Értesítések: KI</button>
    </div>

    <div style="display:flex; gap:10px; margin-bottom:20px;">
        <button id="micBtn" style="flex:1; padding:15px; border-radius:12px; border:none; background:var(--primary); color:white; font-weight:bold;">🎤 HANG</button>
        <button onclick="openModal('inputModal')" style="flex:1; padding:15px; border-radius:12px; border:none; background:var(--grey); color:white; font-weight:bold;">⌨️ ÍRÁS</button>
    </div>

    <div id="activeItems" class="list-container"></div>
    <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px; margin-top:20px;">
        <div id="doneItems" class="list-container"></div>
        <div id="missingItems" class="list-container"></div>
    </div>
</div>

<div id="inputModal" class="custom-modal">
    <div class="modal-content">
        <div class="close-x" onclick="closeModal('inputModal')">✕</div>
        <input type="text" id="manualInput" placeholder="Termék neve...">
        <input type="text" id="noteInput" placeholder="Megjegyzés...">
        
        <label style="display:block; text-align:center; padding:12px; background:#333; border-radius:10px; margin-bottom:10px; cursor:pointer; font-size:14px;">
            📷 Fotó / Galéria
            <input type="file" accept="image/*" style="display:none" onchange="processImage(this, 'temp')">
        </label>
        <div id="preloader" style="display:none; text-align:center; font-size:12px; color:var(--primary); margin-bottom:10px;">Tömörítés...</div>
        <img id="tempPreview" style="width:100%; max-height:100px; object-fit:cover; border-radius:8px; display:none; margin-bottom:10px;">
        
        <button onclick="saveItem()" style="width:100%; padding:15px; border-radius:10px; border:none; background:var(--primary); color:white; font-weight:bold;">HOZZÁADÁS</button>
    </div>
</div>

<script>
    const firebaseConfig = { apiKey: "AIzaSyC0fhL9VVErpN9LX6eJ8Tv5nuxF5Ea-qjE", databaseURL: "https://kozoslista-e0717-default-rtdb.europe-west1.firebasedatabase.app", projectId: "kozoslista-e0717" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const listRef = db.ref('shoppingList');
    let compressedPhoto = "";

    function openModal(id) { document.getElementById(id).style.display = 'flex'; }
    function closeModal(id) { document.getElementById(id).style.display = 'none'; }

    // KÉPTÖMÖRÍTŐ FUNKCIÓ (A SEBESSÉGÉRT)
    function processImage(input, target) {
        if (!input.files || !input.files[0]) return;
        document.getElementById('preloader').style.display = 'block';
        
        const reader = new FileReader();
        reader.onload = function(e) {
            const img = new Image();
            img.onload = function() {
                const canvas = document.createElement('canvas');
                let width = img.width;
                let height = img.height;

                // Max 800px szélesség megtartva az arányokat
                const MAX_WIDTH = 800;
                if (width > MAX_WIDTH) {
                    height *= MAX_WIDTH / width;
                    width = MAX_WIDTH;
                }

                canvas.width = width;
                canvas.height = height;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, width, height);

                // Tömörítés 0.6-os minőségre (JPEG)
                compressedPhoto = canvas.toDataURL('image/jpeg', 0.6);
                
                const prev = document.getElementById('tempPreview');
                prev.src = compressedPhoto;
                prev.style.display = 'block';
                document.getElementById('preloader').style.display = 'none';
            };
            img.src = e.target.result;
        };
        reader.readAsDataURL(input.files[0]);
    }

    function saveItem() {
        const text = document.getElementById('manualInput').value.trim();
        const note = document.getElementById('noteInput').value.trim();
        if(text) {
            listRef.push({ text, note, photo: compressedPhoto, status: 'active', order: Date.now() });
            document.getElementById('manualInput').value = '';
            document.getElementById('noteInput').value = '';
            document.getElementById('tempPreview').style.display = 'none';
            compressedPhoto = "";
            closeModal('inputModal');
        }
    }

    // ÉRTESÍTÉS KEZELÉS JAVÍTVA
    function toggleNotifs() {
        if (!("Notification" in window)) return alert("Nem támogatott böngésző.");
        Notification.requestPermission().then(permission => {
            const btn = document.getElementById('notifBtn');
            if(permission === "granted") {
                btn.innerText = "✅ Értesítések: BE";
                btn.classList.add('active');
            } else {
                alert("Engedélyezd az értesítéseket a böngésző beállításaiban (lakat ikon)!");
            }
        });
    }

    // LISTA MEGJELENÍTÉS
    listRef.on('value', snap => {
        const data = snap.val();
        const activeCont = document.getElementById('activeItems');
        activeCont.innerHTML = "";
        if(!data) return;

        Object.keys(data).forEach(id => {
            const item = data[id];
            if(item.status !== 'active') return;
            const div = document.createElement('div');
            div.className = 'item';
            div.innerHTML = `
                <span>${item.text}</span>
                <div style="display:flex; gap:5px;">
                    <button class="btn-sm ${(item.note || item.photo) ? 'has-data' : ''}" onclick="alert('${item.note || "Nincs megjegyzés"}')">ℹ️</button>
                    <button class="btn-sm" style="background:var(--success)" onclick="db.ref('shoppingList/${id}').update({status:'done'})">✔</button>
                </div>
            `;
            activeCont.appendChild(div);
        });
    });

</script>
</body>
</html>
