<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bevásárló lista</title>
    <link rel="apple-touch-icon" href="IMG_4302.png">
    <link rel="icon" type="image/png" href="IMG_4302.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <style>
        :root { --bg: #0b0b0b; --card-bg: #1a1a1a; --item-bg: #262626; --text: #f0f0f0; --primary: #a87ff3; --success: #32a852; --danger: #eb4034; --grey: #333; --border: #444; }
        .light-mode { --bg: #d1d1d6; --card-bg: #f0f0f7; --item-bg: #ffffff; --text: #1c1c1e; --primary: #5856d6; --success: #34c759; --danger: #d66d6d; --grey: #e5e5ea; --border: #c7c7cc; }
        
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: -apple-system, sans-serif; 
            user-select: none !important; -webkit-user-select: none !important; }
        
        input, textarea { user-select: text !important; -webkit-user-select: text !important; }

        body { background: var(--bg); color: var(--text); margin: 0; padding: 10px; display: flex; justify-content: center; min-height: 100vh; transition: background 0.3s; overflow-x: hidden; }
        .app-card { background: var(--card-bg); width: 100%; max-width: 420px; border-radius: 20px; padding: 15px; align-self: flex-start; }
        
        .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; position: relative; }
        .version-tag { position: absolute; left: 50%; transform: translateX(-50%); font-size: 10px; font-weight: bold; opacity: 0.4; }
        
        .notif-toggle-btn { background: var(--item-bg); color: var(--text); border: 1px solid var(--border); padding: 7px 18px; border-radius: 20px; font-size: 11px; font-weight: bold; cursor: pointer; }
        .notif-toggle-btn.active { background: var(--success); color: white; }

        .col-label { font-size: 10px; text-align: center; color: #aaa; margin: 15px auto 8px; text-transform: uppercase; background: var(--grey); padding: 4px 12px; border-radius: 20px; display: table; }
        
        /* FIX: Hosszú szöveg kezelése */
        .item { background: var(--item-bg); padding: 10px 12px; border-radius: 10px; display: flex; align-items: center; gap: 10px; position: relative; z-index: 5; border: 1.5px solid transparent; touch-action: pan-y; width: 100%; }
        .item span { flex: 1; font-size: 15px; font-weight: 500; word-break: break-word; white-space: normal; line-height: 1.2; padding-right: 5px; }
        
        .item-wrapper { position: relative; border-radius: 10px; overflow: hidden; margin-bottom: 8px; width: 100%; }
        .delete-btn-bg { position: absolute; right: 0; top: 0; bottom: 0; width: 80px; background: var(--danger); color: white; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: bold; z-index: 1; }

        .drag-handle { color: #555; font-size: 22px; cursor: grab; padding: 5px; flex-shrink: 0; }
        .btn-group { display: flex; gap: 6px; align-items: center; flex-shrink: 0; }
        .btn-sm { width: 34px; height: 34px; border-radius: 8px; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.1); color: white; border: none; }

        .bottom-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
        .bottom-grid .item { padding: 8px; flex-direction: column; text-align: center; gap: 8px; }
        .bottom-grid .btn-group { justify-content: center; width: 100%; }

        .status-done { border-color: var(--success) !important; background: rgba(50, 168, 82, 0.05) !important; }
        .status-x { border-color: var(--danger) !important; background: rgba(235, 64, 52, 0.05) !important; }
        .has-data { border: 1.5px solid var(--danger) !important; }

        .custom-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 2000; justify-content: center; align-items: center; padding: 20px; }
        .modal-content { background: var(--card-bg); width: 100%; max-width: 360px; border-radius: 24px; padding: 35px 20px 25px; position: relative; border: 1px solid var(--border); }
        .close-x { position: absolute; top: 10px; right: 20px; font-size: 30px; color: var(--danger); cursor: pointer; font-weight: bold; }
        
        input, textarea { width: 100%; padding: 12px; margin-bottom: 10px; border-radius: 10px; border: 1px solid var(--border); background: #000; color: #fff; font-size: 16px; outline: none; }
        .action-btn { width: 100%; padding: 15px; border-radius: 10px; border: none; background: var(--primary); color: white; font-weight: bold; }
    </style>
</head>
<body class="dark">

<div class="app-card">
    <div class="header-top">
        <button onclick="toggleMode()" style="background:none; border:none; font-size:20px;">🌓</button>
        <div class="version-tag">v0.8.9</div>
        <button onclick="clearAllItems()" style="background:none; border:none; font-size:18px; opacity:0.3;">🗑️</button>
    </div>
    
    <div class="notif-container" style="display:flex; justify-content:center; margin: 10px 0;">
        <button id="notifBtn" class="notif-toggle-btn" onclick="toggleNotifications()">Értesítések: KI</button>
    </div>

    <button onclick="openModal('inputModal')" style="width:100%; padding:15px; border-radius:12px; border:none; background:var(--grey); color:var(--text); font-weight:bold; margin-bottom:20px;">+ ÚJ TÉTEL</button>

    <div class="col-label">Aktív lista</div>
    <div id="activeItems" class="list-container"></div>
    
    <div class="bottom-grid">
        <div><div class="col-label">Megvan</div><div id="doneItems" class="list-container"></div></div>
        <div><div class="col-label">Nincs</div><div id="missingItems" class="list-container"></div></div>
    </div>
</div>

<div id="inputModal" class="custom-modal"><div class="modal-content"><div class="close-x" onclick="closeModal('inputModal')">×</div><input type="text" id="manualInput" placeholder="Termék..."><textarea id="manualNote" placeholder="Megjegyzés..." rows="2"></textarea><button class="action-btn" onclick="addItem()">HOZZÁADÁS</button></div></div>

<div id="infoModal" class="custom-modal"><div class="modal-content"><div class="close-x" onclick="closeModal('infoModal')">×</div><h3 id="infoTitle" style="text-align:center;"></h3><div id="noteDisplay" style="text-align:center; padding:15px; background:rgba(255,255,255,0.05); border-radius:10px; margin-bottom:15px;"></div><button class="action-btn" onclick="closeModal('infoModal')">BEZÁRÁS</button></div></div>

<script>
    const firebaseConfig = { apiKey: "AIzaSyC0fhL9VVErpN9LX6eJ8Tv5nuxF5Ea-qjE", databaseURL: "https://kozoslista-e0717-default-rtdb.europe-west1.firebasedatabase.app", projectId: "kozoslista-e0717" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database(), listRef = db.ref('shoppingList');
    let isInitialLoad = true, notificationsEnabled = localStorage.getItem('notifications') === 'true';

    function toggleMode() { document.body.classList.toggle('light-mode'); }
    function updateNotifUI() { const btn = document.getElementById('notifBtn'); btn.innerText = notificationsEnabled ? "Értesítések: BE" : "Értesítések: KI"; btn.classList.toggle('active', notificationsEnabled); }
    updateNotifUI();

    async function toggleNotifications() {
        if (!notificationsEnabled) { 
            const perm = await Notification.requestPermission(); 
            if (perm === 'granted') { notificationsEnabled = true; localStorage.setItem('notifications', 'true'); new Notification("Értesítések aktívak!"); } 
        } else { notificationsEnabled = false; localStorage.setItem('notifications', 'false'); }
        updateNotifUI();
    }

    // Értesítés fix: Egyedi ID minden üzenetnek
    listRef.on('child_added', snap => {
        if (!isInitialLoad && notificationsEnabled && snap.val().status === 'active' && document.visibilityState !== 'visible') {
            new Notification("Új tétel: " + snap.val().text, { icon: 'IMG_4302.png', tag: snap.key + Date.now() });
        }
    });
    listRef.once('value', () => { setTimeout(() => isInitialLoad = false, 1500); });

    function render(data) {
        const containers = { active: 'activeItems', done: 'doneItems', x: 'missingItems' };
        Object.values(containers).forEach(id => document.getElementById(id).innerHTML = '');
        if(!data) return;
        Object.keys(data).map(k => ({id:k, ...data[k]})).sort((a,b) => a.order - b.order).forEach(it => {
            const wrap = document.createElement('div'); wrap.className = 'item-wrapper';
            const del = document.createElement('div'); del.className = 'delete-btn-bg'; del.innerText = 'TÖRLÉS'; del.onclick = () => listRef.child(it.id).remove();
            
            const div = document.createElement('div'); 
            div.className = `item ${it.status==='done'?'status-done':it.status==='x'?'status-x':''}`;
            const hasExtra = it.note && it.note.trim();

            div.innerHTML = `
                ${it.status==='active'?'<div class="drag-handle">≡</div>':''}
                <span>${it.text}</span>
                <div class="btn-group">
                    <button class="btn-sm ${hasExtra?'has-data':''}" onclick="openInfo('${it.id}')">ℹ️</button>
                    ${it.status==='active' ? 
                        `<button class="btn-sm" style="background:var(--success)" onclick="listRef.child('${it.id}').update({status:'done'})">✔</button>
                         <button class="btn-sm" style="background:var(--danger)" onclick="listRef.child('${it.id}').update({status:'x'})">✖</button>` :
                        `<button class="btn-sm" onclick="listRef.child('${it.id}').update({status:'active'})">↩</button>`
                    }
                </div>`;

            let sX = 0, cX = 0, isSwipe = false, isDragging = false;
            
            div.addEventListener('touchstart', e => { sX = e.touches[0].clientX; div.style.transition = 'none'; }, {passive:true});
            div.addEventListener('touchmove', e => {
                if (document.body.classList.contains('sorting')) return; // Ha épp rendezünk, nincs swipe
                let d = sX - e.touches[0].clientX;
                if (d > 15) { isSwipe = true; cX = Math.min(d, 80); div.style.transform = `translateX(-${cX}px)`; }
            }, {passive:true});
            div.addEventListener('touchend', () => {
                div.style.transition = 'transform 0.3s ease';
                div.style.transform = (isSwipe && cX > 40) ? 'translateX(-80px)' : 'translateX(0)';
                isSwipe = false;
            });

            wrap.appendChild(del); wrap.appendChild(div);
            document.getElementById(containers[it.status]).appendChild(wrap);
        });
    }

    function addItem() {
        const v = document.getElementById('manualInput').value.trim(), n = document.getElementById('manualNote').value.trim();
        if(v) { listRef.push({ text: v, note: n, status: 'active', order: Date.now() }); closeModal('inputModal'); }
    }

    listRef.on('value', snap => render(snap.val()));
    
    new Sortable(document.getElementById('activeItems'), { 
        handle: '.drag-handle', animation: 150, 
        onStart: () => document.body.classList.add('sorting'),
        onEnd: () => {
            document.body.classList.remove('sorting');
            document.querySelectorAll('#activeItems .item-wrapper').forEach((el, i) => {
                const id = el.querySelector('.item').parentElement.querySelector('.delete-btn-bg').onclick.toString().match(/'(.*?)'/)[1];
                listRef.child(id).update({ order: Date.now() + i });
            });
        }
    });

    function openModal(id) { document.getElementById(id).style.display = 'flex'; }
    function closeModal(id) { document.getElementById(id).style.display = 'none'; }
    function openInfo(id) {
        listRef.child(id).once('value', snap => {
            document.getElementById('infoTitle').innerText = snap.val().text;
            document.getElementById('noteDisplay').innerText = snap.val().note || "Nincs megjegyzés.";
            openModal('infoModal');
        });
    }
    function clearAllItems() { if(confirm("Mindent törölsz?")) listRef.remove(); }
</script>
</body>
</html>
