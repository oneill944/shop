<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bevásárló lista</title>
    
    <link rel="apple-touch-icon" href="IMG_4302.png">
    <link rel="icon" type="image/png" href="IMG_4302.png">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    
    <style>
        :root { --bg: #0b0b0b; --card-bg: #1a1a1a; --item-bg: #262626; --text: #f0f0f0; --primary: #a87ff3; --success: #32a852; --danger: #eb4034; --grey: #333; --border: #444; }
        .light-mode { --bg: #d1d1d6; --card-bg: #f0f0f7; --item-bg: #ffffff; --text: #1c1c1e; --primary: #5856d6; --success: #34c759; --danger: #d66d6d; --grey: #e5e5ea; --border: #c7c7cc; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: -apple-system, sans-serif; user-select: none; -webkit-user-select: none; }
        body { background: var(--bg); color: var(--text); margin: 0; padding: 10px; display: flex; justify-content: center; min-height: 100vh; transition: background 0.3s; }
        .app-card { background: var(--card-bg); width: 100%; max-width: 400px; border-radius: 20px; padding: 15px; align-self: flex-start; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; position: relative; }
        .mode-toggle { background: none; border: none; color: var(--text); font-size: 20px; cursor: pointer; padding: 5px; }
        
        /* Felirat alatti értesítés kapcsoló */
        .notif-wrapper { text-align: center; margin-bottom: 15px; }
        .notif-toggle { 
            background: var(--item-bg); 
            color: var(--text); 
            border: 1px solid var(--border); 
            padding: 8px 22px; 
            border-radius: 20px; 
            font-size: 11px; 
            font-weight: bold; 
            cursor: pointer; 
            text-transform: uppercase;
            transition: 0.3s;
        }
        .notif-toggle.active { background: var(--success); color: white; border-color: var(--success); }

        .col-label { font-size: 10px; text-align: center; color: #aaa; margin: 10px auto 8px; text-transform: uppercase; letter-spacing: 1px; background: var(--grey); padding: 4px 12px; border-radius: 20px; display: table; }
        .list-container { display: flex; flex-direction: column; gap: 8px; min-height: 20px; width: 100%; }
        .item-wrapper { position: relative; border-radius: 10px; overflow: hidden; background: transparent; width: 100%; }
        .delete-btn-bg { position: absolute; right: 2px; top: 2px; bottom: 2px; width: 80px; background: var(--danger); color: white; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: bold; border-radius: 8px; z-index: 1; }
        .item { background: var(--item-bg); padding: 8px 12px; border-radius: 10px; display: flex; align-items: center; gap: 10px; position: relative; z-index: 5; transition: transform 0.2s; border: 1px solid transparent; touch-action: pan-y; width: 100%; }
        .drag-handle { color: #555; font-size: 20px; padding-right: 5px; cursor: grab; flex-shrink: 0; }
        .btn-sm { width: 30px; height: 30px; border-radius: 8px; display: flex; align-items: center; justify-content: center; cursor: pointer; background: rgba(255,255,255,0.1); color: white; border: 1px solid transparent; flex-shrink: 0; font-size: 14px; }
        .action-btn { width: 100%; padding: 15px; border-radius: 10px; border: none; background: var(--primary); color: white; font-weight: bold; cursor: pointer; }
        .custom-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 2000; justify-content: center; align-items: center; padding: 20px; }
        .modal-content { background: var(--card-bg); width: 100%; max-width: 360px; border-radius: 24px; padding: 35px 20px 25px; position: relative; border: 1px solid var(--border); max-height: 90vh; overflow-y: auto; }
        .close-x { position: absolute; top: 5px; right: 15px; font-size: 28px; color: var(--danger); cursor: pointer; z-index: 2001; }
        input, textarea { width: 100%; padding: 12px; margin-bottom: 10px; border-radius: 10px; border: 1px solid var(--border); background: #000; color: #fff; font-size: 16px; }
        .img-preview-box { width: 100%; max-height: 180px; object-fit: cover; border-radius: 10px; margin: 10px 0; border: 1px solid var(--border); }
    </style>
</head>
<body class="dark">

<div class="app-card">
    <div class="header-top">
        <button class="mode-toggle" onclick="toggleMode()">🌓</button>
        <button onclick="clearAllItems()" style="background:none; border:none; font-size:18px; opacity:0.3;">🗑️</button>
    </div>
    
    <h2 style="text-align:center; font-size:19px; margin-bottom:5px; letter-spacing:1px;">BEVÁSÁRLÓ LISTA</h2>
    
    <div class="notif-wrapper">
        <button id="notifBtn" class="notif-toggle" onclick="toggleNotifications()">Értesítések: KI</button>
    </div>

    <div style="margin-bottom:20px;">
        <button onclick="openModal('inputModal')" style="width:100%; padding:15px; border-radius:12px; border:none; background:var(--grey); color:var(--text); font-weight:bold;">HOZZÁADÁS</button>
    </div>

    <div id="activeItems" class="list-container"></div>
    <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px; margin-top:15px;">
        <div id="doneItems" class="list-container"></div>
        <div id="missingItems" class="list-container"></div>
    </div>
</div>

<div id="inputModal" class="custom-modal"><div class="modal-content"><div class="close-x" onclick="closeModal('inputModal')">×</div><input type="text" id="manualInput" placeholder="Termék neve..."><textarea id="manualNote" placeholder="Megjegyzés..."></textarea><label style="display:block; text-align:center; padding:12px; background:#333; border-radius:10px; margin-bottom:10px; color:white;">📷 Fotó<input type="file" id="newPhotoFile" accept="image/*" style="display:none" onchange="previewPhoto(this, 'newPhotoPreview')"></label><img id="newPhotoPreview" class="img-preview-box" style="display:none;"><button class="action-btn" onclick="addItem()">HOZZÁADÁS</button></div></div>

<script>
    const firebaseConfig = { apiKey: "AIzaSyC0fhL9VVErpN9LX6eJ8Tv5nuxF5Ea-qjE", databaseURL: "https://kozoslista-e0717-default-rtdb.europe-west1.firebasedatabase.app", projectId: "kozoslista-e0717" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const listRef = db.ref('shoppingList');

    let isInitialLoad = true;
    let notificationsEnabled = localStorage.getItem('notifications') === 'true';

    function toggleMode() { document.body.classList.toggle('light-mode'); localStorage.setItem('theme', document.body.classList.contains('light-mode') ? 'light' : 'dark'); }
    if(localStorage.getItem('theme') === 'light') document.body.classList.add('light-mode');

    function updateNotifUI() {
        const btn = document.getElementById('notifBtn');
        btn.innerText = notificationsEnabled ? "Értesítések: BE" : "Értesítések: KI";
        btn.classList.toggle('active', notificationsEnabled);
    }
    updateNotifUI();

    function toggleNotifications() {
        if (!notificationsEnabled) {
            Notification.requestPermission().then(perm => {
                if (perm === 'granted') {
                    notificationsEnabled = true;
                    localStorage.setItem('notifications', 'true');
                    updateNotifUI();
                    new Notification("Értesítések aktívak!", { icon: 'IMG_4302.png' });
                }
            });
        } else {
            notificationsEnabled = false;
            localStorage.setItem('notifications', 'false');
            updateNotifUI();
        }
    }

    // --- AZ A BIZONYOS RÉGI ÉRTESÍTÉSI LOGIKA ---
    listRef.on('child_added', snap => {
        // Csak akkor küldünk, ha már betöltött a lista és be van kapcsolva a gomb
        if (!isInitialLoad && notificationsEnabled) {
            const it = snap.val();
            // Csak az aktív tételekről szólunk
            if (it.status === 'active') {
                // Megpróbáljuk kilőni az értesítést
                const title = "Új termék a kosárba!";
                const options = {
                    body: it.text,
                    icon: 'IMG_4302.png',
                    badge: 'IMG_4302.png',
                    silent: false
                };

                // Ha van Service Worker, azzal küldjük (Főképernyőhöz), ha nincs, simán
                if ('serviceWorker' in navigator) {
                    navigator.serviceWorker.ready.then(reg => {
                        reg.showNotification(title, options);
                    });
                } else {
                    new Notification(title, options);
                }
            }
        }
    });

    // Ez állítja át a betöltési állapotot, hogy ne csipogjon be minden régi tételre nyitáskor
    listRef.once('value', () => {
        setTimeout(() => { isInitialLoad = false; }, 1000);
    });

    listRef.on('value', snap => { render(snap.val()); });

    function render(data) {
        const containers = { active: 'activeItems', done: 'doneItems', x: 'missingItems' };
        Object.values(containers).forEach(id => document.getElementById(id).innerHTML = '');
        if(!data) return;
        const items = Object.keys(data).map(k => ({id:k, ...data[k]}));
        items.sort((a,b) => a.order - b.order).forEach(it => {
            const wrap = document.createElement('div'); wrap.className = 'item-wrapper'; wrap.setAttribute('data-id', it.id);
            const div = document.createElement('div'); div.className = `item ${it.status === 'done' ? 'status-done' : (it.status === 'x' ? 'status-x' : '')}`;
            div.innerHTML = `<span style="flex:1;">${it.text}</span><div style="display:flex; gap:5px;"><button class="btn-sm" onclick="listRef.child('${it.id}').update({status:'done'})">✔</button><button class="btn-sm" style="background:var(--danger)" onclick="listRef.child('${it.id}').remove()">🗑️</button></div>`;
            wrap.appendChild(div);
            document.getElementById(containers[it.status] || 'activeItems').appendChild(wrap);
        });
    }

    function addItem() {
        const val = document.getElementById('manualInput').value.trim();
        if (val) {
            listRef.push({ text: val, status: 'active', order: Date.now() });
            document.getElementById('manualInput').value = '';
            closeModal('inputModal');
        }
    }

    function openModal(id) { document.getElementById(id).style.display = 'flex'; }
    function closeModal(id) { document.getElementById(id).style.display = 'none'; }
    function clearAllItems() { if(confirm("Mindent törölsz?")) listRef.remove(); }
</script>
</body>
</html>
