<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bevásárló lista Pro v3.2</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        :root { --bg: #000; --card-bg: #121212; --item-bg: #1e1e1e; --text: #e0e0e0; --primary: #bb86fc; --success: #2e7d32; --danger: #af4444; --grey: #252525; --yellow: #ffff00; }
        body.light { --bg: #d1d1d6; --card-bg: #f0f0f7; --item-bg: #ffffff; --text: #1c1c1e; --primary: #5856d6; --success: #34c759; --danger: #d66d6d; --grey: #e5e5ea; }
        
        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; touch-action: manipulation; -webkit-user-select: none; user-select: none; }
        input, textarea { user-select: text; -webkit-user-select: text; }
        body { background: var(--bg); color: var(--text); font-family: sans-serif; margin: 0; padding: 10px; display: flex; justify-content: center; min-height: 100vh; }
        
        .app-card { background: var(--card-bg); width: 100%; max-width: 380px; border-radius: 15px; padding: 15px; position: relative; align-self: flex-start; }
        .version { position: absolute; top: 8px; left: 15px; font-size: 9px; color: #555; }
        
        .header { text-align: center; border-bottom: 1px solid #333; padding: 15px 0 10px; margin-bottom: 10px; }
        #notifBtn { font-size: 10px; background: #222; color: #777; border: 1px solid #444; padding: 6px 12px; border-radius: 20px; cursor: pointer; transition: 0.3s; }
        #notifBtn.active { background: var(--success); color: white; border-color: transparent; }
        #notifBtn.blocked { background: var(--danger); color: white; border-color: transparent; }

        .list-container { display: flex; flex-direction: column; gap: 8px; }
        .item-wrapper { position: relative; border-radius: 8px; overflow: hidden; }
        .item { background: var(--item-bg); padding: 10px 12px; border-radius: 8px; display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 55px; position: relative; z-index: 2; transition: transform 0.2s; }
        
        #doneItems .item { background: var(--success) !important; color: white; }
        #missingItems .item { background: var(--danger) !important; color: white; }

        .actions { display: flex; gap: 5px; }
        .btn-sm { border: none; width: 36px; height: 36px; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: white; cursor: pointer; background: rgba(255,255,255,0.1); font-size: 16px; }
        .has-data { background: var(--yellow) !important; color: #000 !important; }
        
        /* MODAL ÉS X GOMB JAVÍTÁS */
        .custom-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); justify-content: center; align-items: center; z-index: 2000; padding: 20px; }
        .modal-content { background: var(--item-bg); padding: 30px 20px 20px; border-radius: 15px; width: 100%; max-width: 320px; position: relative; border: 1px solid #444; }
        .close-x { position: absolute; top: 5px; right: 10px; font-size: 35px; color: #ff3b30; cursor: pointer; line-height: 1; font-weight: bold; }

        .bottom-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
        .column-label { text-align: center; font-size: 10px; font-weight: bold; padding: 5px; background: var(--grey); border-radius: 5px; margin-bottom: 5px; }
        .delete-reveal { position: absolute; right: 0; top: 0; bottom: 0; width: 70px; background: var(--danger); display: flex; align-items: center; justify-content: center; color: white; font-size: 11px; z-index: 1; }
    </style>
</head>
<body class="dark">

<div class="app-card">
    <div class="version">v3.2</div>
    <div class="header">
        <h2 style="margin:0; font-size: 18px; letter-spacing: 1px;">BEVÁSÁRLÓ LISTA</h2>
        <button id="notifBtn" onclick="handleNotifToggle()">🔔 Értesítések: ELLENŐRZÉS...</button>
    </div>

    <div style="display:flex; gap:8px; margin-bottom:15px;">
        <button id="micBtn" style="flex:1; padding:15px; border-radius:12px; border:none; background:var(--primary); color:white; font-weight:bold;">🎤 DIKTÁLÁS</button>
        <button onclick="openInput()" style="flex:1; padding:15px; border-radius:12px; border:none; background:var(--grey); color:var(--text); font-weight:bold;">⌨️ ÍRÁS</button>
    </div>

    <div id="activeItems" class="list-container"></div>
    <div class="bottom-grid">
        <div><div class="column-label">MEGVAN</div><div id="doneItems" class="list-container"></div></div>
        <div><div class="column-label">NINCS</div><div id="missingItems" class="list-container"></div></div>
    </div>
</div>

<div id="inputModal" class="custom-modal">
    <div class="modal-content">
        <div class="close-x" onclick="closeModal('inputModal')">×</div>
        <input type="text" id="manualInput" placeholder="Termék neve..." style="width:100%; padding:14px; margin-bottom:12px; border-radius:10px; background:#000; color:#fff; border:1px solid #444; font-size:16px;">
        <input type="text" id="noteInput" placeholder="Megjegyzés..." style="width:100%; padding:14px; margin-bottom:12px; border-radius:10px; background:#000; color:#fff; border:1px solid #444; font-size:16px;">
        
        <label style="display:flex; align-items:center; justify-content:center; gap:10px; padding:12px; background:#333; border-radius:10px; cursor:pointer; margin-bottom:12px;">
            📷 Fotó / Galéria
            <input type="file" id="newPhotoInput" accept="image/*" style="display:none" onchange="previewNewPhoto(this)">
        </label>
        <img id="newImgPreview" style="width:100%; max-height:120px; object-fit:cover; border-radius:8px; margin-bottom:10px; display:none;">
        
        <button onclick="handleAddItem()" style="width:100%; padding:16px; border-radius:10px; border:none; background:var(--primary); color:white; font-weight:bold;">HOZZÁADÁS</button>
    </div>
</div>

<div id="infoModal" class="custom-modal">
    <div class="modal-content">
        <div class="close-x" onclick="closeModal('infoModal')">×</div>
        <h3 id="infoTitle" style="margin:0 0 15px 0; text-align:center;"></h3>
        <div id="noteBox" style="background:rgba(255,255,255,0.05); padding:15px; border-radius:10px; margin-bottom:10px; display:flex; justify-content:space-between; align-items:center;">
            <span id="noteDisplay" style="font-size:14px; color:#ddd;"></span>
            <div style="display:flex; gap:10px;">
                <button onclick="editNote()" style="background:none; border:none;">✏️</button>
                <button onclick="deleteNoteData()" style="background:none; border:none;">🗑️</button>
            </div>
        </div>
        <div id="noteEditArea" style="display:none; margin-bottom:10px;">
            <textarea id="noteTextarea" style="width:100%; background:#000; color:#fff; border:1px solid #444; border-radius:8px; padding:10px;"></textarea>
            <button onclick="saveNoteData()" style="width:100%; margin-top:5px; background:var(--primary); border:none; padding:10px; color:white; border-radius:8px;">MENTÉS</button>
        </div>
        <label style="display:block; text-align:center; padding:12px; background:#333; border-radius:10px; margin-bottom:10px; cursor:pointer;">📷 Kép módosítása <input type="file" accept="image/*" style="display:none" onchange="updatePhotoData(this)"></label>
        <div id="infoPhotoCont" style="position:relative; display:none;"><img id="infoPhotoImg" style="width:100%; border-radius:10px;"><button onclick="deletePhotoData()" style="position:absolute; top:8px; right:8px; background:red; border:none; color:white; border-radius:50%; width:28px; height:28px;">×</button></div>
    </div>
</div>

<script>
    const firebaseConfig = { apiKey: "AIzaSyC0fhL9VVErpN9LX6eJ8Tv5nuxF5Ea-qjE", databaseURL: "https://kozoslista-e0717-default-rtdb.europe-west1.firebasedatabase.app", projectId: "kozoslista-e0717" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const listRef = db.ref('shoppingList');
    let currentId = null, tempPhotoData = "";

    function openInput() { document.getElementById('inputModal').style.display='flex'; document.getElementById('manualInput').focus(); }
    function closeModal(id) { document.getElementById(id).style.display='none'; }

    // ÉRTESÍTÉSEK OKOSÍTVA
    function checkNotifStatus() {
        const btn = document.getElementById('notifBtn');
        if (!("Notification" in window)) { btn.innerText = "Nincs értesítés támogatás"; return; }
        if (Notification.permission === "granted") { btn.innerText = "✅ Értesítések: BE"; btn.className = "active"; }
        else if (Notification.permission === "denied") { btn.innerText = "🚫 Értesítések: TILTVA"; btn.className = "blocked"; }
        else { btn.innerText = "🔔 Értesítések: KI"; btn.className = ""; }
    }

    function handleNotifToggle() {
        if (Notification.permission === "default") {
            Notification.requestPermission().then(permission => checkNotifStatus());
        } else if (Notification.permission === "denied") {
            alert("Az értesítések le vannak tiltva a böngésződben. Kérlek, engedélyezd a weboldal beállításaiban!");
        } else {
            alert("Az értesítések már be vannak kapcsolva.");
        }
    }
    checkNotifStatus();

    // DIKTÁLÁS
    const micBtn = document.getElementById('micBtn');
    if ('webkitSpeechRecognition' in window) {
        const recognition = new webkitSpeechRecognition();
        recognition.lang = 'hu-HU';
        recognition.onstart = () => { micBtn.innerText = "🛑 FIGYELEK..."; micBtn.style.background = "#ff3b30"; };
        recognition.onresult = (e) => {
            const text = e.results[0][0].transcript;
            if(text) listRef.push({ text: text.charAt(0).toUpperCase() + text.slice(1), status: 'active', order: Date.now() });
        };
        recognition.onend = () => { micBtn.innerText = "🎤 DIKTÁLÁS"; micBtn.style.background = "var(--primary)"; };
        micBtn.onclick = () => recognition.start();
    }

    listRef.on('value', snap => {
        const data = snap.val();
        const items = data ? Object.keys(data).map(k => ({id:k, ...data[k]})) : [];
        render(items);
    });

    function render(items) {
        const containers = { active: document.getElementById('activeItems'), done: document.getElementById('doneItems'), x: document.getElementById('missingItems') };
        Object.values(containers).forEach(c => c.innerHTML = '');
        items.sort((a,b) => a.order - b.order).forEach(item => {
            const wrap = document.createElement('div');
            wrap.className = 'item-wrapper';
            wrap.innerHTML = `<div class="delete-reveal" onclick="deleteFullItem('${item.id}')">TÖRLÉS</div>`;
            const div = document.createElement('div');
            div.className = 'item';
            div.dataset.id = item.id;
            const hasData = item.note || item.photo;
            div.innerHTML = `<span style="flex:1">${item.text}</span><div class="actions">
                <button class="btn-sm ${hasData ? 'has-data' : ''}" onclick="openInfo('${item.id}')">ℹ️</button>
                ${item.status==='active' ? `<button class="btn-sm" style="background:var(--success)" onclick="updateStat('${item.id}','done')">✔</button><button class="btn-sm" style="background:var(--danger)" onclick="updateStat('${item.id}','x')">✖</button>` : `<button class="btn-sm" onclick="updateStat('${item.id}','active')">↩</button>`}
            </div>`;
            initInteractions(div);
            wrap.appendChild(div);
            containers[item.status==='active' ? 'active' : (item.status==='done' ? 'done' : 'x')].appendChild(wrap);
        });
    }

    function initInteractions(el) {
        let sX = 0, sY = 0, isDrag = false, t;
        el.ontouchstart = e => { sX = e.touches[0].clientX; sY = e.touches[0].clientY; t = setTimeout(() => { isDrag = true; el.classList.add('dragging'); if(navigator.vibrate) navigator.vibrate(50); }, 500); };
        el.ontouchmove = e => {
            let mX = e.touches[0].clientX, mY = e.touches[0].clientY;
            if(isDrag) {
                e.preventDefault();
                const cont = document.getElementById('activeItems');
                const after = [...cont.querySelectorAll('.item:not(.dragging)')].reduce((closest, child) => {
                    const box = child.getBoundingClientRect();
                    const offset = mY - box.top - box.height/2;
                    return (offset < 0 && offset > closest.offset) ? { offset, element: child } : closest;
                }, { offset: Number.NEGATIVE_INFINITY }).element;
                if(after) cont.insertBefore(el.parentElement, after.parentElement); else cont.appendChild(el.parentElement);
            } else {
                let dX = sX - mX;
                if(dX > 0 && dX < 80) el.style.transform = `translateX(-${dX}px)`;
                if(Math.abs(sY - mY) > 10) clearTimeout(t);
            }
        };
        el.ontouchend = e => { clearTimeout(t); if(isDrag) { isDrag = false; el.classList.remove('dragging'); saveOrder(); } else { el.style.transform = (sX - e.changedTouches[0].clientX > 50) ? 'translateX(-70px)' : 'translateX(0)'; } };
    }

    function saveOrder() {
        const up = {}; document.querySelectorAll('#activeItems .item').forEach((el, i) => up[`${el.dataset.id}/order`] = Date.now() + i);
        listRef.update(up);
    }

    function openInfo(id) {
        currentId = id;
        listRef.child(id).once('value', snap => {
            const it = snap.val();
            document.getElementById('infoTitle').innerText = it.text;
            document.getElementById('noteDisplay').innerText = it.note || "Nincs megjegyzés";
            document.getElementById('noteEditArea').style.display = 'none';
            document.getElementById('noteBox').style.display = 'flex';
            const imgC = document.getElementById('infoPhotoCont');
            if(it.photo) { document.getElementById('infoPhotoImg').src = it.photo; imgC.style.display='block'; } else { imgC.style.display='none'; }
            document.getElementById('infoModal').style.display = 'flex';
        });
    }

    function deleteNoteData() { if(confirm("Törlöd?")) listRef.child(currentId).update({ note: "" }).then(()=>openInfo(currentId)); }
    function saveNoteData() { const n = document.getElementById('noteTextarea').value; listRef.child(currentId).update({ note: n }).then(()=>openInfo(currentId)); }
    function editNote() { document.getElementById('noteBox').style.display='none'; document.getElementById('noteEditArea').style.display='block'; document.getElementById('noteTextarea').value = document.getElementById('noteDisplay').innerText.replace("Nincs megjegyzés",""); }
    function updatePhotoData(i) { if(i.files && i.files[0]) { const r = new FileReader(); r.onload = e => listRef.child(currentId).update({ photo: e.target.result }).then(()=>openInfo(currentId)); r.readAsDataURL(i.files[0]); } }
    function deletePhotoData() { if(confirm("Törlöd?")) listRef.child(currentId).update({ photo: "" }).then(()=>openInfo(currentId)); }
    function previewNewPhoto(i) { if(i.files && i.files[0]) { const r = new FileReader(); r.onload = e => { tempPhotoData = e.target.result; const p = document.getElementById('newImgPreview'); p.src = tempPhotoData; p.style.display='block'; }; r.readAsDataURL(i.files[0]); } }
    function handleAddItem() {
        const t = document.getElementById('manualInput').value.trim();
        const n = document.getElementById('noteInput').value.trim();
        if(t) { listRef.push({ text: t, note: n, photo: tempPhotoData, status: 'active', order: Date.now() }); document.getElementById('manualInput').value = ''; document.getElementById('noteInput').value = ''; document.getElementById('newImgPreview').style.display='none'; tempPhotoData = ""; closeModal('inputModal'); }
    }
    function updateStat(id, s) { listRef.child(id).update({ status: s }); }
    function deleteFullItem(id) { if(confirm("Törlöd?")) listRef.child(id).remove(); }
</script>
</body>
</html>
