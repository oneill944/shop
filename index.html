<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bevásárló lista</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        :root { --bg: #000000; --card-bg: #121212; --item-bg: #1e1e1e; --text: #e0e0e0; --primary: #bb86fc; --success: #2e7d32; --danger: #c62828; --grey: #252525; --note: #ffa000; }
        body.light { --bg: #d1d1d6; --card-bg: #f0f0f7; --item-bg: #ffffff; --text: #1c1c1e; --primary: #5856d6; --success: #34c759; --danger: #ff3b30; --grey: #e5e5ea; --note: #e67e22; }
        
        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; touch-action: manipulation; user-select: none !important; -webkit-user-select: none !important; }
        input { user-select: text !important; -webkit-user-select: text !important; }
        body { background: var(--bg); color: var(--text); font-family: sans-serif; margin: 0; padding: 10px; display: flex; justify-content: center; min-height: 100vh; }
        
        .app-card { background: var(--card-bg); width: 100%; max-width: 380px; border-radius: 15px; padding: 15px; box-shadow: 0 8px 25px rgba(0,0,0,0.5); position: relative; align-self: flex-start; }
        .version { position: absolute; top: 8px; left: 15px; font-size: 8px; color: #444; }
        .header { text-align: center; margin-bottom: 12px; border-bottom: 1px solid #333; padding-bottom: 8px; padding-top: 10px; }
        .theme-btn { position: absolute; top: 10px; right: 15px; font-size: 20px; border: none; background: none; cursor: pointer; color: var(--text); }

        .btn-row { display: flex; gap: 8px; margin-bottom: 12px; }
        .main-btn { flex: 1; padding: 12px; border-radius: 10px; border: none; font-weight: bold; font-size: 12px; color: white; text-transform: uppercase; cursor: pointer; }
        
        .list-container { display: flex; flex-direction: column; gap: 6px; } /* Nagyobb hely a sorok közt */
        .bottom-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
        .column-label { text-align: center; font-size: 10px; font-weight: bold; margin-bottom: 6px; padding: 5px; border-radius: 5px; background: var(--grey); }

        /* SWIPE TÖRLÉS DESIGN */
        .item-wrapper { position: relative; overflow: hidden; border-radius: 8px; }
        .delete-reveal { position: absolute; right: 0; top: 0; bottom: 0; width: 60px; background: var(--danger); display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; z-index: 1; border-radius: 0 8px 8px 0; }
        
        .item { 
            background: var(--item-bg); 
            padding: 8px 12px; /* Nagyobb doboz belső */
            border-radius: 8px; 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            gap: 8px; 
            min-height: 44px; /* Fix nagyobb magasság */
            position: relative; 
            z-index: 2; 
            transition: transform 0.2s ease; 
        }
        
        .item.checked { background: var(--success) !important; color: white; }
        .item.cancelled { background: var(--danger) !important; color: white; }
        .item-text { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; pointer-events: none; }
        
        .actions { display: flex; gap: 5px; flex-shrink: 0; }
        .btn-sm { border: none; width: 32px; height: 32px; border-radius: 6px; display: flex; align-items: center; justify-content: center; color: white; cursor: pointer; background: rgba(255,255,255,0.12); font-size: 14px; }
        .has-note { color: var(--note) !important; }

        .custom-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.92); justify-content: center; align-items: flex-start; padding-top: 15vh; z-index: 2000; }
        .modal-content { background: var(--item-bg); padding: 20px; border-radius: 12px; width: 85%; max-width: 300px; border: 1px solid #333; }
        .modal-content input { width: 100%; padding: 12px; margin-bottom: 12px; border-radius: 8px; border: 1px solid #444; background: var(--bg); color: var(--text); font-size: 16px; outline: none; }
        
        .clear-all { background: none; color: var(--danger); border: 1px solid var(--danger); margin-top: 30px; width: 100%; padding: 10px; font-size: 10px; border-radius: 8px; font-weight: bold; opacity: 0.4; }
    </style>
</head>
<body class="dark">
<div class="app-card">
    <div class="version">v2.4</div>
    <button class="theme-btn" id="themeIcon" onclick="toggleTheme()">☀️</button>
    <div class="header"><h2 style="margin:0; font-size: 18px;">BEVÁSÁRLÓ LISTA</h2></div>
    <div class="btn-row">
        <button id="micBtn" class="main-btn" style="background: var(--primary);">🎤 HANG</button>
        <button id="writeBtn" class="main-btn" style="background: var(--grey); color: var(--text);">⌨️ ÍRÁS</button>
    </div>
    <div id="activeItems" class="list-container"></div>
    <div class="bottom-grid">
        <div><div class="column-label">TALÁLTAM</div><div id="doneItems" class="list-container"></div></div>
        <div><div class="column-label">NINCS</div><div id="missingItems" class="list-container"></div></div>
    </div>
    <button class="clear-all" onclick="clearAll()">LISTA TÖRLÉSE</button>
</div>

<div id="inputModal" class="custom-modal"><div class="modal-content"><input type="text" id="manualInput" placeholder="Termék..." autocomplete="off"><input type="text" id="noteInput" placeholder="Megjegyzés..." autocomplete="off"><div class="btn-row"><button class="main-btn" style="background:#444;" onclick="closeMainModal()">MÉGSE</button><button class="main-btn" style="background:var(--primary);" id="confirmBtn">OK</button></div></div></div>
<div id="editNoteModal" class="custom-modal"><div class="modal-content"><h4 id="editNoteTitle" style="margin-top:0"></h4><input type="text" id="editNoteValue" autocomplete="off"><input type="hidden" id="editNoteId"><div class="btn-row"><button class="main-btn" style="background:#444;" onclick="closeEditModal()">MÉGSE</button><button class="main-btn" style="background:var(--primary);" onclick="saveModalNote()">MENTÉS</button></div></div></div>

<script>
    const firebaseConfig = { apiKey: "AIzaSyC0fhL9VVErpN9LX6eJ8Tv5nuxF5Ea-qjE", databaseURL: "https://kozoslista-e0717-default-rtdb.europe-west1.firebasedatabase.app", projectId: "kozoslista-e0717" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const listRef = db.ref('shoppingList');
    let shoppingList = [];

    // ÍRÁS FÓKUSZ
    const writeBtn = document.getElementById('writeBtn');
    writeBtn.addEventListener('touchstart', (e) => { e.preventDefault(); document.getElementById('inputModal').style.display='flex'; document.getElementById('manualInput').focus(); });
    function closeMainModal() { document.getElementById('inputModal').style.display='none'; document.getElementById('manualInput').value=''; document.getElementById('noteInput').value=''; }
    document.getElementById('confirmBtn').onclick = () => { const v=document.getElementById('manualInput').value.trim(); const n=document.getElementById('noteInput').value.trim(); if(v){ listRef.push({text:v, note:n, status:'active', order:Date.now()}); closeMainModal(); } };

    listRef.on('value', snap => {
        const data = snap.val();
        shoppingList = data ? Object.keys(data).map(k => ({id:k, ...data[k]})) : [];
        renderAll();
    });

    function renderAll() {
        const containers = { active: document.getElementById('activeItems'), done: document.getElementById('doneItems'), x: document.getElementById('missingItems') };
        Object.values(containers).forEach(c => c.innerHTML = '');
        shoppingList.sort((a,b) => (a.order || 0) - (b.order || 0)).forEach(item => {
            const wrapper = document.createElement('div');
            wrapper.className = 'item-wrapper';
            wrapper.innerHTML = `<div class="delete-reveal" onclick="deleteItem('${item.id}')">Törlés</div>`;
            
            const div = document.createElement('div');
            div.className = `item ${item.status === 'done' ? 'checked' : (item.status === 'x' ? 'cancelled' : '')}`;
            div.dataset.id = item.id;
            div.innerHTML = `
                <span class="item-text">${item.text}</span>
                <div class="actions">
                    <button class="btn-sm ${item.note ? 'has-note' : ''}" onclick="handleInfoClick('${item.id}','${item.note||''}','${item.text}')">ℹ️</button>
                    ${item.status==='active' ? `<button class="btn-sm" style="background:#4caf50" onclick="updateStatus('${item.id}','done')">✔</button><button class="btn-sm" style="background:#f44336" onclick="updateStatus('${item.id}','x')">✖</button>` : `<button class="btn-sm" style="background:#555" onclick="updateStatus('${item.id}','active')">↩</button>`}
                </div>`;

            // SWIPE LOGIKA
            let startX = 0;
            div.ontouchstart = (e) => { startX = e.touches[0].clientX; };
            div.ontouchmove = (e) => { 
                let diff = startX - e.touches[0].clientX;
                if (diff > 0 && diff < 80) div.style.transform = `translateX(-${diff}px)`;
            };
            div.ontouchend = (e) => { 
                let diff = startX - e.changedTouches[0].clientX;
                div.style.transform = diff > 50 ? `translateX(-60px)` : `translateX(0)`;
            };

            wrapper.appendChild(div);
            containers[item.status === 'active' ? 'active' : (item.status === 'done' ? 'done' : 'x')].appendChild(wrapper);
        });
    }

    function handleInfoClick(id, note, title) {
        if(!note) { 
            const n = prompt("Megjegyzés hozzáadása:", "");
            if(n !== null) listRef.child(id).update({note: n});
        } else {
            document.getElementById('editNoteTitle').innerText = title;
            document.getElementById('editNoteValue').value = note;
            document.getElementById('editNoteId').value = id;
            document.getElementById('editNoteModal').style.display='flex';
        }
    }
    function saveModalNote() { listRef.child(document.getElementById('editNoteId').value).update({note: document.getElementById('editNoteValue').value}); closeEditModal(); }
    function closeEditModal() { document.getElementById('editNoteModal').style.display='none'; }
    function updateStatus(id, s) { listRef.child(id).update({status: s}); }
    function deleteItem(id) { if(confirm("Törlöd a terméket?")) listRef.child(id).remove(); }
    function toggleTheme() { document.body.classList.toggle('light'); document.getElementById('themeIcon').innerText = document.body.classList.contains('light') ? '🌙' : '☀️'; }
    function clearAll() { if(confirm("Mindent törölsz?")) listRef.remove(); }
</script>
</body>
</html>
