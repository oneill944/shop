<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bevásárló lista</title>
    <link rel="apple-touch-icon" href="IMG_4302.png">
    <link rel="icon" type="image/png" href="IMG_4302.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    
    <style>
        :root { --bg: #0b0b0b; --card-bg: #1a1a1a; --item-bg: #262626; --text: #f0f0f0; --primary: #a87ff3; --success: #32a852; --danger: #eb4034; --grey: #333; --border: #444; }
        .light-mode { --bg: #d1d1d6; --card-bg: #f0f0f7; --item-bg: #ffffff; --text: #1c1c1e; --primary: #5856d6; --success: #34c759; --danger: #d66d6d; --grey: #e5e5ea; --border: #c7c7cc; }
        
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: -apple-system, sans-serif; user-select: none; -webkit-user-select: none; }
        body { background: var(--bg); color: var(--text); margin: 0; padding: 10px; display: flex; justify-content: center; min-height: 100vh; transition: background 0.3s; }
        .app-card { background: var(--card-bg); width: 100%; max-width: 400px; border-radius: 20px; padding: 15px; align-self: flex-start; }
        
        .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; }
        .version-label { font-size: 10px; opacity: 0.2; }

        .notif-status-bar { text-align: center; margin-bottom: 15px; }
        .notif-btn-text { background: none; border: none; color: var(--primary); font-size: 11px; font-weight: bold; cursor: pointer; text-decoration: underline; opacity: 0.7; }
        .notif-btn-text.off { color: #888; }

        .col-label { font-size: 10px; text-align: center; color: #aaa; margin: 10px auto 8px; text-transform: uppercase; background: var(--grey); padding: 4px 12px; border-radius: 20px; display: table; }
        .list-container { display: flex; flex-direction: column; gap: 8px; width: 100%; }
        
        .item-wrapper { position: relative; border-radius: 10px; overflow: hidden; width: 100%; }
        .delete-btn-bg { position: absolute; right: 0; top: 0; bottom: 0; width: 80px; background: var(--danger); color: white; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: bold; z-index: 1; }

        .item { background: var(--item-bg); padding: 10px 12px; border-radius: 10px; display: flex; align-items: center; gap: 10px; position: relative; z-index: 5; transition: transform 0.2s; border: 1px solid transparent; touch-action: pan-y; width: 100%; }
        .item span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 15px; }
        
        .status-done { border: 1.5px solid var(--success) !important; }
        .status-x { border: 1.5px solid var(--danger) !important; }
        
        .btn-sm { width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.1); color: white; border: none; flex-shrink: 0; }
        .has-data { border: 1px solid var(--danger) !important; }

        .bottom-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 15px; width: 100%; }

        .custom-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 2000; justify-content: center; align-items: center; padding: 20px; }
        .modal-content { background: var(--card-bg); width: 100%; max-width: 360px; border-radius: 24px; padding: 35px 20px 25px; border: 1px solid var(--border); max-height: 90vh; overflow-y: auto; position: relative; }
        .close-x { position: absolute; top: 10px; right: 20px; font-size: 28px; color: var(--danger); cursor: pointer; }
        
        input, textarea { width: 100%; padding: 12px; margin-bottom: 10px; border-radius: 10px; border: 1px solid var(--border); background: #000; color: #fff; font-size: 16px; outline: none; }
        .action-btn { width: 100%; padding: 15px; border-radius: 12px; border: none; background: var(--primary); color: white; font-weight: bold; cursor: pointer; }
        .img-preview-box { width: 100%; border-radius: 10px; margin: 10px 0; border: 1px solid var(--border); }
    </style>
</head>
<body class="dark">

<div class="app-card">
    <div class="header-top">
        <button onclick="toggleMode()" style="background:none; border:none; font-size:20px;">🌓</button>
        <div class="version-label">v0.9.8</div>
        <button onclick="clearAllItems()" style="background:none; border:none; font-size:18px; opacity:0.2;">🗑️</button>
    </div>
    
    <h2 style="text-align:center; font-size:19px; margin:0; letter-spacing:1px;">BEVÁSÁRLÓ LISTA</h2>
    <div class="notif-status-bar">
        <button id="notifBtn" class="notif-btn-text" onclick="toggleNotifications()">Értesítések bekapcsolása</button>
    </div>

    <button onclick="openModal('inputModal')" style="width:100%; padding:15px; border-radius:12px; border:none; background:var(--grey); color:var(--text); font-weight:bold; margin-bottom:20px;">HOZZÁADÁS</button>

    <div class="col-label">Aktív tételek</div>
    <div id="activeItems" class="list-container"></div>

    <div class="bottom-grid">
        <div><div class="col-label">Megvan</div><div id="doneItems" class="list-container"></div></div>
        <div><div class="col-label">Nincs</div><div id="missingItems" class="list-container"></div></div>
    </div>
</div>

<div id="inputModal" class="custom-modal"><div class="modal-content"><div class="close-x" onclick="closeModal('inputModal')">×</div><input type="text" id="manualInput" placeholder="Termék neve..."><textarea id="manualNote" placeholder="Megjegyzés..."></textarea><label style="display:block; text-align:center; padding:12px; background:#333; border-radius:10px; margin-bottom:10px; cursor:pointer;">📷 Fotó hozzáadása<input type="file" id="newPhotoFile" accept="image/*" style="display:none" onchange="previewPhoto(this, 'newPhotoPreview')"></label><img id="newPhotoPreview" class="img-preview-box" style="display:none;"><button class="action-btn" onclick="addItem()">HOZZÁADÁS</button></div></div>

<div id="infoModal" class="custom-modal"><div class="modal-content"><div class="close-x" onclick="closeModal('infoModal')">×</div><h3 id="infoTitle" style="text-align:center;"></h3><div id="viewArea"><div id="noteDisplay" style="background:rgba(255,255,255,0.05); padding:15px; border-radius:10px; text-align:center; margin-bottom:10px;"></div><img id="infoPhotoImg" class="img-preview-box" style="display:none;"><button class="action-btn" onclick="closeModal('infoModal')">BEZÁRÁS</button></div></div></div>

<script>
    const firebaseConfig = { apiKey: "AIzaSyC0fhL9VVErpN9LX6eJ8Tv5nuxF5Ea-qjE", databaseURL: "https://kozoslista-e0717-default-rtdb.europe-west1.firebasedatabase.app", projectId: "kozoslista-e0717" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database(), listRef = db.ref('shoppingList');
    let isInitialLoad = true, tempPhotoData = "", notificationsEnabled = localStorage.getItem('notifications') === 'true';

    function toggleMode() { document.body.classList.toggle('light-mode'); }
    
    function updateNotifUI() {
        const btn = document.getElementById('notifBtn');
        if (notificationsEnabled) { btn.innerText = "Értesítések: BE"; btn.classList.remove('off'); }
        else { btn.innerText = "Értesítések: KI (Bekapcsoláshoz kattints ide)"; btn.classList.add('off'); }
    }
    updateNotifUI();

    function toggleNotifications() {
        if (!notificationsEnabled) {
            Notification.requestPermission().then(perm => {
                if (perm === "granted") { notificationsEnabled = true; localStorage.setItem('notifications', 'true'); updateNotifUI(); }
            });
        } else { notificationsEnabled = false; localStorage.setItem('notifications', 'false'); updateNotifUI(); }
    }

    listRef.on('child_added', snap => {
        // Fontos: Minden értesítés egyedi ID-t kap (tag), így nem "nyomják el" egymást
        if (!isInitialLoad && notificationsEnabled && snap.val().status === 'active' && document.visibilityState !== 'visible') {
            new Notification("Új termék!", { 
                body: snap.val().text, 
                icon: 'IMG_4302.png',
                tag: 'item-' + Date.now(), // Egyedi azonosító a sorozatos üzenetekhez
                renotify: true 
            });
        }
    });

    listRef.on('value', snap => {
        const d = snap.val();
        render(d ? Object.keys(d).map(k => ({id:k, ...d[k]})) : []);
        if (isInitialLoad) setTimeout(() => { isInitialLoad = false; }, 2000);
    });

    function render(items) {
        const containers = { active: 'activeItems', done: 'doneItems', x: 'missingItems' };
        Object.values(containers).forEach(id => document.getElementById(id).innerHTML = '');
        items.sort((a,b) => a.order - b.order).forEach(it => {
            const wrap = document.createElement('div'); wrap.className = 'item-wrapper';
            const del = document.createElement('div'); del.className = 'delete-btn-bg'; del.innerText = 'TÖRLÉS'; del.onclick = () => listRef.child(it.id).remove();
            const div = document.createElement('div'); div.className = `item ${it.status==='done'?'status-done':it.status==='x'?'status-x':''}`;
            const hasExtra = (it.note && it.note.trim()) || it.photo;
            
            div.innerHTML = `<span>${it.text}</span><div style="display:flex; gap:5px;"><button class="btn-sm ${hasExtra?'has-data':''}" onclick="openInfo('${it.id}')">ℹ️</button>${it.status==='active'?`<button class="btn-sm" style="background:var(--success)" onclick="listRef.child('${it.id}').update({status:'done'})">✔</button><button class="btn-sm" style="background:var(--danger)" onclick="listRef.child('${it.id}').update({status:'x'})">✖</button>`:`<button class="btn-sm" onclick="listRef.child('${it.id}').update({status:'active'})">↩</button>`}</div>`;
            
            let sX = 0, cX = 0, isD = false;
            div.addEventListener('touchstart', e => { sX = e.touches[0].clientX; div.style.transition = 'none'; }, {passive:true});
            div.addEventListener('touchmove', e => { let d = sX - e.touches[0].clientX; if(d > 10){ isD=true; cX = Math.min(d, 85); div.style.transform = `translateX(-${cX}px)`; } }, {passive:true});
            div.addEventListener('touchend', () => { div.style.transition = 'transform 0.3s'; div.style.transform = (isD && cX > 50) ? 'translateX(-80px)' : 'translateX(0)'; });
            
            wrap.appendChild(del); wrap.appendChild(div);
            document.getElementById(containers[it.status] || 'activeItems').appendChild(wrap);
        });
    }

    function addItem() {
        const val = document.getElementById('manualInput').value.trim();
        if(val) { listRef.push({ text: val, note: document.getElementById('manualNote').value, photo: tempPhotoData, status: 'active', order: Date.now() }); closeModal('inputModal'); }
    }

    function openInfo(id) {
        listRef.child(id).once('value', snap => {
            const it = snap.val(); document.getElementById('infoTitle').innerText = it.text;
            document.getElementById('noteDisplay').innerText = it.note || "Nincs megjegyzés.";
            const img = document.getElementById('infoPhotoImg'); if(it.photo){ img.src = it.photo; img.style.display='block'; } else img.style.display='none';
            openModal('infoModal');
        });
    }

    function previewPhoto(input, pId) { if(input.files && input.files[0]) { const r = new FileReader(); r.onload = e => { tempPhotoData = e.target.result; const p = document.getElementById(pId); p.src = tempPhotoData; p.style.display='block'; }; r.readAsDataURL(input.files[0]); } }
    function openModal(id) { document.getElementById(id).style.display = 'flex'; }
    function closeModal(id) { document.getElementById(id).style.display = 'none'; tempPhotoData = ""; }
    function clearAllItems() { if(confirm("Mindent törölsz?")) listRef.remove(); }

    new Sortable(document.getElementById('activeItems'), { animation: 150, onEnd: () => {
        document.querySelectorAll('#activeItems .item-wrapper').forEach((el, index) => listRef.child(el.getAttribute('data-id')).update({ order: Date.now() + index }));
    }});
</script>
</body>
</html>
