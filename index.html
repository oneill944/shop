<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Micro Shop List</title>
    <style>
        :root {
            --bg: #121212; --card: #1e1e1e; --text: #e0e0e0;
            --primary: #bb86fc; --success: #2e7d32; --danger: #c62828; --grey: #3a3a3c;
        }
        * {
            -webkit-tap-highlight-color: transparent;
            user-select: none; -webkit-user-select: none;
            -webkit-touch-callout: none;
        }
        
        body { background: var(--bg); color: var(--text); font-family: sans-serif; margin: 0; padding: 6px; overflow: hidden; }
        
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; }
        .btn-row { display: flex; gap: 4px; margin-bottom: 6px; }
        .main-btn { flex: 1; padding: 8px; border-radius: 6px; border: none; font-weight: bold; cursor: pointer; font-size: 11px; color: white; text-transform: uppercase; }
        
        /* MÉG KISEBB MODAL */
        #inputModal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); justify-content: center; padding-top: 15px; z-index: 1000;
        }
        .modal-content { 
            background: var(--card); padding: 8px; border-radius: 10px; width: 75%; max-width: 260px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.5); border: 1px solid #333;
        }
        .modal-content input {
            width: 85%; padding: 8px; margin: 5px 0; border-radius: 4px; border: 1px solid #444;
            background: #2a2a2a; color: white; font-size: 16px; outline: none; display: block; margin-left: auto; margin-right: auto;
            user-select: text !important; -webkit-user-select: text !important;
        }

        .list-container { display: flex; flex-direction: column; gap: 3px; }
        .item { 
            background: var(--card); padding: 5px 8px; border-radius: 5px; 
            display: flex; align-items: center; gap: 5px; touch-action: none;
        }
        .item.checked { background: var(--success) !important; }
        .item.cancelled { background: var(--danger) !important; }
        .item.dragging { opacity: 0.3; border: 1px dashed #fff; }
        
        .item-text { flex-grow: 1; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; pointer-events: none; }
        
        .actions { display: flex; gap: 2px; }
        .btn-sm { border: none; width: 26px; height: 26px; border-radius: 4px; cursor: pointer; font-size: 13px; display: flex; align-items: center; justify-content: center; color: white; }
        .btn-check { background: #4caf50; }
        .btn-x { background: #f44336; } 
        .btn-grey { background: var(--grey); }
        
        .summary-title { margin-top: 10px; border-top: 1px solid #333; padding-top: 5px; font-size: 9px; color: #666; letter-spacing: 1px; }
        .clear-all { background: none; color: #ff5252; border: 1px solid #ff5252; margin-top: 8px; width: 100%; padding: 4px; font-size: 10px; }
    </style>
</head>
<body>

    <div class="header"><h5 style="margin:0">LISTA</h5></div>

    <div class="btn-row">
        <button id="micBtn" class="main-btn" style="background: var(--primary);">🎤 HANG</button>
        <button id="writeBtn" class="main-btn" style="background: var(--grey);" onmousedown="quickOpen()" ontouchstart="quickOpen()">⌨️ ÍRÁS</button>
    </div>

    <div id="activeItems" class="list-container"></div>
    <div class="summary-title">ÖSSZESÍTÉS</div>
    <div id="doneItems" class="list-container"></div>
    <button class="main-btn clear-all" onclick="clearAll()">🗑️ ÜRÍTÉS</button>

    <div id="inputModal">
        <div class="modal-content">
            <input type="text" id="manualInput" placeholder="..." autocomplete="off">
            <div class="btn-row" style="margin-bottom:0">
                <button class="main-btn" style="background:#444; padding:5px" onclick="closeModal()">MÉGSE</button>
                <button class="main-btn" style="background:var(--primary); padding:5px" onclick="handleManualAdd()">OK</button>
            </div>
        </div>
    </div>

    <script>
        let shoppingList = JSON.parse(localStorage.getItem('myShoppingList')) || [];
        let isRecording = false;
        let recognition;

        window.onload = renderAll;

        // TRÜKKÖS NYITÁS: Azonnali fókusz az érintés pillanatában
        function quickOpen() {
            const modal = document.getElementById('inputModal');
            const input = document.getElementById('manualInput');
            modal.style.display = 'flex';
            input.focus();
        }

        function closeModal() {
            document.getElementById('inputModal').style.display = 'none';
            document.getElementById('manualInput').value = '';
        }

        function handleManualAdd() {
            const val = document.getElementById('manualInput').value.trim();
            if(val) { addItem(val); closeModal(); }
        }

        document.getElementById('manualInput').addEventListener("keypress", (e) => { if (e.key === "Enter") handleManualAdd(); });

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.lang = 'hu-HU';
            recognition.onresult = (e) => { addItem(e.results[0][0].transcript); stopRecording(); };
            recognition.onend = () => { if(isRecording) stopRecording(); };
        }

        document.getElementById('micBtn').onclick = () => {
            if (!isRecording) {
                isRecording = true;
                recognition.start();
                document.getElementById('micBtn').innerText = "🛑 STOP";
                document.getElementById('micBtn').style.background = "#ff5252";
            } else { stopRecording(); }
        };

        function stopRecording() {
            isRecording = false;
            if(recognition) recognition.stop();
            document.getElementById('micBtn').innerText = "🎤 HANG";
            document.getElementById('micBtn').style.background = "var(--primary)";
        }

        function addItem(text) {
            shoppingList.push({ id: Date.now(), text: text, status: 'active' });
            saveAndRender();
        }

        function updateStatus(id, newStatus) {
            const i = shoppingList.findIndex(x => x.id === id);
            if(i !== -1) { shoppingList[i].status = newStatus; saveAndRender(); }
        }

        function deleteItem(id) {
            shoppingList = shoppingList.filter(x => x.id !== id);
            saveAndRender();
        }

        function saveAndRender() {
            localStorage.setItem('myShoppingList', JSON.stringify(shoppingList));
            renderAll();
        }

        function renderAll() {
            const act = document.getElementById('activeItems');
            const don = document.getElementById('doneItems');
            act.innerHTML = ''; don.innerHTML = '';

            shoppingList.forEach(item => {
                const div = document.createElement('div');
                div.className = `item ${item.status !== 'active' ? (item.status === 'done' ? 'checked' : 'cancelled') : ''}`;
                div.dataset.id = item.id;
                
                div.innerHTML = `
                    <span class="item-text">${item.text}</span>
                    <div class="actions">
                        ${item.status === 'active' ? `
                            <button class="btn-sm btn-check" onclick="updateStatus(${item.id}, 'done')">✔</button>
                            <button class="btn-sm btn-x" onclick="updateStatus(${item.id}, 'x')">✖</button>
                        ` : `
                            <button class="btn-sm btn-grey" onclick="updateStatus(${item.id}, 'active')">↩</button>
                        `}
                        <button class="btn-sm btn-grey" onclick="deleteItem(${item.id})">🗑</button>
                    </div>
                `;

                if(item.status === 'active') {
                    div.addEventListener('touchstart', (e) => { div.classList.add('dragging'); }, {passive: true});
                    div.addEventListener('touchmove', (e) => {
                        if(!div.classList.contains('dragging')) return;
                        const target = getDragAfterElement(act, e.touches[0].clientY);
                        if (!target) act.appendChild(div);
                        else act.insertBefore(div, target);
                        e.preventDefault();
                    }, {passive: false});
                    div.addEventListener('touchend', () => { div.classList.remove('dragging'); reorderList(); });
                }

                (item.status === 'active' ? act : don).appendChild(div);
            });
        }

        function getDragAfterElement(container, y) {
            const draggables = [...container.querySelectorAll('.item:not(.dragging)')];
            return draggables.reduce((closest, child) => {
                const box = child.getBoundingClientRect();
                const offset = y - box.top - box.height / 2;
                if (offset < 0 && offset > closest.offset) return { offset: offset, element: child };
                else return closest;
            }, { offset: Number.NEGATIVE_INFINITY }).element;
        }

        function reorderList() {
            const newOrder = [];
            document.querySelectorAll('#activeItems .item').forEach(el => {
                newOrder.push(shoppingList.find(x => x.id == el.dataset.id));
            });
            shoppingList = [...newOrder, ...shoppingList.filter(x => x.status !== 'active')];
            localStorage.setItem('myShoppingList', JSON.stringify(shoppingList));
        }

        function clearAll() { if(confirm("Üríted?")) { shoppingList = []; saveAndRender(); } }
    </script>
</body>
</html>
