<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lista Pro v0.1.2</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        :root { --bg: #0b0b0b; --card-bg: #1a1a1a; --item-bg: #262626; --text: #f0f0f0; --primary: #a87ff3; --success: #32a852; --danger: #eb4034; --grey: #333; --yellow: #ffff00; }
        body.light { --bg: #e5e5ea; --card-bg: #ffffff; --item-bg: #f2f2f7; --text: #000000; --primary: #5856d6; --grey: #d1d1d6; }
        
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: sans-serif; user-select: none; -webkit-user-select: none; }
        input, textarea { user-select: text; -webkit-user-select: text; }

        body { background: var(--bg); color: var(--text); margin: 0; padding: 10px; display: flex; justify-content: center; min-height: 100vh; transition: 0.3s; }
        .app-card { background: var(--card-bg); width: 100%; max-width: 400px; border-radius: 20px; padding: 15px; position: relative; align-self: flex-start; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .version { font-size: 10px; color: #555; }
        .top-icons { display: flex; gap: 15px; align-items: center; font-size: 20px; }

        .header { text-align: center; padding-bottom: 15px; border-bottom: 1px solid #333; margin-bottom: 15px; }
        #notifBtn { font-size: 11px; padding: 6px 15px; border-radius: 20px; border: 1px solid #444; background: #222; color: #888; cursor: pointer; }

        .list-container { display: flex; flex-direction: column; gap: 8px; min-height: 40px; }
        .item-wrapper { position: relative; border-radius: 10px; overflow: hidden; }
        
        .item { background: var(--item-bg); padding: 10px 12px; border-radius: 10px; display: flex; align-items: center; gap: 10px; position: relative; z-index: 2; transition: transform 0.2s; touch-action: none; }
        .drag-handle { cursor: grab; color: #555; font-size: 18px; padding-right: 5px; }
        
        #doneItems .item { background: var(--success) !important; color: white; }
        #missingItems .item { background: var(--danger) !important; color: white; }

        .btn-sm { border: none; width: 34px; height: 34px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 16px; color: white; cursor: pointer; background: rgba(255,255,255,0.1); }
        .has-note { background: var(--yellow) !important; color: #000 !important; }
        
        .col-header { display: flex; justify-content: center; align-items: center; background: rgba(0,0,0,0.2); padding: 5px 10px; border-radius: 8px; margin-bottom: 8px; }
        .column-label { font-size: 10px; font-weight: bold; color: #777; letter-spacing: 1px; }

        .custom-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 2000; justify-content: center; align-items: center; padding: 20px; }
        .modal-content { background: var(--card-bg); width: 100%; max-width: 320px; border-radius: 15px; padding: 25px 20px 20px; position: relative; border: 1px solid #444; }
        .close-x { position: absolute; top: -15px; right: -15px; background: var(--danger); color: white; width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: bold; cursor: pointer; z-index: 2100; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }

        input, textarea { width: 100%; padding: 12px; margin-bottom: 10px; border-radius: 10px; border: 1px solid #444; background: #000; color: #fff; font-size: 16px; outline: none; resize: none; }
        .delete-reveal { position: absolute; right: 0; top: 0; bottom: 0; width: 70px; background: var(--danger); display: flex; align-items: center; justify-content: center; color: white; font-size: 11px; z-index: 1; font-weight: bold; }
    </style>
</head>
<body class="dark">

<div class="app-card">
    <div class="top-bar">
        <div class="version">v0.1.2</div>
        <div class="top-icons">
            <span onclick="document.body.classList.toggle('light')" style="cursor:pointer;">🌓</span>
            <span onclick="if(confirm('Mindent törölsz?')) listRef.remove()" style="cursor:pointer;">🗑️</span>
        </div>
    </div>
    
    <div class="header">
        <h2 style="margin:0 0 10px; font-size: 18px; letter-spacing: 1px;">KÖZÖS LISTA</h2>
        <button id="notifBtn" onclick="askNotif()">🔔 Értesítések</button>
    </div>

    <div style="display:flex; gap:10px; margin-bottom:20px;">
        <button id="micBtn" style="flex:1; padding:15px; border-radius:12px; border:none; background:var(--primary); color:white; font-weight:bold;">🎤 HANG</button>
        <button onclick="openModal('inputModal')" style="flex:1; padding:15px; border-radius:12px; border:none; background:var(--grey); color:white; font-weight:bold;">⌨️ ÍRÁS</button>
    </div>

    <div id="activeItems" class="list-container"></div>

    <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px; margin-top:25px;">
        <div>
            <div class="col-header"><span class="column-label">MEGVAN</span></div>
            <div id="doneItems" class="list-container"></div>
        </div>
        <div>
            <div class="col-header"><span class="column-label">NINCS</span></div>
            <div id="missingItems" class="list-container"></div>
        </div>
    </div>
</div>

<div id="inputModal" class="custom-modal">
    <div class="modal-content">
        <div class="close-x" onclick="closeModal('inputModal')">✕</div>
        <input type="text" id="manualInput" placeholder="Termék neve...">
        <textarea id="manualNote" placeholder="Megjegyzés (opcionális)..." rows="3"></textarea>
        <button onclick="addItem()" style="width:100%; padding:15px; border-radius:10px; border:none; background:var(--primary); color:white; font-weight:bold;">MEHET</button>
    </div>
</div>

<div id="noteModal" class="custom-modal">
    <div class="modal-content">
        <div class="close-x" onclick="closeModal('noteModal')">✕</div>
        <h3 id="noteItemTitle" style="margin-top:0; font-size:16px;"> Megjegyzés</h3>
        <textarea id="editNoteText" rows="4"></textarea>
        <button onclick="saveNote()" style="width:100%; padding:12px; border-radius:10px; border:none; background:var(--primary); color:white; font-weight:bold;">MENTÉS</button>
    </div>
</div>

<script>
    const firebaseConfig = { apiKey: "AIzaSyC0fhL9VVErpN9LX6eJ8Tv5nuxF5Ea-qjE", databaseURL: "https://kozoslista-e0717-default-rtdb.europe-west1.firebasedatabase.app", projectId: "kozoslista-e0717" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const listRef = db.ref('shoppingList');

    let currentEditId = null;

    function openModal(id) { document.getElementById(id).style.display = 'flex'; }
    function closeModal(id) { document.getElementById(id).style.display = 'none'; }

    function addItem() {
        const t = document.getElementById('manualInput').value.trim();
        const n = document.getElementById('manualNote').value.trim();
        if(t) { 
            listRef.push({ text: t, note: n, status: 'active', order: Date.now() }); 
            closeModal('inputModal'); 
            document.getElementById('manualInput').value=""; 
            document.getElementById('manualNote').value=""; 
        }
    }

    function openNote(id, text, note) {
        currentEditId = id;
        document.getElementById('noteItemTitle').innerText = text;
        document.getElementById('editNoteText').value = note || "";
        openModal('noteModal');
    }

    function saveNote() {
        if(currentEditId) {
            const newNote = document.getElementById('editNoteText').value.trim();
            listRef.child(currentEditId).update({ note: newNote });
            closeModal('noteModal');
        }
    }

    function askNotif() {
        Notification.requestPermission().then(p => { if(p==='granted') document.getElementById('notifBtn').style.background = 'var(--success)'; });
    }

    listRef.on('value', snap => {
        const data = snap.val();
        const items = data ? Object.keys(data).map(k => ({id:k, ...data[k]})) : [];
        render(items);
    });

    function render(items) {
        const containers = { active: document.getElementById('activeItems'), done: document.getElementById('doneItems'), x: document.getElementById('missingItems') };
        Object.values(containers).forEach(c => c.innerHTML = '');

        items.sort((a,b) => a.order - b.order).forEach(it => {
            const wrap = document.createElement('div');
            wrap.className = 'item-wrapper';
            wrap.innerHTML = `<div class="delete-reveal" onclick="db.ref('shoppingList/${it.id}').remove()">TÖRLÉS</div>`;
            
            const div = document.createElement('div');
            div.className = 'item';
            div.dataset.id = it.id;
            
            const handle = it.status === 'active' ? `<div class="drag-handle">≡</div>` : '';
            const noteClass = it.note ? 'has-note' : '';
            
            div.innerHTML = `${handle}<span style="flex:1">${it.text}</span>
                <div style="display:flex; gap:5px;">
                    <button class="btn-sm ${noteClass}" onclick="openNote('${it.id}', '${it.text}', '${it.note || ''}')">ℹ️</button>
                    ${it.status === 'active' ? 
                    `<button class="btn-sm" style="background:var(--success)" onclick="db.ref('shoppingList/${it.id}').update({status:'done'})">✔</button>
                     <button class="btn-sm" style="background:var(--danger)" onclick="db.ref('shoppingList/${it.id}').update({status:'x'})">✖</button>` : 
                    `<button class="btn-sm" onclick="db.ref('shoppingList/${it.id}').update({status:'active'})">↩</button>`}
                </div>`;
            
            if(it.status === 'active') initSortable(div, wrap);
            initSwipe(div);

            wrap.appendChild(div);
            if(containers[it.status]) containers[it.status].appendChild(wrap);
        });
    }

    function initSwipe(el) {
        let sX = 0;
        el.addEventListener('touchstart', e => sX = e.touches[0].clientX);
        el.addEventListener('touchmove', e => { 
            let dX = sX - e.touches[0].clientX; 
            if(dX > 20 && dX < 90) el.style.transform = `translateX(-${dX}px)`; 
        });
        el.addEventListener('touchend', e => el.style.transform = (sX - e.changedTouches[0].clientX > 50) ? 'translateX(-75px)' : 'translateX(0)');
    }

    function initSortable(el, wrap) {
        const handle = el.querySelector('.drag-handle');
        handle.addEventListener('pointerdown', e => {
            const cont = document.getElementById('activeItems');
            el.setPointerCapture(e.pointerId);
            wrap.style.opacity = "0.5";
            const onMove = ev => {
                const after = [...cont.querySelectorAll('.item-wrapper')].reduce((closest, child) => {
                    if(child === wrap) return closest;
                    const box = child.getBoundingClientRect();
                    const offset = ev.clientY - box.top - box.height/2;
                    return (offset < 0 && offset > closest.offset) ? { offset, element: child } : closest;
                }, { offset: Number.NEGATIVE_INFINITY }).element;
                if(after) cont.insertBefore(wrap, after); else cont.appendChild(wrap);
            };
            const onUp = () => {
                wrap.style.opacity = "1";
                handle.releasePointerCapture(e.pointerId);
                document.removeEventListener('pointermove', onMove);
                document.removeEventListener('pointerup', onUp);
                const updates = {};
                document.querySelectorAll('#activeItems .item').forEach((item, i) => updates[item.dataset.id + '/order'] = Date.now() + i);
                listRef.update(updates);
            };
            document.addEventListener('pointermove', onMove);
            document.addEventListener('pointerup', onUp);
        });
    }
</script>
</body>
</html>
