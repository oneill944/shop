<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lista Pro v0.8</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        :root { --bg: #0b0b0b; --card-bg: #1a1a1a; --item-bg: #262626; --text: #f0f0f0; --primary: #a87ff3; --success: #32a852; --danger: #eb4034; --grey: #333; --yellow: #ffff00; }
        body.light { --bg: #e5e5ea; --card-bg: #ffffff; --item-bg: #f2f2f7; --text: #000000; --primary: #5856d6; --grey: #d1d1d6; }
        
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: sans-serif; user-select: none; }
        input, textarea { user-select: text; -webkit-user-select: text; }

        body { background: var(--bg); color: var(--text); margin: 0; padding: 10px; display: flex; justify-content: center; min-height: 100vh; transition: 0.3s; }
        .app-card { background: var(--card-bg); width: 100%; max-width: 400px; border-radius: 20px; padding: 15px; position: relative; align-self: flex-start; }
        
        .top-icons { display: flex; justify-content: flex-end; gap: 15px; margin-bottom: 5px; font-size: 20px; }
        .header { text-align: center; border-bottom: 1px solid #333; margin-bottom: 15px; padding-bottom: 10px; }

        .list-container { display: flex; flex-direction: column; gap: 8px; min-height: 20px; }
        .item-wrapper { position: relative; border-radius: 10px; overflow: hidden; margin-bottom: 2px; }
        .item { background: var(--item-bg); padding: 10px 12px; border-radius: 10px; display: flex; align-items: center; gap: 8px; position: relative; z-index: 2; transition: transform 0.2s; touch-action: none; }
        
        .drag-handle { cursor: grab; color: #444; font-size: 20px; padding-right: 5px; }
        .btn-sm { border: none; width: 36px; height: 36px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 17px; color: white; cursor: pointer; background: rgba(255,255,255,0.1); }
        .has-data { background: var(--yellow) !important; color: #000 !important; }

        #doneItems .item { background: var(--success) !important; color: white; }
        #missingItems .item { background: var(--danger) !important; color: white; }

        .custom-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 2000; justify-content: center; align-items: center; padding: 20px; }
        .modal-content { background: var(--card-bg); width: 100%; max-width: 330px; border-radius: 18px; padding: 30px 20px 20px; position: relative; border: 1px solid #444; }
        .close-x { position: absolute; top: -15px; right: -15px; background: var(--danger); color: white; width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: bold; cursor: pointer; z-index: 2100; }

        input, textarea { width: 100%; padding: 12px; margin-bottom: 10px; border-radius: 10px; border: 1px solid #444; background: #000; color: #fff; font-size: 16px; outline: none; }
        .delete-reveal { position: absolute; right: 0; top: 0; bottom: 0; width: 75px; background: var(--danger); display: flex; align-items: center; justify-content: center; color: white; font-size: 11px; z-index: 1; font-weight: bold; }
        
        @keyframes pulse { 50% { background: red; } }
        .recording { animation: pulse 1s infinite; }
    </style>
</head>
<body class="dark">

<div class="app-card">
    <div class="top-icons">
        <span onclick="document.body.classList.toggle('light')" style="cursor:pointer;">🌓</span>
        <span onclick="if(confirm('Mindent törölsz?')) listRef.remove()" style="cursor:pointer;">🗑️</span>
    </div>
    
    <div class="header">
        <h2 style="margin:0 0 10px; font-size: 18px;">KÖZÖS LISTA</h2>
        <button id="notifBtn" onclick="toggleNotif()" style="font-size:11px; padding:5px 12px; border-radius:15px; border:1px solid #444; background:#222; color:#888;">🔔 Értesítések</button>
    </div>

    <div style="display:flex; gap:10px; margin-bottom:20px;">
        <button id="micBtn" onclick="startVoice()" style="flex:1; padding:15px; border-radius:12px; border:none; background:var(--primary); color:white; font-weight:bold;">🎤 HANG</button>
        <button onclick="openModal('addModal')" style="flex:1; padding:15px; border-radius:12px; border:none; background:var(--grey); color:white; font-weight:bold;">ÍRÁS</button>
    </div>

    <div id="activeItems" class="list-container"></div>

    <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px; margin-top:25px;">
        <div id="doneItems" class="list-container"></div>
        <div id="missingItems" class="list-container"></div>
    </div>
</div>

<div id="addModal" class="custom-modal">
    <div class="modal-content">
        <div class="close-x" onclick="closeModal('addModal')">✕</div>
        <input type="text" id="addInput" placeholder="Termék neve...">
        <button onclick="addItem()" style="width:100%; padding:15px; border-radius:12px; border:none; background:var(--primary); color:white; font-weight:bold;">MEHET</button>
    </div>
</div>

<div id="infoModal" class="custom-modal">
    <div class="modal-content">
        <div class="close-x" onclick="closeModal('infoModal')">✕</div>
        <h3 id="infoTitle" style="margin-top:0; text-align:center;"></h3>
        <textarea id="infoNote" placeholder="Megjegyzés ide..."></textarea>
        <label style="display:block; text-align:center; padding:10px; background:#333; border-radius:10px; cursor:pointer; font-size:13px; margin-bottom:10px;">
            📷 Fotó hozzáadása <input type="file" accept="image/*" style="display:none" onchange="upImg(this)">
        </label>
        <div id="imgCont" style="display:none; position:relative;">
            <img id="infoImg" style="width:100%; border-radius:10px; margin-bottom:10px;">
            <button onclick="delImg()" style="position:absolute; top:5px; right:5px; background:red; border:none; color:white; border-radius:50%; width:25px; height:25px;">×</button>
        </div>
        <button onclick="saveInfo()" style="width:100%; padding:12px; background:var(--primary); border:none; color:white; border-radius:10px;">MENTÉS</button>
    </div>
</div>

<script>
    const firebaseConfig = { apiKey: "AIzaSyC0fhL9VVErpN9LX6eJ8Tv5nuxF5Ea-qjE", databaseURL: "https://kozoslista-e0717-default-rtdb.europe-west1.firebasedatabase.app", projectId: "kozoslista-e0717" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const listRef = db.ref('shoppingList');

    let curId = null;

    function openModal(id) { document.getElementById(id).style.display = 'flex'; }
    function closeModal(id) { document.getElementById(id).style.display = 'none'; }

    function addItem() {
        const val = document.getElementById('addInput').value.trim();
        if(val) { listRef.push({ text: val, status: 'active', order: Date.now() }); closeModal('addModal'); document.getElementById('addInput').value=""; }
    }

    listRef.on('value', snap => {
        const data = snap.val() || {};
        const conts = { active: document.getElementById('activeItems'), done: document.getElementById('doneItems'), x: document.getElementById('missingItems') };
        Object.values(conts).forEach(c => c.innerHTML = '');

        Object.keys(data).forEach(id => {
            const it = data[id];
            const wrap = document.createElement('div');
            wrap.className = 'item-wrapper';
            wrap.innerHTML = `<div class="delete-reveal" onclick="listRef.child('${id}').remove()">TÖRLÉS</div>`;
            
            const div = document.createElement('div');
            div.className = 'item';
            div.dataset.id = id;
            div.dataset.order = it.order || 0;
            
            const hasExtra = (it.note || it.photo) ? 'has-data' : '';
            const handle = it.status === 'active' ? `<div class="drag-handle">≡</div>` : '';
            
            div.innerHTML = `${handle}<span style="flex:1">${it.text}</span>
                <div style="display:flex; gap:5px;">
                    <button class="btn-sm ${hasExtra}" onclick="openInfo('${id}')">ℹ️</button>
                    ${it.status === 'active' ? 
                    `<button class="btn-sm" style="background:var(--success)" onclick="listRef.child('${id}').update({status:'done'})">✔</button>
                     <button class="btn-sm" style="background:var(--danger)" onclick="listRef.child('${id}').update({status:'x'})">✖</button>` : 
                    `<button class="btn-sm" onclick="listRef.child('${id}').update({status:'active'})">↩</button>`}
                </div>`;
            
            if(it.status === 'active') initDrag(div, wrap);
            initSwipe(div);
            
            const target = it.status === 'done' ? conts.done : (it.status === 'x' ? conts.x : conts.active);
            target.appendChild(wrap);
            
            // Sorrendezés az aktív listában
            if(it.status === 'active') {
                const all = Array.from(conts.active.children);
                all.sort((a,b) => a.querySelector('.item').dataset.order - b.querySelector('.item').dataset.order);
                all.forEach(el => conts.active.appendChild(el));
            }
        });
    });

    function openInfo(id) {
        curId = id;
        listRef.child(id).once('value', s => {
            const it = s.val();
            document.getElementById('infoTitle').innerText = it.text;
            document.getElementById('infoNote').value = it.note || "";
            const img = document.getElementById('infoImg');
            if(it.photo) { img.src = it.photo; document.getElementById('imgCont').style.display='block'; }
            else { document.getElementById('imgCont').style.display='none'; }
            openModal('infoModal');
        });
    }

    function saveInfo() { listRef.child(curId).update({ note: document.getElementById('infoNote').value }); closeModal('infoModal'); }
    
    function upImg(input) {
        if (!input.files[0]) return;
        const reader = new FileReader();
        reader.onload = (e) => {
            const img = new Image();
            img.onload = () => {
                const canvas = document.createElement('canvas');
                let w = img.width, h = img.height, max = 500;
                if (w > max) { h *= max/w; w = max; }
                canvas.width = w; canvas.height = h;
                canvas.getContext('2d').drawImage(img,0,0,w,h);
                listRef.child(curId).update({ photo: canvas.toDataURL('image/jpeg', 0.6) }).then(() => openInfo(curId));
            };
            img.src = e.target.result;
        };
        reader.readAsDataURL(input.files[0]);
    }

    function delImg() { if(confirm("Törlöd a fotót?")) listRef.child(curId).update({ photo: "" }).then(() => openInfo(curId)); }

    function startVoice() {
        const rec = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
        rec.lang = 'hu-HU';
        const btn = document.getElementById('micBtn');
        btn.classList.add('recording');
        rec.onresult = (e) => {
            const t = e.results[0][0].transcript;
            listRef.push({ text: t.charAt(0).toUpperCase() + t.slice(1), status: 'active', order: Date.now() });
        };
        rec.onend = () => btn.classList.remove('recording');
        rec.start();
    }

    function toggleNotif() {
        Notification.requestPermission().then(p => { if(p==='granted') document.getElementById('notifBtn').style.background = 'var(--success)'; });
    }

    function initSwipe(el) {
        let sX = 0;
        el.addEventListener('touchstart', e => sX = e.touches[0].clientX);
        el.addEventListener('touchmove', e => { let dX = sX - e.touches[0].clientX; if(dX > 20 && dX < 90) el.style.transform = `translateX(-${dX}px)`; });
        el.addEventListener('touchend', e => el.style.transform = (sX - e.changedTouches[0].clientX > 50) ? 'translateX(-75px)' : 'translateX(0)');
    }

    function initDrag(el, wrap) {
        const h = el.querySelector('.drag-handle');
        h.addEventListener('pointerdown', e => {
            const cont = document.getElementById('activeItems');
            el.setPointerCapture(e.pointerId);
            wrap.style.opacity = "0.4";
            const onMove = ev => {
                const after = [...cont.querySelectorAll('.item-wrapper')].reduce((closest, child) => {
                    if(child === wrap) return closest;
                    const box = child.getBoundingClientRect();
                    const offset = ev.clientY - box.top - box.height/2;
                    return (offset < 0 && offset > closest.offset) ? { offset, element: child } : closest;
                }, { offset: Number.NEGATIVE_INFINITY }).element;
                if(after) cont.insertBefore(wrap, after); else cont.appendChild(wrap);
            };
            const onUp = () => {
                wrap.style.opacity = "1"; h.releasePointerCapture(e.pointerId);
                document.removeEventListener('pointermove', onMove);
                const up = {}; document.querySelectorAll('#activeItems .item').forEach((item, i) => up[item.dataset.id + '/order'] = i);
                listRef.update(up);
            };
            document.addEventListener('pointermove', onMove);
            document.addEventListener('pointerup', onUp, {once:true});
        });
    }
</script>
</body>
</html>
