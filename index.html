<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bevásárló lista v1.8.0</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-storage-compat.js"></script>

    <style>
        :root { 
            --bg: #121212; --card: #1e1e1e; --item: #2a2a2a; --text: #e0e0e0;
            --accent: #bb86fc; --success: #03dac6; --danger: #cf6679;
        }
        * { box-sizing: border-box; font-family: sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: var(--text); margin: 0; padding: 10px; display: flex; justify-content: center; }
        
        .container { width: 100%; max-width: 450px; background: var(--card); border-radius: 25px; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        
        /* Header & Controls */
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .room-tag { background: var(--accent); color: #000; padding: 5px 15px; border-radius: 15px; font-weight: bold; cursor: pointer; font-size: 14px; }
        
        /* Input Area */
        .add-btn { width: 100%; padding: 15px; border-radius: 15px; border: none; background: #333; color: white; font-weight: bold; margin-bottom: 20px; cursor: pointer; border: 1px dashed #555; }

        /* Items List - Single Column for Active */
        .item-card { 
            background: var(--item); padding: 12px; border-radius: 15px; margin-bottom: 10px;
            display: flex; align-items: center; gap: 10px; border-left: 4px solid var(--accent);
        }
        .item-info { flex: 1; overflow: hidden; }
        .item-name { font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .item-note { font-size: 11px; color: #aaa; }

        /* Two Column Layout for Completed/Missing */
        .bottom-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; }
        .grid-col h4 { text-align: center; font-size: 12px; color: var(--accent); text-transform: uppercase; margin-bottom: 10px; }
        
        .mini-card { 
            padding: 10px; border-radius: 12px; margin-bottom: 8px; font-size: 13px;
            display: flex; flex-direction: column; align-items: center; text-align: center;
        }
        .bg-success { border: 1px solid var(--success); color: var(--success); }
        .bg-danger { border: 1px solid var(--danger); color: var(--danger); }

        /* Modals */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 100; align-items: center; justify-content: center; padding: 20px; }
        .modal-inner { background: var(--card); width: 100%; border-radius: 20px; padding: 20px; border: 1px solid #444; }
        input, textarea { width: 100%; padding: 12px; margin-bottom: 10px; background: #000; border: 1px solid #333; color: white; border-radius: 10px; }

        .img-preview { width: 40px; height: 40px; border-radius: 8px; object-fit: cover; background: #444; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <span class="room-tag" onclick="changeRoom()">SZOBA: <span id="roomNum">----</span></span>
        <button onclick="clearAll()" style="background:none; border:none; font-size:20px; cursor:pointer;">🗑️</button>
    </div>

    <h2 style="text-align:center; letter-spacing:2px;">BEVÁSÁRLÓ LISTA</h2>
    <div id="userStatus" style="text-align:center; font-size:11px; color:#888; margin-bottom:15px;">Betöltés...</div>

    <button class="add-btn" onclick="showModal('addModal')"> + ÚJ TÉTEL / KÉP HOZZÁADÁSA</button>

    <div id="activeList"></div>

    <div class="bottom-grid">
        <div class="grid-col">
            <h4>Megvan</h4>
            <div id="doneList"></div>
        </div>
        <div class="grid-col">
            <h4>Nincs</h4>
            <div id="missingList"></div>
        </div>
    </div>
</div>

<div id="addModal" class="modal">
    <div class="modal-inner">
        <h3>Új tétel</h3>
        <input type="text" id="itemName" placeholder="Termék neve (pl. Tej)">
        <textarea id="itemNote" placeholder="Megjegyzés..."></textarea>
        <input type="file" id="itemImg" accept="image/*" style="font-size:12px;">
        <button onclick="saveItem()" style="width:100%; padding:15px; background:var(--accent); border:none; border-radius:10px; font-weight:bold;">MENTÉS</button>
        <button onclick="hideModal('addModal')" style="width:100%; background:none; border:none; color:#888; margin-top:10px;">Mégse</button>
    </div>
</div>

<script>
    const firebaseConfig = { apiKey: "AIzaSyC0fhL9VVErpN9LX6eJ8Tv5nuxF5Ea-qjE", databaseURL: "https://kozoslista-e0717-default-rtdb.europe-west1.firebasedatabase.app", storageBucket: "kozoslista-e0717.appspot.com" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const storage = firebase.storage();

    let roomId = localStorage.getItem('roomId') || "2316";
    document.getElementById('roomNum').innerText = roomId;

    function render() {
        db.ref('shoppingLists/' + roomId).on('value', snap => {
            const data = snap.val();
            const activeDiv = document.getElementById('activeList');
            const doneDiv = document.getElementById('doneList');
            const missingDiv = document.getElementById('missingList');
            
            activeDiv.innerHTML = ''; doneDiv.innerHTML = ''; missingDiv.innerHTML = '';

            if(!data) return;

            Object.keys(data).forEach(id => {
                const it = data[id];
                const html = `
                    <div class="item-info">
                        <div class="item-name">${it.text}</div>
                        <div class="item-note">${it.note || ''}</div>
                    </div>
                    ${it.img ? `<img src="${it.img}" class="img-preview" onclick="window.open('${it.img}')">` : ''}
                    <button onclick="setStatus('${id}', 'done')" style="background:var(--success); border:none; border-radius:8px; padding:8px;">✓</button>
                    <button onclick="setStatus('${id}', 'missing')" style="background:var(--danger); border:none; border-radius:8px; padding:8px;">X</button>
                `;

                if(it.status === 'active') {
                    const div = document.createElement('div'); div.className = 'item-card';
                    div.innerHTML = html; activeDiv.appendChild(div);
                } else {
                    const mini = document.createElement('div');
                    mini.className = `mini-card ${it.status === 'done' ? 'bg-success' : 'bg-danger'}`;
                    mini.innerHTML = `<b>${it.text}</b><span onclick="setStatus('${id}', 'active')" style="cursor:pointer; font-size:10px;">↺ VISSZA</span>`;
                    if(it.status === 'done') doneDiv.appendChild(mini); else missingDiv.appendChild(mini);
                }
            });
        });
    }

    async function saveItem() {
        const name = document.getElementById('itemName').value;
        const note = document.getElementById('itemNote').value;
        const file = document.getElementById('itemImg').files[0];
        let imgUrl = "";

        if(file) {
            const ref = storage.ref(`images/${roomId}/${Date.now()}`);
            await ref.put(file);
            imgUrl = await ref.getDownloadURL();
        }

        if(name) {
            db.ref('shoppingLists/' + roomId).push({ text: name, note: note, img: imgUrl, status: 'active' });
            hideModal('addModal');
        }
    }

    function setStatus(id, s) { db.ref(`shoppingLists/${roomId}/${id}`).update({status: s}); }
    function clearAll() { if(confirm("Törlöd az egész listát?")) db.ref('shoppingLists/' + roomId).remove(); }
    function changeRoom() { const n = prompt("Szoba kódja:", roomId); if(n) { localStorage.setItem('roomId', n); location.reload(); } }
    function showModal(id) { document.getElementById(id).style.display = 'flex'; }
    function hideModal(id) { document.getElementById(id).style.display = 'none'; }

    render();
</script>
</body>
</html>
