<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bevásárló lista v1.6.6</title>
    
    <link rel="apple-touch-icon" href="IMG_4302.png">
    <link rel="icon" type="image/png" href="IMG_4302.png">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    
    <style>
        :root { --bg: #0b0b0b; --card-bg: #1a1a1a; --item-bg: #262626; --text: #f0f0f0; --primary: #a87ff3; --success: #32a852; --danger: #eb4034; --grey: #333; --border: #444; }
        .light-mode { --bg: #d1d1d6; --card-bg: #f0f0f7; --item-bg: #ffffff; --text: #1c1c1e; --primary: #5856d6; --success: #34c759; --danger: #d66d6d; --grey: #e5e5ea; --border: #c7c7cc; }
        
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: -apple-system, sans-serif; user-select: none; -webkit-user-select: none; }
        body { background: var(--bg); color: var(--text); margin: 0; padding: 10px; display: flex; justify-content: center; min-height: 100vh; transition: background 0.3s; }
        
        .app-card { background: var(--card-bg); width: 100%; max-width: 400px; border-radius: 20px; padding: 15px; align-self: flex-start; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        
        .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; position: relative; }
        .mode-toggle { background: none; border: none; color: var(--text); font-size: 20px; cursor: pointer; padding: 5px; }
        .version-label { font-size: 10px; color: #444; position: absolute; left: 50%; transform: translateX(-50%); top: -5px; }
        
        .title-section { display: flex; flex-direction: column; align-items: center; gap: 5px; margin-bottom: 15px; }
        .room-selector-btn { border: none; color: white; font-size: 11px; font-weight: bold; cursor: pointer; padding: 8px 20px; border-radius: 20px; background-color: var(--grey); transition: 0.3s; text-transform: uppercase; min-width: 160px; }
        .user-count-label { font-size: 10px; color: #888; font-weight: bold; margin-top: 2px; }

        .col-label { font-size: 10px; text-align: center; color: #aaa; margin: 10px auto 8px; text-transform: uppercase; letter-spacing: 1px; background: var(--grey); padding: 4px 12px; border-radius: 20px; display: table; }
        .list-container { display: flex; flex-direction: column; gap: 8px; min-height: 20px; width: 100%; }
        
        .item-wrapper { position: relative; border-radius: 12px; overflow: hidden; background: transparent; width: 100%; isolation: isolate; }
        .delete-btn-bg { position: absolute; right: 1px; top: 1px; bottom: 1px; width: 78px; background: var(--danger); color: white; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: bold; z-index: 1; border-radius: 0 11px 11px 0; }
        
        .item { background: var(--item-bg); padding: 10px 12px; border-radius: 12px; display: flex; align-items: center; gap: 8px; position: relative; z-index: 5; transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1); border: 1.5px solid transparent; width: 100%; }
        .drag-handle { color: #555; font-size: 18px; padding-right: 2px; cursor: grab; flex-shrink: 0; }
        .item-text { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; min-width: 0; }
        
        .status-done { background: linear-gradient(rgba(50, 168, 82, 0.1), rgba(50, 168, 82, 0.1)), var(--card-bg) !important; border-color: var(--success) !important; }
        .status-x { background: linear-gradient(rgba(235, 64, 52, 0.1), rgba(235, 64, 52, 0.1)), var(--card-bg) !important; border-color: var(--danger) !important; }
        
        .btn-sm { width: 28px; height: 28px; border-radius: 7px; display: flex; align-items: center; justify-content: center; cursor: pointer; background: rgba(255,255,255,0.08); color: white; border: 1px solid transparent; flex-shrink: 0; font-size: 12px; }
        .has-data { border-color: var(--danger) !important; background: rgba(235, 64, 52, 0.1); }

        .bottom-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; width: 100%; }
        .sub-col { display: flex; flex-direction: column; width: 100%; overflow: hidden; }

        .custom-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 2000; justify-content: center; align-items: flex-start; padding: 40px 20px 20px; backdrop-filter: blur(5px); overflow-y: auto; }
        .modal-content { background: var(--card-bg); width: 100%; max-width: 350px; border-radius: 20px; padding: 15px; position: relative; border: 1px solid var(--border); display: flex; flex-direction: column; margin-top: 20px; }
        .close-x { position: absolute; top: 3px; right: 13px; font-size: 28px; color: var(--danger); cursor: pointer; z-index: 2001; }
        
        textarea, input[type="text"], input[type="number"] { width: 100%; padding: 12px; margin-bottom: 10px; border-radius: 10px; border: 1px solid var(--border); background: #000; color: #fff; outline: none; font-size: 14px; }
        .action-btn { width: 100%; padding: 15px; border-radius: 10px; border: none; background: var(--primary); color: white; font-weight: bold; cursor: pointer; font-size: 16px; margin-top: 10px; }
        
        .bug-label { font-size: 10px; color: #aaa; margin-left: 5px; margin-bottom: 5px; text-transform: uppercase; display: block; }
        .img-preview-box { width: 100%; max-height: 150px; object-fit: cover; border-radius: 10px; margin: 8px 0; border: 1px solid var(--border); }
        .info-box { background: rgba(255,255,255,0.03); padding: 10px; border-radius: 10px; margin-bottom: 10px; border: 1px solid rgba(255,255,255,0.05); }
    </style>
</head>
<body class="dark">

<div class="app-card">
    <div class="header-top">
        <button class="mode-toggle" onclick="toggleMode()">🌓</button>
        <div class="version-label">v1.6.6</div>
        <div style="display:flex; gap:12px; align-items: center;">
            <button onclick="openModal('bugModal')" style="background:none; border:none; font-size:20px; cursor:pointer;">✉️</button>
            <button onclick="clearAllItems()" style="background:none; border:none; font-size:20px; opacity:0.3; cursor:pointer;">🗑️</button>
        </div>
    </div>
    
    <div class="title-section">
        <h2 style="text-align:center; font-size:18px; margin:0; letter-spacing:1px; font-weight:900;">BEVÁSÁRLÓ LISTA</h2>
        <button id="roomBtn" class="room-selector-btn" onclick="openModal('listModal')">Szoba: ----</button>
        <div id="userCount" class="user-count-label">Jelenleg -- fő tartózkodik a szobában/<>div>
    </div>

    <button onclick="openModal('inputModal')" style="width:100%; padding:14px; border-radius:12px; border:none; background:var(--grey); color:var(--text); font-weight:bold; cursor:pointer; margin-bottom:20px; font-size:14px;">HOZZÁADÁS</button>

    <div class="col-label" id="activeCountLabel">Aktív tételek (0)</div>
    <div id="activeItems" class="list-container"></div>

    <div class="bottom-grid">
        <div class="sub-col"><div class="col-label">Megvan</div><div id="doneItems" class="list-container"></div></div>
        <div class="sub-col"><div class="col-label">Nincs</div><div id="missingItems" class="list-container"></div></div>
    </div>
</div>

<div id="bugModal" class="custom-modal">
    <div class="modal-content">
        <div class="close-x" onclick="closeModal('bugModal')">×</div>
        <h3 style="text-align:center; margin-top:10px; margin-bottom:15px;">Visszajelzés ✉️</h3>
        <label class="bug-label">💡 Név (Opcionális)</label>
        <input type="text" id="bugName" placeholder="Hogy szólíthatunk?">
        <label class="bug-label">💡 Email (Opcionális)</label>
        <input type="text" id="bugEmail" placeholder="visszajelzes@pelda.hu">
        <label class="bug-label">💡 Discord név (Opcionális)</label>
        <input type="text" id="bugDiscord" placeholder="felhasznalo">
        <label class="bug-label">💡 Javaslat / Hiba (Kötelező)</label>
        <textarea id="bugText" placeholder="Írd le mi történt vagy mit szeretnél..." rows="3"></textarea>
        <label style="display:block; text-align:center; padding:10px; background:var(--grey); border-radius:8px; margin-bottom:10px; cursor:pointer; color: white; font-size: 12px; font-weight:bold;">📷 KÉP CSATOLÁSA (Opcionális)<input type="file" id="bugPhotoFile" accept="image/*" style="display:none" onchange="previewBugPhoto(this)"></label>
        <img id="bugPhotoPreview" style="width:100%; max-height:100px; object-fit:contain; display:none; margin-bottom:10px; border-radius:8px;">
        <button class="action-btn" id="sendBugBtn" onclick="sendBugReport()">KÜLDÉS</button>
    </div>
</div>

<div id="infoModal" class="custom-modal">
    <div class="modal-content">
        <div class="close-x" onclick="closeModal('infoModal')">×</div>
        <h3 id="infoTitle" style="text-align:center; word-break:break-all; margin: 25px 0 15px;"></h3>
        <div id="viewArea">
            <div class="info-box"><div id="noteDisplay" style="font-size:13px; text-align:center; margin-bottom:10px; color:#ccc; word-wrap: break-word; overflow-wrap: anywhere;"></div><div class="info-actions" id="noteActions" style="display:flex; justify-content:center; gap:20px;"><button onclick="showEdit('note')" style="background:none; border:none; font-size:18px;">✏️</button><button onclick="deleteField('note')" style="background:none; border:none; font-size:18px;">🗑️</button></div><button id="addNoteBtn" onclick="showEdit('note')" style="width:100%; background:var(--grey); border:none; color:var(--text); padding:10px; border-radius:8px; font-weight:bold; font-size:12px;">+ Megjegyzés</button></div>
            <div class="info-box" style="text-align:center;"><img id="infoPhotoImg" class="img-preview-box" style="cursor:pointer;" onclick="window.open(this.src)"><div class="info-actions" id="photoActions" style="display:flex; justify-content:center; gap:20px;"><button onclick="showEdit('photo')" style="background:none; border:none; font-size:18px;">✏️</button><button onclick="deleteField('photo')" style="background:none; border:none; font-size:18px;">🗑️</button></div><button id="addPhotoBtn" onclick="showEdit('photo')" style="width:100%; background:var(--grey); border:none; color:var(--text); padding:10px; border-radius:8px; font-weight:bold; font-size:12px;">+ Fotó</button></div>
        </div>
        <div id="editArea" style="display:none;">
            <label id="editInstLabel" style="font-size:11px; color:#aaa; margin-bottom:5px; display:block;">Írd be a megjegyzést:</label>
            <div id="noteEditSection" style="display:none;"><textarea id="editNoteInput" rows="4" placeholder="Pl: 1.5%-os legyen..."></textarea></div>
            <div id="photoEditSection" style="display:none;"><label style="display:block; text-align:center; padding:12px; background:#333; border-radius:8px; margin-bottom:10px; cursor:pointer; color: white; font-size: 13px; font-weight:bold;">📷 ÚJ FOTÓ KIVÁLASZTÁSA<input type="file" id="editPhotoInput" accept="image/*" style="display:none" onchange="previewPhoto(this, 'editPhotoPreview')"></label><img id="editPhotoPreview" class="img-preview-box" style="display:none;"></div>
            <button class="action-btn" onclick="saveInfo()" style="background:var(--primary)">MENTÉS</button>
        </div>
    </div>
</div>

<div id="listModal" class="custom-modal"><div class="modal-content"><div class="close-x" onclick="closeModal('listModal')">×</div><h3 style="text-align:center;">Csatlakozás</h3><div style="text-align:center; margin:15px 0; padding:15px; background:rgba(255,255,255,0.05); border-radius:15px;"><div style="font-size:11px; color:#aaa;">AKTUÁLIS SZOBÁD</div><div id="myCurrentCode" style="font-size:32px; font-weight:900; letter-spacing:5px; color:var(--primary);">0000</div></div><input type="number" id="joinCodeInput" placeholder="Kód..." style="text-align:center; font-size:20px;"><button class="action-btn" onclick="joinByCode()" style="background:var(--success)">CSATLAKOZÁS</button><button class="action-btn" onclick="generateNewCode()" style="background:var(--grey); font-size:12px;">ÚJ KÓD</button></div></div>
<div id="inputModal" class="custom-modal"><div class="modal-content"><div class="close-x" onclick="closeModal('inputModal')">×</div><input type="text" id="manualInput" placeholder="Termék neve..." style="margin-top:20px;"><textarea id="manualNote" placeholder="Megjegyzés..."></textarea><label style="display:block; text-align:center; padding:12px; background:#333; border-radius:8px; margin-bottom:10px; cursor:pointer; color:white; font-size:13px;">📷 FOTÓ<input type="file" id="newPhotoFile" accept="image/*" style="display:none" onchange="previewPhoto(this, 'newPhotoPreview')"></label><img id="newPhotoPreview" class="img-preview-box" style="display:none;"><button class="action-btn" onclick="addItem()">HOZZÁADÁS</button></div></div>

<script>
    const firebaseConfig = { apiKey: "AIzaSyC0fhL9VVErpN9LX6eJ8Tv5nuxF5Ea-qjE", databaseURL: "https://kozoslista-e0717-default-rtdb.europe-west1.firebasedatabase.app", projectId: "kozoslista-e0717" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    
    let currentListId = localStorage.getItem('currentListId') || (Math.floor(1000 + Math.random() * 9000)).toString();
    localStorage.setItem('currentListId', currentListId);
    let listRef = db.ref('shoppingLists/' + currentListId);
    let presenceRef = db.ref('presence/' + currentListId);
    let myPresenceRef = null;

    const DISCORD_WEBHOOK_URL = "https://discord.com/api/webhooks/1097304257084018688/9uXJHFAgg4U19P4QOxuNIFzatGbfGjJmQntZqTp6qf9F4nlC_U7rlffLowivrcNu6_rM";
    let currentItemId = null, tempPhotoData = "", isSorting = false;

    function vibrate(ms = 30) { if (navigator.vibrate) navigator.vibrate(ms); }

    function initList() {
        document.getElementById('roomBtn').innerText = "Szoba: " + currentListId;
        document.getElementById('myCurrentCode').innerText = currentListId;

        if(myPresenceRef) myPresenceRef.remove();
        presenceRef.off();
        presenceRef = db.ref('presence/' + currentListId);
        myPresenceRef = presenceRef.push();
        myPresenceRef.set(true);
        myPresenceRef.onDisconnect().remove();

        presenceRef.on('value', snap => {
            const count = snap.numChildren();
            document.getElementById('userCount').innerText = `Jelenleg ${count} fő tartózkodik a szobában`;
        });

        listRef.off(); 
        listRef = db.ref('shoppingLists/' + currentListId);
        listRef.on('value', snap => { const d = snap.val(); const items = d ? Object.keys(d).map(k => ({id: k, ...d[k]})) : []; render(items); });
    }

    function render(items) {
        const containers = { active: 'activeItems', done: 'doneItems', x: 'missingItems' };
        Object.values(containers).forEach(id => document.getElementById(id).innerHTML = '');
        let activeCount = 0;
        items.sort((a,b) => (a.order || 0) - (b.order || 0)).forEach(it => {
            if(it.status === 'active') activeCount++;
            const wrap = document.createElement('div'); wrap.className = 'item-wrapper'; wrap.setAttribute('data-id', it.id);
            const del = document.createElement('div'); del.className = 'delete-btn-bg'; del.innerText = 'TÖRLÉS'; del.onclick = () => { vibrate(60); listRef.child(it.id).remove(); };
            const div = document.createElement('div'); div.className = `item ${it.status==='done'?'status-done':(it.status==='x'?'status-x':'')}`;
            const hasExtra = (it.note && it.note.trim()) || it.photo;
            div.innerHTML = `${it.status==='active'?'<div class="drag-handle">≡</div>':'<div style="width:2px"></div>'}<span class="item-text">${it.text}</span><div style="display:flex; gap:4px; margin-left:auto;"><button class="btn-sm ${hasExtra?'has-data':''}" onclick="openInfo('${it.id}')">ℹ️</button>${it.status==='active'?`<button class="btn-sm" style="background:var(--success)" onclick="updateStatus('${it.id}', 'done')">✔</button><button class="btn-sm" style="background:var(--danger)" onclick="updateStatus('${it.id}', 'x')">✖</button>`:`<button class="btn-sm" onclick="updateStatus('${it.id}', 'active')">↩</button>`}</div>`;
            
            let sX = 0, cX = 0;
            div.addEventListener('touchstart', e => { if(isSorting) return; sX = e.touches[0].clientX; div.style.transition = 'none'; }, {passive:true});
            div.addEventListener('touchmove', e => { if(isSorting) return; let diff = sX - e.touches[0].clientX; cX = Math.max(0, Math.min(diff, 85)); div.style.transform = `translateX(-${cX}px)`; }, {passive:true});
            div.addEventListener('touchend', () => { if(isSorting) return; div.style.transition = 'transform 0.3s cubic-bezier(0.18, 0.89, 0.32, 1.28)'; if (cX > 50) { vibrate(20); div.style.transform = 'translateX(-80px)'; } else { div.style.transform = 'translateX(0)'; cX = 0; } });
            
            wrap.appendChild(del); wrap.appendChild(div);
            document.getElementById(containers[it.status] || 'activeItems').appendChild(wrap);
        });
        document.getElementById('activeCountLabel').innerText = `Aktív tételek (${activeCount})`;
    }

    function openInfo(id) { 
        currentItemId = id; vibrate(15); 
        document.getElementById('viewArea').style.display = 'block'; 
        document.getElementById('editArea').style.display = 'none'; 
        listRef.child(id).once('value', snap => { 
            const it = snap.val(); 
            document.getElementById('infoTitle').innerText = it.text; 
            const nD = document.getElementById('noteDisplay'), nA = document.getElementById('noteActions'), nB = document.getElementById('addNoteBtn');
            if(it.note){ nD.innerText = it.note; nD.style.display='block'; nA.style.display='flex'; nB.style.display='none'; document.getElementById('editNoteInput').value = it.note; } 
            else { nD.style.display='none'; nA.style.display='none'; nB.style.display='block'; document.getElementById('editNoteInput').value = ""; }
            const pI = document.getElementById('infoPhotoImg'), pA = document.getElementById('photoActions'), pB = document.getElementById('addPhotoBtn');
            if(it.photo){ pI.src = it.photo; pI.style.display='block'; pA.style.display='flex'; pB.style.display='none'; } 
            else { pI.style.display='none'; pA.style.display='none'; pB.style.display='block'; }
            openModal('infoModal'); 
        }); 
    }

    function showEdit(type) { vibrate(15); document.getElementById('viewArea').style.display = 'none'; document.getElementById('editArea').style.display = 'block'; document.getElementById('editInstLabel').style.display = type === 'note' ? 'block' : 'none'; document.getElementById('noteEditSection').style.display = type === 'note' ? 'block' : 'none'; document.getElementById('photoEditSection').style.display = type === 'photo' ? 'block' : 'none'; }
    function saveInfo() { const noteValue = document.getElementById('editNoteInput').value; listRef.child(currentItemId).once('value', snap => { const it = snap.val(); const fNote = document.getElementById('noteEditSection').style.display === 'block' ? noteValue : (it.note || ""); const fPhoto = document.getElementById('photoEditSection').style.display === 'block' ? tempPhotoData : (it.photo || ""); listRef.child(currentItemId).update({ note: fNote, photo: fPhoto }).then(() => { tempPhotoData = ""; document.getElementById('editNoteInput').value = ""; document.getElementById('editPhotoPreview').style.display = 'none'; vibrate(30); openInfo(currentItemId); }); }); }
    function deleteField(f) { if(confirm("Törlöd?")) { vibrate(50); let u = {}; u[f] = ""; listRef.child(currentItemId).update(u).then(() => { openInfo(currentItemId); }); } }
    function previewPhoto(i, pId) { if(i.files && i.files[0]) { const r = new FileReader(); r.onload = e => { tempPhotoData = e.target.result; const p = document.getElementById(pId); p.src = tempPhotoData; p.style.display='block'; }; r.readAsDataURL(i.files[0]); } }
    function updateStatus(id, status) { vibrate(40); listRef.child(id).update({status: status}); }
    function addItem() { const v = document.getElementById('manualInput').value.trim(); if(v) { vibrate(50); listRef.push({ text: v, note: document.getElementById('manualNote').value, photo: tempPhotoData, status: 'active', order: Date.now() }); closeModal('inputModal'); } }
    function openModal(id) { document.getElementById(id).style.display = 'flex'; }
    function closeModal(id) { document.getElementById(id).style.display = 'none'; tempPhotoData = ""; if(id==='inputModal'){ document.getElementById('newPhotoPreview').style.display='none'; document.getElementById('manualInput').value=''; document.getElementById('manualNote').value=''; } }
    function toggleMode() { vibrate(20); document.body.classList.toggle('light-mode'); }
    function generateNewCode() { const newCode = (Math.floor(1000 + Math.random() * 9000)).toString(); if(confirm("Új szoba: " + newCode + "?")) { vibrate(50); updateRoom(newCode); } }
    function joinByCode() { const input = document.getElementById('joinCodeInput').value; if(input.length === 4) { vibrate(50); updateRoom(input); closeModal('listModal'); } }
    function updateRoom(code) { currentListId = code; localStorage.setItem('currentListId', code); initList(); }
    function clearAllItems() { if(confirm("Mindent törölsz?")) { vibrate(100); listRef.remove(); } }

    // BUG RIPORT v1.6.6 - Bot névvel és képpel
    let bugPhotoFile = null;
    function previewBugPhoto(input) { if (input.files && input.files[0]) { bugPhotoFile = input.files[0]; const reader = new FileReader(); reader.onload = function(e) { const prev = document.getElementById('bugPhotoPreview'); prev.src = e.target.result; prev.style.display = 'block'; }; reader.readAsDataURL(input.files[0]); } }
    function sendBugReport() {
        const name = document.getElementById('bugName').value.trim() || "Névtelen";
        const email = document.getElementById('bugEmail').value.trim() || "Nincs megadva";
        let discord = document.getElementById('bugDiscord').value.trim() || "Nincs megadva";
        const message = document.getElementById('bugText').value.trim();
        if(!message) { vibrate(100); alert("A leírás kitöltése kötelező!"); return; }
        if(discord !== "Nincs megadva" && !discord.startsWith('@')) discord = '@' + discord;
        const btn = document.getElementById('sendBugBtn'); btn.innerText = "KÜLDÉS..."; btn.disabled = true;
        const currentMode = document.body.classList.contains('light-mode') ? "Világos" : "Sötét";
        
        const formData = new FormData();
        const payload = {
            username: "Bevásárló lista", // Bot neve az app címe
            avatar_url: "https://github.com/oneill944/shop/blob/altv-athena-private/IMG_4302.png", // Itt az app ikonja (Ha elérhető linkről)
            embeds: [{
                title: "✉️ Új Visszajelzés", color: 15548997, 
                fields: [
                    { name: "Verzió", value: "v1.6.6", inline: true },
                    { name: "Szoba", value: currentListId, inline: true },
                    { name: "Küldő", value: name, inline: true },
                    { name: "Email", value: email, inline: true },
                    { name: "Discord", value: discord, inline: true },
                    { name: "Mód", value: currentMode, inline: true },
                    { name: "Javaslat / Hiba", value: message }
                ],
                image: bugPhotoFile ? { url: 'attachment://report_image.png' } : null,
                footer: { text: "Beküldve: " + new Date().toLocaleString('hu-HU') }
            }]
        };
        formData.append('payload_json', JSON.stringify(payload));
        if (bugPhotoFile) formData.append('file', bugPhotoFile, 'report_image.png');
        fetch(DISCORD_WEBHOOK_URL, { method: 'POST', body: formData }).then(() => {
            vibrate(100); alert("Köszönjük! Elküldve.");
            document.getElementById('bugText').value = ""; document.getElementById('bugName').value = ""; document.getElementById('bugEmail').value = ""; document.getElementById('bugDiscord').value = "";
            document.getElementById('bugPhotoPreview').style.display = 'none'; bugPhotoFile = null; closeModal('bugModal');
        }).catch(err => { alert("Hiba: " + err); }).finally(() => { btn.innerText = "KÜLDÉS"; btn.disabled = false; });
    }

    initList();
    new Sortable(document.getElementById('activeItems'), { handle: '.drag-handle', animation: 200, onStart: () => { vibrate(40); isSorting = true; }, onEnd: () => { isSorting = false; document.querySelectorAll('#activeItems .item-wrapper').forEach((el, index) => { listRef.child(el.getAttribute('data-id')).update({ order: Date.now() + index }); }); } });
</script>
</body>
</html>
